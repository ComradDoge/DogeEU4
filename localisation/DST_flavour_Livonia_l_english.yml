l_english:
 lva_refound_livonian_order_title: "§T@LIV Refound the Livonian Order§!"
 lva_refound_livonian_order_desc: "For two centuries the Livonian Order ruled these lands from its castle at Wenden, until the shattering broke it along with every other old power. The Latvian lords took Livland back, and the old gods with it. Now that the crown has been baptised into the Roman church, the last brethren still holding out around Wenden ask to be heard."

 dse_flavour_livonia.1.t: "What We Once Were"
 dse_flavour_livonia.1.d: "The brethren who came to court are few and grey, but they still wear the white mantles and keep the Order's rule. They offer what they have left: their name, their castles around Wenden and the favour of Rome. In return the crown would take the Order's vows and rule as its Master. On what the Order is for, they are divided. The older knights want the crusade back, against the heathens and schismatics on our borders, as it was before the shattering. The younger ones say the crusades are over, and that the Order should become the core of a new Livonian state."
 dse_flavour_livonia.1.a: "What we once were"
 dse_flavour_livonia.1.b: "A better purpose"
 dse_flavour_livonia.1.a.tt: "Gain §Ypermanent claims§! on every province of a non-Catholic neighbour that borders our own."

 liv_sword_brethren_returned_modifier: "Brethren Returned"
 desc_liv_sword_brethren_returned_modifier: "The surviving knights of the Order are back in Livland's castles, and they are eager to take the field again."
 liv_order_new_purpose_modifier: "A New Purpose"
 desc_liv_order_new_purpose_modifier:0 "The Order has set the crusade aside for a new task: building a Livonian state of its own."
