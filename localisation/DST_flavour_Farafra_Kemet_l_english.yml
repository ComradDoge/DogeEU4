 #### Decisions (decisions/DST_Kemet_Houses.txt)
 kemet_restore_house_of_sutekh_title: "@[Root.GetTag] Restore the House of Sutekh"
 kemet_restore_house_of_sutekh_desc: "The shrine of Sutekh, better known as Seth, at Farafreh can be rebuilt into a proper house for the lord of the desert. The oasis will take back its old name, Ta-iht."
 kemet_restore_house_of_heru_title: "@[Root.GetTag] Restore the House of Heru"
 kemet_restore_house_of_heru_desc: "The ruins of the falcon temple of Heru, Horus to the Greeks, lie south of Isna, at the place the old kings called Behedet."
 kemet_restore_house_of_aset_title: "@[Root.GetTag] Restore the House of Aset"
 kemet_restore_house_of_aset_desc: "By the first cataract at Aswan, old Swenett, stand the ruins of the House of Aset, Isis to the Greeks, mother of Heru and protector of kings."
 kemet_restore_house_of_wsir_title: "@[Root.GetTag] Restore the House of Wsir"
 kemet_restore_house_of_wsir_desc: "Abdju, beside Girga (Jarajanaan), was the holy city of Wsir, Osiris to the Greeks, lord of the dead. His house there can be raised again."
 kemet_restore_house_of_amun_title: "@[Root.GetTag] Restore the House of Amun-Ra"
 kemet_restore_house_of_amun_desc: "By Qus lies Waset, the city of Amun-Ra, the hidden god joined with Ra, king of the gods, with the ruins of the greatest temple in Kemet."
 kemet_restore_house_of_ptah_title: "@[Root.GetTag] Restore the House of Ptah"
 kemet_restore_house_of_ptah_desc: "A short way south of Cairo lie the ruins of Men-nefer and its House of Ptah, the craftsman god."
 kemet_restore_house_of_sobek_title: "@[Root.GetTag] Restore the House of Sobek"
 kemet_restore_house_of_sobek_desc: "Shedet, by the lake of Fayyum, was the city of the crocodile god Sobek. His house can stand again."
 kemet_restore_house_of_djehuty_title: "@[Root.GetTag] Restore the House of Djehuty"
 kemet_restore_house_of_djehuty_desc: "Khemenu, by Minya, was the city of Djehuty, Thoth to the Greeks, the ibis-headed god of writing and reckoning."

 #### Privileges and reforms
 kemet_house_of_life_privilege: "The Houses of Life"
 kemet_house_of_life_privilege_desc: "The temples keep schools and libraries, the Per Ankh of old, where scribes copy the sacred books, keep the records of the realm and teach those who will follow them."

 #### Opinion
 faf_seized_the_temple_treasure: "Seized the Temple's Treasury"

 #### Farafra events (events/_DSE_flavour_Farafra.txt)
 faf_events.1.t: "The Crowning at Abdju"
 faf_events.1.d: "The crowns are ready: the white of the south set into the red of the north, as the old kings wore them. The question is who sets them on [Root.Monarch.GetName]'s head. The priests of Wsir say it must be done in their temple, as it was in the beginning. The captains want it done before the men who won the river. The headmen of the river towns, Muslims and Copts among them, ask only to be there."
 faf_events.1.a: "Before the priests of Wsir"
 faf_events.1.b: "Before the host"
 faf_events.1.c: "Before the people of the river"
 faf_events.2.t: "Where Shall the Throne Sit?"
 faf_events.2.d: "Cairo is ours: a city of mosques, markets and countless people, where every road in Egypt ends. But the oases are where our people come from, and some of the council would rather the throne stayed in the desert, out of reach of the river's quarrels."
 faf_events.2.a: "Rule from Cairo"
 faf_events.2.b: "The throne stays where it is"
 faf_events.3.t: "The Caravan Masters"
 faf_events.3.d: "The masters of the Kharga caravans have come to court with gifts and a question. They already pay the wells and the guides. Will they now pay the throne as well, or will the throne's riders see them safely to the river and leave the taxing to the markets?"
 faf_events.3.a: "Tax every load at the wells"
 faf_events.3.b: "Ride with the caravans"
 faf_events.4.t: "The Knights of the Temple"
 faf_events.4.d: "The Templar commandery in Sharqiya has fallen to us, and its treasury with it: coin, plate and letters of credit drawn on houses across the sea. The knights taken there ask to march out with their arms and what they can carry. Letting them go would be remembered as honourable. Emptying the vaults would be remembered too, in every Catholic court across the sea."
 faf_events.4.a: "Open the treasury of the Temple"
 faf_events.4.b: "Let the knights ride out with their arms"
 faf_events.5.t: "The Vizier"
 faf_events.5.d: "Three names have been put forward for the office of tjaty: a lector priest of Djehuty who can read every script in the land, the captain who led the host down to the river, and a scribe from Kharga who has kept the caravan accounts for twenty years without a coin out of place."
 faf_events.5.a: "The priest of Djehuty"
 faf_events.5.b: "The captain of the host"
 faf_events.5.c: "The scribe from Kharga"

 #### Kemet events (events/_DSE_flavour_Kemet.txt)
 egp_events.1.t: "The Two Lands United"
 egp_events.1.d: "The proclamation has been read in every town under our rule: Kemet is a kingdom again, under one king. Now the court must decide where that king will sit. The first capital of the Two Lands was Men-nefer, in the province of [egp_menefer.GetName]. The kings who ruled from Kush to the Euphrates sat at Waset, the city of Amun, in the province of [egp_waset.GetName]."
 egp_events.1.a: "Rule from [egp_menefer.GetName]"
 egp_events.1.b: "Rule from [egp_waset.GetName]"
 egp_events.1.c: "The throne stays where it is"
 egp_events.2.t: "The Army of Kemet"
 egp_events.2.d: "The Medjay riders of the oases are ours to call on, but riders alone will not hold the Two Lands, and the generals bring three plans. One raises companies of archers, as the armies of the old kings had. Another trains horsemen to strike the flanks as the old chariots did. The last fills the ranks from the villages of the south, as many men as the land can give."
 egp_events.2.a: "The archer companies"
 egp_events.2.b: "The chariotry"
 egp_events.2.c: "The levies of the south"
 egp_events.3.t: "The Festival of Opet"
 egp_events.3.d: "The priests have carried Amun's barque out of his temple on their shoulders, and all of [egp_waset.GetName] has come down to the river bank. By old custom the king walks beside the god to the southern temple, where the two are renewed together."
 egp_events.3.a: "Walk beside the barque"
 egp_events.3.b: "Feed the city"
 egp_events.3.c: "Leave the festival to the priests"
 egp_events.4.t: "The Expedition to Punt"
 egp_events.4.d: "Our ships are back from the south, riding low in the water. Far down the Red Sea they found the coast the old texts call Punt, traded with its chiefs and brought home incense trees in baskets, gold, ebony and ivory. The court must decide what the voyage was for."
 egp_events.4.a: "The incense trees, for the gods"
 egp_events.4.b: "Gold, ebony and ivory, for the treasury"
 egp_events.4.c: "A pact with the chiefs of Punt"
 egp_events.5.t: "The Library of Alexandria"
 egp_events.5.d: "The new library has walls and shelves; now it needs books. The translators want money to buy Greek and Arabic works wherever they are sold. The priests want the temple archives copied and kept here. A third party wants the doors left open to any scholar of any faith who comes."
 egp_events.5.a: "The translators"
 egp_events.5.b: "The temple archives"
 egp_events.5.c: "Open the doors to every scholar"
 egp_events.6.t: "Retjenu"
 egp_events.6.d: "Jerusalem is ours. Pilgrims of three faiths walk to its shrines every year, and every road to its gates now runs past our posts. We can keep the roads safe and let the city grow rich on their coming, or make each of them pay at the gate."
 egp_events.6.a: "Guard the pilgrim road"
 egp_events.6.b: "Every pilgrim pays at the gate"

 #### Faith events (events/_DSE_flavour_Kemet_Faith.txt)
 kemet_events.1.t: "The People of the River"
 kemet_events.1.d: "The river towns pray in mosques and churches, and the gods we serve are idols to them. The priests of the oases say the Neteru must return to every town on the Nile, as it was in the beginning. Others at court answer that Ma'at, the order of the world, has always meant keeping the land in balance, and that a balanced land has room for every faith that keeps the peace."
 kemet_events.1.a: "The Scales of Ma'at"
 kemet_events.1.b: "The Return of the Neteru"
 kemet_events.2.t: "The Keepers of the Dead"
 kemet_events.2.d: "The families who guard the necropolis of Bahiriya have kept their duty for longer than anyone can count. They ask that it become law: that the dead of the royal house be prepared and buried in the old way, and that the temples hold enough land to pay for it. In return, they say, no king's death will ever again leave the realm without order."
 kemet_events.2.a: "Grant the keepers their rights"
 kemet_events.2.b: "Not yet"
 kemet_events.house.a: "The priests keep the offerings"
 kemet_events.house.c: "The works are lost"
 kemet_events.house.lost: "The province where the house was being rebuilt is no longer ours. The masons have gone home, and the priests with them."
 kemet_events.10.t: "The House of Sutekh"
 kemet_events.10.d: "The House of Sutekh stands again at Farafreh, and the oasis takes back its old name, Ta-iht. The god's red banners hang over the gate. Sutekh is the lord of the desert and of storms, and the riders of the oases have always made their offerings to him before a raid."
 kemet_events.10.b: "The lord of the desert rides with us"
 kemet_events.11.t: "The House of Heru"
 kemet_events.11.d: "The falcon temple of Heru rises again at Behedet, south of Isna, and the province now bears the old name. Every king of Kemet was Heru on earth, and the priests remind us of it at every opportunity."
 kemet_events.11.b: "The falcon flies over the army"
 kemet_events.12.t: "The House of Aset"
 kemet_events.12.d: "By the first cataract at Aswan the House of Aset is restored, and the town is called Swenett again. Aset, mother of Heru, protects kings and their heirs, and pilgrims are already arriving by boat."
 kemet_events.12.b: "The mother of kings"
 kemet_events.13.t: "The House of Wsir"
 kemet_events.13.d: "Abdju, beside Girga (Jarajanaan), was the holiest place of Wsir, lord of the dead, whose tomb the faithful believed lay there. With his house restored, the processions of the living and the burials of the dead can begin again."
 kemet_events.13.b: "Open the road to the pilgrims"
 kemet_events.14.t: "The House of Amun-Ra"
 kemet_events.14.d: "Waset, by Qus, has its great house of Amun-Ra again. Its estates once held a tenth of the land of Egypt, and the new priests have already asked for the old boundary stones to be set back up."
 kemet_events.14.b: "The god's estates pay their due"
 kemet_events.15.t: "The House of Ptah"
 kemet_events.15.d: "Where Men-nefer once stood, a short way south of Cairo, the House of Ptah is restored. Ptah is the craftsman god who made the world by speaking it, and the city's guilds have taken him as their patron."
 kemet_events.15.b: "The workshops of the craftsman god"
 kemet_events.16.t: "The House of Sobek"
 kemet_events.16.d: "The crocodile god Sobek has his house again at Shedet, by the lake of Fayyum. The priests have found a crocodile worthy of the god's pool, and the fishermen of the lake bring it their first catch."
 kemet_events.16.b: "The lake and its fishermen"
 kemet_events.17.t: "The House of Djehuty"
 kemet_events.17.d: "At Khemenu, by Minya, the House of Djehuty stands again. Djehuty is the ibis-headed god of writing and reckoning, and his priests were the best scribes in Kemet. Their school is full already."
 kemet_events.17.b: "The scribes of the ibis"
 kemet_events.20.t: "The Inundation"
 kemet_events.20.d: "This year the flood rose high and stayed long over [kemet_flood_province.GetName], and the fields there have never looked so black. The granary officials already have their tally sticks out."
 kemet_events.20.a: "The surplus goes to the state granaries"
 kemet_events.20.b: "Leave it with the farmers"
 kemet_events.21.t: "The High Flood"
 kemet_events.21.d: "The river rose faster than anyone remembers and broke the dykes at [kemet_flood_province.GetName]. Villages stand in the water up to their roofs."
 kemet_events.21.d_nilometers: "The nilometers gave warning weeks ago that this year's flood would run too high. At [kemet_flood_province.GetName] the river has reached the dykes, and the officials ask whether to spend what it takes to hold them."
 kemet_events.21.a: "Raise the dykes and save what we can"
 kemet_events.21.b: "Let the river have its year"
 kemet_events.22.t: "Raiders from the Sand"
 kemet_events.22.d: "Desert raiders have been striking the villages around [kemet_raided_province.GetName], taking cattle and grain and vanishing into the sand before any garrison can ride out."
 kemet_events.22.a: "Send the riders after them"
 kemet_events.22.b: "Pay the sheikhs to ride elsewhere"
 kemet_events.22.c: "The Medjay know these men"
 kemet_events.23.t: "A Tomb in the Sand"
 kemet_events.23.d: "Shepherds near [kemet_tomb_province.GetName] have found a stairway cut into the rock, half buried in sand, leading down to a sealed door. The seals are unbroken, and the first men to crawl inside by lamplight came back saying a forgotten king lies there with all his gold."
 kemet_events.23.a: "Seal it again with the old rites"
 kemet_events.23.b: "Take the gold"
 kemet_events.23.c: "Give it to the scholars"
 kemet_events.30.t: "A Child in the Reeds"
 kemet_events.30.d: "Walking by the river at dawn, [Root.Monarch.GetName] found a basket caught in the reeds with a sleeping child inside. The priests of Heru say the god himself was hidden in the marshes as a child, and that this is his sign."
 kemet_events.30.a: "Raise the child as our heir"
 kemet_events.30.b: "The child belongs with its mother"
 kemet_events.31.t: "The Heb Sed"
 kemet_events.31.d: "[Root.Monarch.GetName] has reigned for thirty years. By the oldest custom of Kemet, a king who reaches this point must run the ritual course before the gods and the court, to show that the strength to rule has not left them. The festival is costly, and the king is no longer young."
 kemet_events.31.a: "Run the course before the gods"
 kemet_events.31.b: "The king has nothing to prove"
 kemet_events.32.t: "The Temple Endowments"
 kemet_events.32.d: "The priests of the restored houses have sent their accounts to court. Offerings, lamps, incense and the wages of the temple workers all have to be paid, and the houses cannot manage it alone."
 kemet_events.32.a: "Gold for the offering tables"
 kemet_events.32.b: "Fields for the temple estates"
 kemet_events.32.c: "The gods have more gold than we do"
 kemet_events.33.t: "The Duties of a King"
 kemet_events.33.d: "The High Priest has died. In theory the king is the only true priest of Kemet and every offering is made in the king's name; in practice the work has always fallen to others. The court must decide who will stand before the gods now."
 kemet_events.33.a: "The king will make the offerings"
 kemet_events.33.b: "Raise a new High Priest"
 kemet_events.33.c: "Give the office to a noble house"
 kemet_events.34.t: "A New Apis Bull"
 kemet_events.34.d: "The priests of Ptah have found a black calf with a white diamond on its brow, the marks of the Apis, the living herald of Ptah. They ask that it be led to Men-nefer with full honours and kept in the god's stable for the rest of its life."
 kemet_events.34.a: "Lead him to Men-nefer with honour"
 kemet_events.34.b: "A bull is a bull"
 kemet_events.37.t: "The Last Journey"
 kemet_events.37.d: "The old king is dead. By custom the body lies seventy days with the embalmers before it is carried to the tomb with offerings for the journey through the underworld. The new reign begins with a question of cost and honour."
 kemet_events.37.a: "The full rites, as the old kings had them"
 kemet_events.37.b: "A simple burial"

 #### Modifiers (common/event_modifiers/DST_Kemet_modifiers.txt)
 kemet_house_under_construction_modifier: "House Under Restoration"
 desc_kemet_house_under_construction_modifier: "§gMasons and priests have the old temple walls half raised. Little else gets built here until they are done.§!"
 kemet_house_of_sutekh_modifier: "House of Sutekh"
 desc_kemet_house_of_sutekh_modifier: "§gThe house of Sutekh, lord of the red land, stands again at Ta-iht. Raiders who cross his desert seldom come back as many as they left.§!"
 kemet_house_of_heru_modifier: "House of Heru"
 desc_kemet_house_of_heru_modifier: "§gThe falcon temple of Behedet draws young men to the god of kings, and many of them stay to serve the king as well.§!"
 kemet_house_of_aset_modifier: "House of Aset"
 desc_kemet_house_of_aset_modifier: "§gPilgrims come by boat to the house of the mother of kings at Swenett, and some of them never leave.§!"
 kemet_house_of_wsir_modifier: "House of Wsir"
 desc_kemet_house_of_wsir_modifier: "§gAbdju is the holy city of the lord of the dead, and every family wants a stela or a grave near his house.§!"
 kemet_house_of_amun_modifier: "House of Amun-Ra"
 desc_kemet_house_of_amun_modifier: "§gThe estates of Amun-Ra at Waset run themselves, and their stewards keep better accounts than the crown's.§!"
 kemet_house_of_ptah_modifier: "House of Ptah"
 desc_kemet_house_of_ptah_modifier: "§gThe guilds of Men-nefer work under the eye of Ptah, the craftsman god, and their masters train in his house.§!"
 kemet_house_of_sobek_modifier: "House of Sobek"
 desc_kemet_house_of_sobek_modifier: "§gThe crocodile god watches over the lake of Shedet, its fishermen and the fields it waters.§!"
 kemet_house_of_djehuty_modifier: "House of Djehuty"
 desc_kemet_house_of_djehuty_modifier: "§gThe scribes of the ibis at Khemenu copy every new book that reaches the river, whatever its language.§!"
 kemet_shared_shrine_modifier: "A Shrine for All"
 desc_kemet_shared_shrine_modifier: "§gThe new house of the gods asks nothing of the town's mosques and churches, and the town has noticed.§!"
 kemet_scales_of_maat_modifier: "The Scales of Ma'at"
 desc_kemet_scales_of_maat_modifier: "Ma'at is balance, and a balanced land has room for every faith that keeps the peace."
 kemet_return_of_the_neteru_modifier: "The Return of the Neteru"
 desc_kemet_return_of_the_neteru_modifier: "The priests of the oases walk to the river towns with the images of the gods carried before them."
 kemet_the_order_of_maat_modifier: "The Order of Ma'at"
 desc_kemet_the_order_of_maat_modifier: "Mosque, church and temple stand side by side on the river, and the judges of the king answer to Ma'at alone."
 kemet_the_gods_returned_modifier: "The Neteru Have Returned"
 desc_kemet_the_gods_returned_modifier: "The old gods are served again in every town of the Black Land, as they were in the beginning."
 kemet_rich_flood_modifier: "Rich Flood"
 desc_kemet_rich_flood_modifier: "§gThe flood left a thick layer of black mud, and the farmers kept what it grew.§!"
 kemet_flood_damage_modifier: "Broken Dykes"
 desc_kemet_flood_damage_modifier: "§gThe river broke through the dykes and the fields are still drying out.§!"
 kemet_desert_patrols_modifier: "Desert Patrols"
 desc_kemet_desert_patrols_modifier: "§gRiders watch the desert tracks around the villages.§!"
 kemet_heb_sed_renewed_modifier: "Renewed by the Heb Sed"
 desc_kemet_heb_sed_renewed_modifier: "The king has run the course before the gods and shown that the strength to rule remains."
 kemet_no_heb_sed_modifier: "Refused the Heb Sed"
 desc_kemet_no_heb_sed_modifier: "The king would not run the course, and the court whispers about why."
 kemet_endowed_temples_modifier: "Endowed Temples"
 desc_kemet_endowed_temples_modifier: "The offering tables of the houses are full, and the priests know who filled them."
 kemet_the_king_as_priest_modifier: "The King as Priest"
 desc_kemet_the_king_as_priest_modifier: "The king makes the daily offerings in person, as the oldest texts say a king should."
 kemet_the_high_priest_modifier: "A New High Priest"
 desc_kemet_the_high_priest_modifier: "A capable High Priest runs the houses of the gods and sends preachers to the towns."
 kemet_the_apis_bull_modifier: "The Apis Bull"
 desc_kemet_the_apis_bull_modifier: "The living herald of Ptah has been led to Men-nefer, and the people see it as a sign of the god's favour."
 kemet_honoured_predecessor_modifier: "Honoured Predecessor"
 desc_kemet_honoured_predecessor_modifier: "The old king was buried with the full rites, and the new reign began well."
 kemet_dishonoured_predecessor_modifier: "Dishonoured Predecessor"
 desc_kemet_dishonoured_predecessor_modifier: "The old king was buried without the old rites, and many believe the new reign began under a curse."
 faf_the_wells_of_farafreh_modifier: "The Wells of Farafreh"
 desc_faf_the_wells_of_farafreh_modifier: "§gNew wells and cleaned channels water more palms and gardens than the oasis has seen in a century.§!"
 faf_the_forty_days_road_modifier: "The Forty Days Road"
 desc_faf_the_forty_days_road_modifier: "§gThe caravans from Darfur rest and trade at Kharga before the last stretch to the river.§!"
 faf_the_river_end_modifier: "The River End of the Road"
 desc_faf_the_river_end_modifier: "§gAt Manfalut the caravans from Kharga unload onto the Nile boats, and every bale of ivory, natron and gum pays its toll on the quay.§!"
 faf_caravan_tolls_modifier: "Caravan Tolls"
 desc_faf_caravan_tolls_modifier: "Every load that waters at our wells pays its toll to the throne."
 faf_caravan_guards_modifier: "Caravan Guards"
 desc_faf_caravan_guards_modifier: "Our riders escort the caravans, and the merchants send more of their trade our way."
 faf_lords_of_the_western_desert_modifier: "Lords of the Western Desert"
 desc_faf_lords_of_the_western_desert_modifier: "The oases have grown into towns, and the river trade runs through them."
 faf_riders_of_the_dunes_modifier: "Riders of the Dunes"
 desc_faf_riders_of_the_dunes_modifier: "The camel and horse riders of the oases cross the sand faster than any army from the river."
 faf_the_libyan_frontier_modifier: "The Libyan Frontier"
 desc_faf_the_libyan_frontier_modifier: "The tribes of the Libyan desert have made their peace with us, and their young men ride in our host."
 faf_the_white_crown_modifier: "The White Crown"
 desc_faf_the_white_crown_modifier: "The towns of Upper Egypt accept a king who wears the Hedjet, and their scribes are quick to enter the new names in the rolls."
 faf_the_oasis_throne_modifier: "The Oasis Throne"
 desc_faf_the_oasis_throne_modifier: "§gThe court stays in the oasis, and the oasis lives off the court: its builders, its suppliers and the petitioners who cross the sand to reach it.§!"
 faf_the_two_peoples_modifier: "The Two Peoples"
 desc_faf_the_two_peoples_modifier: "Qadis, priests and bishops sit in the same courts, and the river towns keep their faith and their peace."
 faf_the_lector_priests_modifier: "The Lector Priests"
 desc_faf_the_lector_priests_modifier: "The lector priests read the old texts aloud in the market squares of the river towns."
 faf_alexandrian_factors_modifier: "Alexandrian Factors"
 desc_faf_alexandrian_factors_modifier: "Coptic factors from Alexandria handle our goods in the ports of the sea."
 faf_crowned_in_abdju_modifier: "Crowned at Abdju"
 desc_faf_crowned_in_abdju_modifier: "The king was crowned by the priests of Wsir in his holy city, as the first kings were."
 faf_crowned_before_the_host_modifier: "Crowned Before the Host"
 desc_faf_crowned_before_the_host_modifier: "The king was crowned before the army that won the river, and the army has not forgotten it."
 faf_crowned_for_the_river_modifier: "Crowned Before the People"
 desc_faf_crowned_for_the_river_modifier: "The headmen of every town and faith on the river stood at the crowning."
 faf_vizier_of_djehuty_modifier: "Vizier of Djehuty"
 desc_faf_vizier_of_djehuty_modifier: "A lector priest of the god of writing keeps the rolls, and the scribes under him learn faster and steal less."
 faf_vizier_of_the_host_modifier: "Vizier of the Host"
 desc_faf_vizier_of_the_host_modifier: "The captain who led the host down to the river now keeps its musters, and every town sends its levy on time."
 faf_vizier_of_the_oases_modifier: "Vizier of the Oases"
 desc_faf_vizier_of_the_oases_modifier: "The scribe from Kharga runs the treasury as he ran the caravan accounts, and the river towns are taxed as carefully as the oases."
 egp_the_throne_of_waset_modifier: "The Throne of Waset"
 desc_egp_the_throne_of_waset_modifier: "§gThe king sits again in the city of Amun, and every scribe, mason and priest in the south wants a place near the court.§!"
 egp_the_two_lands_united_modifier: "The Two Lands United"
 desc_egp_the_two_lands_united_modifier: "From the Delta to Aswan, all of the Black Land answers to one crown."
 egp_the_nomarchs_modifier: "The Nomarchs"
 desc_egp_the_nomarchs_modifier: "Each nome has a governor who answers to the crown, and the river towns are ruled as one realm."
 egp_the_nilometer_modifier: "The Nilometer"
 desc_egp_the_nilometer_modifier: "§gThe tax assessors read the flood at the nilometer and set each village its due before the water falls.§!"
 egp_the_wealth_of_kemet_modifier: "The Wealth of Kemet"
 desc_egp_the_wealth_of_kemet_modifier: "The towns of Egypt are rich again, and their taxes fill the treasury of the crown."
 egp_the_valley_of_the_kings_modifier: "The Valley of the Kings"
 desc_egp_the_valley_of_the_kings_modifier: "§gThe royal tombs have been cleared and guarded, and the pilgrims who visit them pay well for it.§!"
 egp_the_place_of_truth_modifier: "The Place of Truth"
 desc_egp_the_place_of_truth_modifier: "§gThe craftsmen's village beside the valley is busy again.§!"
 egp_the_great_library_modifier: "The Great Library"
 desc_egp_the_great_library_modifier: "§gNew shelves fill the library of Alexandria, and scholars come from every shore of the sea.§!"
 egp_the_beautiful_feast_modifier: "The Beautiful Feast"
 desc_egp_the_beautiful_feast_modifier: "The crown fed all of Waset during the festival of Opet, and people remember who paid."
 egp_the_gods_return_modifier: "The Gods Return"
 desc_egp_the_gods_return_modifier: "All eight houses of the gods stand on the river again, and the old kingdom lives in its temples."
 egp_kings_son_of_kush_modifier: "King's Son of Kush"
 desc_egp_kings_son_of_kush_modifier: "A viceroy rules Kush in the king's name, and the south sends its men and its gold north."
 egp_the_pharos_modifier: "The Pharos"
 desc_egp_the_pharos_modifier: "The harbour of Alexandria is full of our ships again."
 egp_the_translators_modifier: "The Translators"
 desc_egp_the_translators_modifier: "Translators turn Greek and Arabic works into the languages of the court."
 egp_the_temple_archives_modifier: "The Temple Archives"
 desc_egp_the_temple_archives_modifier: "The archives of the temples are copied and kept in Alexandria."
 egp_the_open_stacks_modifier: "The Open Stacks"
 desc_egp_the_open_stacks_modifier: "Any scholar of any faith may read in the library of Alexandria."
 egp_the_road_to_punt_modifier: "The Road to Punt"
 desc_egp_the_road_to_punt_modifier: "The chiefs of Punt trade with our ships every season."
 egp_the_canal_works_modifier: "The Canal Works"
 desc_egp_the_canal_works_modifier: "§gThe line of the old canal is being cleared, and goods move along it by barge and camel.§!"
 egp_the_archer_companies_modifier: "The Archer Companies"
 desc_egp_the_archer_companies_modifier: "Companies of archers drilled to hold the line and loose before the charge, as the armies of the old kings did."
 egp_the_chariotry_modifier: "The Chariotry"
 desc_egp_the_chariotry_modifier: "Horsemen trained to strike the flanks as the chariots of the old kings did."
 egp_the_nubian_levies_modifier: "The Levies of the South"
 desc_egp_the_nubian_levies_modifier: "The villages of the south fill the ranks of the army."
 egp_the_pilgrim_road_modifier: "The Pilgrim Road"
 desc_egp_the_pilgrim_road_modifier: "§gPilgrims of three faiths travel safely to the city, and the city grows rich on them.§!"
 egp_the_pilgrim_toll_modifier: "The Pilgrim Toll"
 desc_egp_the_pilgrim_toll_modifier: "§gEvery pilgrim pays at the gate, and every pilgrim complains about it.§!"
 egp_the_treaty_of_kadesh_modifier: "The Treaty of Kadesh"
 desc_egp_the_treaty_of_kadesh_modifier: "After Kadesh, Kemet made peace with the Hittites and kept it. Our envoys never tire of reminding foreign courts of it."
 egp_the_new_kingdom_modifier: "The New Kingdom"
 desc_egp_the_new_kingdom_modifier: "Kemet is an empire again, and its scribes have given the age the name of the old one."

 #### Reforms, mercenaries, monuments, casus belli (moved from the Antiquity Reborn Egypt loc)
 pharaonic_monarchy: "Pharaonic Kingdom"
 pharaonic_monarchy_desc: "The king is Heru on earth: the first priest of every temple and the lord of the Two Lands."
 NISUTBITY: "Niswt-Bity"
 kemet_place_of_truth_reform: "Servants in the Place of Truth"
 kemet_place_of_truth_reform_desc: "The craftsmen of the river towns are organised as the tomb builders of the Place of Truth once were: in guilds of their own, with their own scribes and their own courts, working for the crown in return for its protection."
 merc_kemet_medjay: "Medjay"
 kemet_great_library: "The Great Library of Alexandria"
 kemet_deir_el_medina: "Deir el-Medina"
 kemet_valley_of_the_kings: "The Valley of the Kings"
 kemet_cb_punt_campaign: "Punt Campaign"
 kemet_cb_punt_campaign_desc: "Our ships have found the land of Punt again, and its chiefs will learn to pay tribute to Kemet as their ancestors did."
 kemet_punt_campaign_goal: "Take Capital"
 kemet_punt_campaign_goal_desc: "The war goal is to take the capital of $COUNTRY$."
 KEMET_PUNT_COUNTRIES: "All countries with their capital in the Horn of Africa"
 KEMET_PUNT_PROVS: "All provinces in the Horn of Africa"
 KEMET_PUNT_CAMPAIGN_WAR: "$ORDER$$FIRST$-$SECOND$ Punt Campaign"
 kemet_sacred_burials_privilege: "Sacred Burials"
 kemet_sacred_burials_privilege_desc: "The dead of the royal house are prepared and buried in the old way by hereditary keepers, and the temples hold land to pay for it. A king's death no longer leaves the realm without order."
 kemet_sacred_burials_privilege_tt: "The [Root.GetClergyName] take charge of the royal burials and the lands that pay for them."
