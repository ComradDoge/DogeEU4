l_english:
 #### Farafra missions (missions/_DST_Farafra_Missions.txt)
 faf_the_wells_of_farafreh_title: "The Wells of Farafreh"
 faf_the_wells_of_farafreh_desc: "Farafreh lives on its springs. Since the sultanate in Cairo broke apart, no governor has come to count our wells or tax our palms, and the oasis has had to look after itself. Deepen the old wells and dig new ones, and Farafreh can feed more mouths than it has in a century."
 faf_the_palms_of_bahiriya_title: "The Palms of Bahiriya"
 faf_the_palms_of_bahiriya_desc: "Bahiriya's groves give the sweetest dates in the Western Desert, yet its people still live off their herds. Build presses and storehouses, pack the dates for the caravans, and let the oasis trade on what grows best there. The loads go down to the Nile at Manfalut, and the river end of the road should be ours."
 faf_manfalut_core_tt: "§gManfalut is where the caravan road from our oases meets the Nile. The Forty Days Road asks for it.§!"
 faf_the_forty_days_road_title: "The Forty Days Road"
 faf_the_forty_days_road_desc: "From Kharga the caravan road runs south for forty days to Darfur, and north to meet the Nile at Manfalut. Whoever holds both ends can tax every load of ivory, natron and gum that passes. Build a market at Kharga and take the river end of the road."
 faf_the_caravan_masters_title: "The Caravan Masters"
 faf_the_caravan_masters_desc: "The oases now sit on the roads between the Nile, the Sahara and the sea. The masters who run the caravans want to know what kind of lords we mean to be: collectors at the wells, or riders who keep the roads safe."
 faf_lords_of_the_western_desert_title: "Lords of the Western Desert"
 faf_lords_of_the_western_desert_desc: "Farafreh, Bahiriya and Kharga were outposts that the kings of the river barely remembered. Make them towns the river cannot do without."
 faf_the_oasis_levy_title: "The Oasis Levy"
 faf_the_oasis_levy_desc: "Every family in the oases owes the chief a rider or a spearman in time of need. Call them all up. Fayyum and Minya are a few days' ride from Bahiriya, and since Cairo's rule ended nobody stands between us and them but the lords of Beni Suef."
 faf_riders_of_the_dunes_title: "Riders of the Dunes"
 faf_riders_of_the_dunes_desc: "Our camel and horse riders cross sand that would kill an army from the river. Raise more of them."
 faf_the_medjay_title: "The Medjay"
 faf_the_medjay_desc: "In the days of the old kings the Medjay were the desert scouts and police of Kemet, and the name still means something on the caravan roads. Gather the best riders and trackers of the oases into a company that answers to us alone."
 faf_the_knights_of_the_temple_title: "The Knights of the Temple"
 faf_the_knights_of_the_temple_desc: "When the sultanate broke, Latin knights of the Temple seized Sharqiya, Suez and the Sinai road, and they have held them since. The eastern Delta and the road to the Red Sea must be ours, whatever becomes of the knights."
 faf_the_libyan_desert_title: "The Libyan Desert"
 faf_the_libyan_desert_desc: "North-west of the oases the sand runs down to the coast of Cyrenaica. The old kings called the peoples of that coast the Tjehenu, the Tjemehu and the Libu. They fought them for centuries, and in the end Libyan chiefs sat on the throne of Kemet themselves. Bring Benghazi and its coast under our rule and close the western door of Egypt."
 faf_down_to_the_river_title: "Down to the River"
 faf_down_to_the_river_desc: "Fayyum, Minya and Atfih lie green with the river's mud a few days' ride from Bahiriya. Whoever rules them holds the gate between the oases and the Nile."
 faf_the_white_crown_title: "The White Crown"
 faf_the_white_crown_desc: "Upper Egypt runs from Manfalut to Aswan, with Qus, Girga and Isna between them. Its old kings wore the white crown, the Hedjet. Take the valley, and the crown with it."
 faf_the_city_of_the_sultans_title: "The City of the Sultans"
 faf_the_city_of_the_sultans_desc: "Cairo is the greatest city on the river and was the seat of the sultans who ruled all Egypt until their realm broke. A short way south of it lie the ruins of Men-nefer, the first capital of the Two Lands. Take the city."
 faf_the_red_crown_title: "The Red Crown"
 faf_the_red_crown_desc: "The Delta, from Alexandria to Damietta and Sharqiya, was the land of the red crown, the Deshret. Its ports and fields are the richest in Egypt. Bring all of Lower Egypt under our rule."
 faf_the_black_land_title: "The Black Land"
 faf_the_black_land_desc: "The old name of Egypt was Kemet, the Black Land, after the dark mud the flood leaves behind. Hold enough of it, and the kingdom of Kemet can be proclaimed at once, without waiting for the scribes and the treasuries of a settled realm."
 faf_the_house_of_sutekh_title: "The House of Sutekh"
 faf_the_house_of_sutekh_desc: "Sutekh is lord of the red land, the desert, and the oases have always kept his shrine. Build him a proper house in Farafreh and give the oasis back its old name, Ta-iht. The other gods have houses waiting along the river."
 faf_the_necropolis_of_bahiriya_title: "Necropolis of Bahiriya"
 faf_the_necropolis_of_bahiriya_desc: "Under the sand at Bahiriya lie our ancestors, row after row, wrapped and gilded in the old way. The families who guard them want their duty written into law."
 faf_the_people_of_the_river_title: "The People of the River"
 faf_the_people_of_the_river_desc: "The towns of Fayyum and Minya pray in mosques and churches, and to them our gods are idols. Before the conquest goes further, the court must decide what the gods ask of us on the river."
 faf_the_faith_of_the_valley_title: "The Faith of the Valley"
 faf_the_faith_of_the_valley_desc: "Our path on the river is chosen. Now it must be walked: through judges and tax rolls if we keep the balance of Ma'at, through priests and processions if the Neteru are to return to every town."
 faf_the_two_truths_title: "The Two Truths"
 faf_the_two_truths_desc: "In the Hall of the Two Truths the dead are weighed against the feather of Ma'at. The land will be weighed the same way: a realm of many faiths at peace, or a realm that serves the Neteru in every town. Raise again the houses of the gods along the river, and finish what was begun there."
 faf_the_council_of_the_oases_title: "The Council of the Oases"
 faf_the_council_of_the_oases_desc: "The sheikhs of Farafreh, Bahiriya and Kharga meet each winter to settle water rights and feuds. Make the council work for the throne, and keep all three oases quiet while it does."
 faf_friends_in_alexandria_title: "Friends in Alexandria"
 faf_friends_in_alexandria_desc: "Alexandria's Coptic merchants buy our dates and natron and sell us cloth and iron, and they have no love for the lords of Cairo either. Make them our friends, or our subjects."
 faf_the_crowning_at_abydos_title: "The Crowning at Abdju"
 faf_the_crowning_at_abydos_desc: "Abdju, the holy city of Wsir where the first kings were buried, lies in ruins beside the river town of Girga (Jarajanaan). A chief of the oases cannot rule the river. A king crowned at Abdju can, and the town will take back its old name."
 faf_the_vizier_title: "The Vizier"
 faf_the_vizier_desc: "The old kings ruled through the tjaty, the vizier, who heard petitions, kept the rolls and ran the treasury. A realm this size needs one again."

 #### Kemet missions (missions/_DST_Kemet_Missions.txt)
 egp_the_house_of_life_title: "The House of Life"
 egp_the_house_of_life_desc: "Every great temple once kept a Per Ankh, a House of Life, where scribes copied the sacred books and taught the next generation. With four houses restored, the priests ask to open them again."
 egp_the_valley_of_the_kings_title: "The Valley of the Kings"
 egp_the_valley_of_the_kings_desc: "Across the river from Waset (Qus) lies the valley where the kings of the New Kingdom were buried. Clear the sand from the tombs and post guards at the valley mouth."
 egp_the_place_of_truth_title: "The Place of Truth"
 egp_the_place_of_truth_desc: "The tomb builders had a village of their own beside the valley, Set Maat, the Place of Truth. Bring craftsmen back to it, and to the workshops of the river towns."
 egp_the_festival_of_opet_title: "The Festival of Opet"
 egp_the_festival_of_opet_desc: "Each year at the height of the flood, Amun's barque was carried from his great temple to the southern temple of Waset (Qus) with the king walking beside it. The priests want the festival held again."
 egp_the_gods_return_title: "The Gods Return"
 egp_the_gods_return_desc: "When all eight houses stand, every god of the old kingdom will have a home on the river again."
 egp_the_black_land_whole_title: "The Black Land Whole"
 egp_the_black_land_whole_desc: "Kemet has been proclaimed, but not all of the river answers to it. Bring every town of the valley, from the Delta down to Aswan, under the crown."
 egp_the_nomarchs_title: "The Nomarchs"
 egp_the_nomarchs_desc: "The old kingdom was ruled through nomes, each under its own governor. Courthouses and loyal governors will keep the river towns from drifting back to their own lords."
 egp_the_granary_of_the_sea_title: "Mediterranean Granary"
 egp_the_granary_of_the_sea_desc: "Egypt fed Rome and Constantinople in turn, and the Delta still grows more wheat than its towns can eat. Build mills and storehouses at Al Gharbia, Rosetta, Damietta and Sharqiya, and let the ships of every port on the sea come to us for grain."
 egp_the_nilometers_title: "The Nilometers"
 egp_the_nilometers_desc: "At Cairo and Aswan, old stairways run down into the river, marked with the height of every flood. The height of the water told the old kings how rich the harvest would be, and so how much tax each village could pay. Read them properly again."
 egp_the_wealth_of_kemet_title: "The Wealth of Kemet"
 egp_the_wealth_of_kemet_desc: "In the old kingdom a single nome could pay for a temple or an army. Raise ten provinces of Egypt to that kind of wealth."
 egp_the_first_cataract_title: "The First Cataract"
 egp_the_first_cataract_desc: "At Aswan the river breaks over the rocks of the first cataract. South of it begins Wawat, Lower Nubia, which the old kings held for its gold, and beyond that Dongola, with the Red Sea ports of Suakin and Halaib off to the east. Make Aswan a market town worth defending."
 egp_wawat_title: "Wawat"
 egp_wawat_desc: "Qasr Ibrim, Wadi Halfa and the Sahra an Nübyah were Wawat to the old kings, and the hills east of the river hid their gold mines. Take the land and reopen the mines."
 egp_the_viceroy_of_kush_title: "The Viceroy of Kush"
 egp_the_viceroy_of_kush_desc: "Beyond the cataracts lies Dongola and the old land of Kush. The kings of the New Kingdom did not merely take it: they ruled it through a viceroy, the King's Son of Kush. Hold Nubia as our own, or through a subject who rules it in our name."
 egp_the_viceroy_of_kush_tt: "Every province we own in §YLower Nubia§! and §YDongola§! is one of our cores. Provinces held by our subjects count as well."
 egp_meroe_title: "Meroe"
 egp_meroe_desc: "Near Shendy stand the ruins of Meroe, the last city of the kings of Kush, ringed by small steep pyramids and heaps of iron slag. Upriver lies Soba, the great market of the south."
 egp_the_pharos_title: "The Pharos"
 egp_the_pharos_desc: "The great lighthouse of Alexandria is long gone, but the harbour is still the best on the coast. Fill it with ships of our own."
 egp_the_library_of_alexandria_title: "The Library of Alexandria"
 egp_the_library_of_alexandria_desc: "Alexandria once kept the greatest library in the world. Its books are long scattered, but scholars, temple archives and translators can fill new shelves."
 egp_the_road_to_queseer_title: "The Road to Queseer"
 egp_the_road_to_queseer_desc: "From Qus a desert road runs east through the Wadi Hammamat to Queseer on the Red Sea, the harbour where the old kings fitted out their ships for distant lands."
 egp_the_expedition_to_punt_title: "The Expedition to Punt"
 egp_the_expedition_to_punt_desc: "Queen Hatshepsut sent five ships to Punt, and they came back with incense trees, gold, ebony and live apes. Send our ships down the Red Sea and find Punt again."
 egp_the_canal_of_the_pharaohs_title: "The Canal of the Pharaohs"
 egp_the_canal_of_the_pharaohs_desc: "The old kings dug a canal from the Nile through the Wadi Tumilat and the Bitter Lakes to the Red Sea at Suez. The caliphs had it filled in centuries ago. Dig out its line again, and one day ships may pass from sea to sea."
 egp_the_army_of_kemet_title: "The Army of Kemet"
 egp_the_army_of_kemet_desc: "A kingdom this size cannot be held by oasis riders alone. The generals are arguing over what kind of army Kemet needs."
 egp_the_ways_of_horus_title: "The Ways of Horus"
 egp_the_ways_of_horus_desc: "The Ways of Horus was the old fortified road from the Delta across the Sinai to Gaza. Every army that marched into Asia took it, and so did every army that came out. Hold the Sinai and Suez, and the road lies open."
 egp_retjenu_title: "Retjenu"
 egp_retjenu_desc: "Retjenu was the old name for Canaan and Syria, the lands beyond the Sinai. Its southern part runs from Gaza on the coast to the hill country around Jerusalem, a city Christians, Muslims and Jews all hold holy. Bring it under the crown."
 egp_kadesh_title: "Kadesh"
 egp_kadesh_desc: "Near Homs the kings of Kemet fought the Hittites at Kadesh, and years later made peace with them in one of the oldest treaties that survives. Damascus, Homs, Tarabulus and Sidon would make Kemet the power of the Levant again."
 egp_the_new_kingdom_title: "The New Kingdom"
 egp_the_new_kingdom_desc: "The New Kingdom was the age of Kemet's empire, from Kush to the Euphrates. Be a great power again, and the scribes will give this age the same name."

