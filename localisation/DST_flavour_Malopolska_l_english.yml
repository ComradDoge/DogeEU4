l_english:
 mpk_reclaim_the_wawel_title:0 "@MPK Bring Wawel into our fold"
 mpk_reclaim_the_wawel_desc:0 "Krakow has not answered to Checiny since the old Kingdom came apart, though its cathedral still holds the tombs of the Piast kings and its castle the crown jewels no one has worn in years. A duchy that calls itself heir to the Piast crown cannot go on without Wawel, the castle hill in Krakow where the crown was kept."
 mpk_seat_of_kings:0 "Seat of Kings"

 dse_flavour_malopolska.1.t:0 "The Return to Wawel"
 dse_flavour_malopolska.1.d:0 "Kazimierz the Great, the last Piast king, rebuilt the cathedral on Wawel hill in Krakow, and for two centuries every Piast king was laid to rest beneath it. The banners of Checiny fly over Wawel castle now, and for the first time since the old Kingdom broke apart, Mass is said there for a living ruler rather than a dead one."
 dse_flavour_malopolska.1.a:0 "Crown ourselves in the old rite"
 dse_flavour_malopolska.1.b:0 "Restore the cathedral's endowments first"

 dse_flavour_malopolska.2.t:0 "The Union of Krewo"
 dse_flavour_malopolska.2.d:0 "Sixty years ago Grand Duke Jogaila of Lithuania took the Polish crown and the name Wladyslaw by marrying Queen Jadwiga, and promised to bring his people into the Church. Lithuania and Poland were meant to stand as one from that day, under the Union of Krewo. Neither has stood for much since the Kingdom broke apart, and the court at Vilnius asks whether Checiny still considers itself bound by an agreement made for a Poland that no longer exists."
 dse_flavour_malopolska.2.a:0 "The union still holds"
 dse_flavour_malopolska.2.b:0 "Krewo died with the Kingdom"

 dse_flavour_malopolska.3.t:0 "Gniezno or Kraków"
 dse_flavour_malopolska.3.d:0 "The envoys of Poznan enjoy reminding Checiny's court that the cathedral at Gniezno crowned Boleslaw the Brave four centuries before a single Piast king was buried in Krakow, and that Wielkopolska was Poland before Krakow ever was. Checiny's clerks are just as fond of reminding them who has held the coronation cathedral, the royal treasury, and the university charter ever since."
 dse_flavour_malopolska.3.a:0 "Kraków was, is, and remains the crown"
 dse_flavour_malopolska.3.b:0 "Let Gniezno keep its pride, we'll keep the treasury"

 dse_flavour_malopolska.4.t:0 "Akademia Krakowska"
 dse_flavour_malopolska.4.d:0 "Kazimierz the Great chartered the Academy in Krakow in 1364, though the Pope refused it a faculty of theology and the school nearly died with him six years later. It still teaches law to the sons of the Polish nobility, and its masters have written asking whose purse it should draw from now."
 dse_flavour_malopolska.4.a:0 "Take up the Academy's charter"
 dse_flavour_malopolska.4.b:0 "That is Kraków's expense, not ours"
 mpk_piast_coronation:0 "Piast Coronation"
 desc_mpk_piast_coronation:0 "A ruler crowned in the old rite at Wawel."
 mpk_wawel_chapter:0 "Wawel Cathedral Endowed"
 desc_mpk_wawel_chapter:0 "The cathedral of Wawel is restored, and Krakow prospers with it."
 mpk_krewo_compact:0 "Union of Krewo"
 desc_mpk_krewo_compact:0 "Checiny keeps the old union with Vilnius alive."
 mpk_no_compact:0 "Krewo Repudiated"
 desc_mpk_no_compact:0 "The crown answers to no agreement, and no neighbor trusts it."
 mpk_krakow_crown:0 "Krakow Is the Crown"
 desc_mpk_krakow_crown:0 "Krakow, the coronation city, is the only seat that matters."
 mpk_gniezno_pride:0 "Gniezno's Pride"
 desc_mpk_gniezno_pride:0 "Gniezno is left its pride, and grumbles while filling the treasury."
 mpk_akademia_krakowska:0 "Akademia Krakowska"
 desc_mpk_akademia_krakowska:0 "The Academy's masters serve the crown."
 desc_mpk_seat_of_kings:0 "The Piast crown sits once more on Wawel hill."
