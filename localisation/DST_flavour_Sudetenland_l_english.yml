l_english:
 sud_hold_the_line_title:0 "@SUD Hold Plzen"
 sud_hold_the_line_desc:0 "Catholic Plzen and the few towns and villages of the Sudeten borderland around it have stood against the Hussite armies since Jan Zizka's day, while the Kingdom of Bohemia comes apart into quarrelling courts. No ally has kept its walls; a small garrison has. Committing our military strength to the borderland's defense and proclaiming Plzen a fortress that will not fall gives its burghers and villagers a reason to keep fighting. It is not victory. It is, at least, still Plzen."
 sud_unbroken_walls:0 "Unbroken Walls"

 dse_flavour_sudetenland.1.t:0 "The Oath of Plzen"
 dse_flavour_sudetenland.1.d:0 "The proclamation is read from the town hall, and the garrison answers by swearing to hold Plzen and the borderland behind it against every Hussite column that comes. They have earned the right to say it: siege after siege has lifted since Jan Zizka first tested the walls, and the walls still stand where they stood. Now the borderland waits to see how the crown will mark the oath."
 dse_flavour_sudetenland.1.a:0 "Ring the bells and celebrate the oath"
 dse_flavour_sudetenland.1.b:0 "Spend the moment repairing the walls"

 dse_flavour_sudetenland.2.t:0 "Prokop's Beautiful Ride"
 dse_flavour_sudetenland.2.d:0 "Prokop Holý, who took command of the Hussite field army after Zizka, has taken to raiding far past Bohemia's old borders, calling the campaigns spanilé jízdy, beautiful rides, as though burning Catholic villages were a summer hunt. One such column crosses into the hills near Plzen, and the garrison must decide how far to chase it."
 dse_flavour_sudetenland.2.a:0 "Ride them down"
 dse_flavour_sudetenland.2.b:0 "Let them pass, the walls will hold"

 dse_flavour_sudetenland.3.t:0 "The Town Council"
 dse_flavour_sudetenland.3.d:0 "Prague's councils expelled their German patricians years ago and have not asked one back since; Plzen never did, and its Czech burghers have grown tired of watching every seat go to a German name. The court can fill the next vacant seat with whichever burgher offers the larger loan."
 dse_flavour_sudetenland.3.a:0 "Seat the Czech burgher"
 dse_flavour_sudetenland.3.b:0 "Seat the German burgher"

 dse_flavour_sudetenland.4.t:0 "Ore in the Hills"
 dse_flavour_sudetenland.4.d:0 "Prospectors working the Ore Mountain slopes above [sud_ore_province.GetName] report veins that remind the older men of the great Bohemian silver mines before the Hussites sacked them. Silver, they say, or something near it. Opening a mine properly, shafts, smelters, a small fortune in coin up front, would take most of a year's revenue with no guarantee the vein runs true."
 dse_flavour_sudetenland.4.a:0 "Open the mine"
 dse_flavour_sudetenland.4.b:0 "The treasury cannot risk it"
 sud_city_of_the_bells:0 "City of the Bells"
 desc_sud_city_of_the_bells:0 "Plzen rings out every siege it has outlasted."
 sud_repaired_ramparts:0 "Repaired Ramparts"
 desc_sud_repaired_ramparts:0 "The walls have been rebuilt stronger than before."
 sud_ridden_down:0 "Column Ridden Down"
 desc_sud_ridden_down:0 "The garrison has learned to fight in the open."
 sud_patient_garrison:0 "Patient Garrison"
 desc_sud_patient_garrison:0 "The garrison waits behind its walls and spends nothing on foolish sorties."
 sud_burned_hinterland:0 "Burned Hinterland"
 desc_sud_burned_hinterland:0 "Villages beyond the walls were left to the raiders."
 sud_czech_council:0 "Czech Town Council"
 desc_sud_czech_council:0 "Czech burghers sit in the council, and the townsfolk trust it."
 sud_german_patriciate:0 "German Merchant Council"
 desc_sud_german_patriciate:0 "German merchant families run the council and the trade routes, to Czech resentment."
 sud_erzgebirge_silver:0 "Ore Silver Mountain"
 desc_sud_erzgebirge_silver:0 "Shafts and smelters bring the Ore Mountain silver to the mint."
 sud_erzgebirge_smelters:0 "Ore Mountain Smelters"
 desc_sud_erzgebirge_smelters:0 "The vein ran out, but the shafts and smelters stayed and found lead, copper and tin."
 sud_prudent_treasury:0 "Prudent Treasury"
 desc_sud_prudent_treasury:0 "The crown refuses risky ventures and borrows cheaply as a result."
 desc_sud_unbroken_walls:0 "Plzen's garrison has sworn to hold, and so far it has."

 # Mission tree - The Plzen Landfrieden
 sud_plzen_landfrieden_title:0 "The Plzen Landfrieden"
 sud_plzen_landfrieden_desc:0 "Holding Plzen was never going to be enough. The Catholic lords of the west Bohemian borderland, from Eger to the Ore Mountain towns, have kept to their own walls since Zizka's day. Bound together in a Landfrieden, a sworn league of the land's peace, they could field one army under one banner. If we can hold the whole Erzgebirge and show them a standing host with a captain at its head, they will swear, and the road to Prague opens."
 sud_march_on_prague_title:0 "March on Prague"
 sud_march_on_prague_desc:0 "Prague is the heart of the Chalice. The Utraquist preachers of the Týn church, above the Old Town square, have turned Bohemia's capital into the pulpit of the heresy, and the court that should have silenced them came apart when the old kingdom shattered. Plzen's crusaders will not be a borderland garrison for ever. Take the city on the Vltava, and Bohemia will see which faith still stands."
 sud_one_faith_in_bohemia_title:0 "One Faith in Bohemia"
 sud_one_faith_in_bohemia_desc:0 "Holding Prague does not mean holding its people. Hradecko and Pardubice still take communion from the chalice, and the Czech villages of the Elbe plain remember Hussite captains more fondly than Catholic ones. Hold every town of Bohemia and bring each back to our faith, and the heresy that tore the kingdom apart will have lost the land that gave birth to it."
 sud_captured_war_wagons_title:0 "Learn from the Wagenburg"
 sud_captured_war_wagons_desc:0 "Zizka's great lesson was never a secret. Farm carts chained into a wall, handguns and flails behind the boards, and knights broken against them like waves. Our garrison has watched the vozová hradba roll past Plzen for twenty years. It is time our own captains, hardened veterans with modern arms, turned the Hussites' weapon against them."
 sud_into_moravia_title:0 "Into Moravia"
 sud_into_moravia_desc:0 "The Hussite court of Moravia at Olomouc shelters every Taborite band driven out of Bohemia. Jindrichuv Hradec, on the southern road between the two lands, is the gate. Hold it with a rested army and our claims will run down the valleys to Brno and Olomouc."
 sud_see_of_olomouc_title:0 "The See of Olomouc"
 sud_see_of_olomouc_desc:0 "Olomouc was the seat of the Moravian bishops long before the Chalice, and its cathedral of Saint Wenceslas stood empty when the Hussite court took the city. Hold Olomouc and return it to the true faith, and a bishop can sit there again. His blessing is worth more in Moravia than any garrison of ours."
 sud_chalice_broken_title:0 "The Chalice Broken"
 sud_chalice_broken_desc:0 "Rome has fought the Chalice since Constance burned Jan Hus, and all the crusades sent against it failed. Once Moravia is ours and no Hussite congregation is left anywhere in the lands of the Bohemian Crown, the Landfrieden of Plzen will have done what emperors and popes could not."
 sud_blessing_of_the_holy_see_title:0 "Blessing of the Holy See"
 sud_blessing_of_the_holy_see_desc:0 "The knights of Prussia and Livonia fought under papal banners against the heathens of the Baltic, and there are heathens far nearer than the Baltic. Since the shattering, the Sorbs around Görlitz in Upper Lusatia have gone back to the old gods in the open. Win the Curia's favour, or at least prove our standing among Christian princes, and our war on them becomes a crusade."
 sud_fell_the_sacred_groves_title:0 "Fell the Sacred Groves"
 sud_fell_the_sacred_groves_desc:0 "On the Landeskrone, the wooded hill above Görlitz, the Sorbs keep a grove where they lay offerings to Belobog and Czernobog, the white god and the black. Those who go there say the old gods have answered since the world broke apart. Take Görlitz, and the grove is ours to deal with."
 sud_lusatia_secured_title:0 "Lusatia Secured"
 sud_lusatia_secured_desc:0 "Upper and Lower Lusatia were Bohemian Crown lands before the shattering, and their weavers still sell linen along the roads to Prague and Leipzig. Bring every Lusatian town under our rule and the looms will work for us. The Silesian duchies beyond the Neisse will then border a crusader state that has lost none of its hunger."
 sud_silesian_duchies_title:0 "The Silesian Duchies"
 sud_silesian_duchies_desc:0 "Silesia is a patchwork of duchies. Breslau, Opole, Glogau and Ratibor each have a Piast duke who once owed homage to the Bohemian king and now owes it to nobody. Whether they bow as vassals or fall to our armies, the Oder towns must answer to Plzen before the Crown lands can be called whole again."
 sud_lands_of_the_crown_title:0 "The Lands of the Crown"
 sud_lands_of_the_crown_desc:0 "Bohemia, Moravia, Lusatia and Silesia: the Lands of the Bohemian Crown, which Charles IV bound together and the shattering broke apart. Hold them all, at peace, and the Landfrieden that began as a garrison's oath in Plzen will have to decide what it has become."
 sud_no_hussites_in_crown_lands_tt:0 "No province in the Bohemia, Erzgebirge, Moravia, Lusatia or Silesia areas follows the §YHussite§! faith."
 sud_take_the_crown_tt:0 "We become the Kingdom of §YBohemia§!, with Prague as our capital, and may choose a new name for the realm."

 dse_flavour_sudetenland.5.t:0 "The Chalice of the Týn"
 dse_flavour_sudetenland.5.d:0 "Our banners fly over Prague, but the Utraquists' great gilded chalice still hangs on the gable of the Týn church, where the whole Old Town can see it. The Catholic lords of the Landfrieden want it torn down and melted into coin before the week is out. The city's aldermen, Czech burghers who opened the gates rather than face a siege, beg us to leave it. For Prague, they say, it is not a heresy but a memory."
 dse_flavour_sudetenland.5.a:0 "Tear it down"
 dse_flavour_sudetenland.5.b:0 "Leave it, for now"
 dse_flavour_sudetenland.6.t:0 "The See of Olomouc"
 dse_flavour_sudetenland.6.d:0 "The cathedral of Saint Wenceslas in Olomouc has been swept, reconsecrated and given a bishop again: an old canon of the chapter who spent the Hussite years in exile. His first sermon thanked [Root.Monarch.GetName], and his first letter to us asks for the bishopric's lost estates back. Rome, meanwhile, has let it be known that Moravian tithes would be most welcome in the Curia."
 dse_flavour_sudetenland.6.a:0 "Endow the bishopric"
 dse_flavour_sudetenland.6.b:0 "Send the tithes to Rome"
 dse_flavour_sudetenland.7.t:0 "The Grove on the Landeskrone"
 dse_flavour_sudetenland.7.d:0 "Our crusaders have climbed the Landeskrone above Görlitz and found the grove the Sorbs spoke of: old oaks hung with ribbons, two carved posts of Belobog and Czernobog, and fresh offerings at their feet. The villagers swear the gods walked among them the year the world shattered, and that the grove has never since been without a keeper. Our priests want it burned. Our captains, who must hold Görlitz for years to come, are less certain."
 dse_flavour_sudetenland.7.a:0 "Burn it to the ground"
 dse_flavour_sudetenland.7.b:0 "Build a church over it"
 dse_flavour_sudetenland.8.t:0 "The Lands of the Crown"
 dse_flavour_sudetenland.8.d:0 "From the Ore Mountains to the Oder, and from the Lusatian looms to the Moravian gate, every land that once owed homage to the Bohemian Crown now answers to us. The Hussite Chalice is broken and the sacred groves are ash or chapels. In Prague the Estates have gathered in the Old Royal Palace, with the crown of Saint Wenceslas on its cushion, to ask whether the Landfrieden of Plzen will wear it. Some of the old borderers would rather stay what they have always been: the wall the faith stands behind."
 dse_flavour_sudetenland.8.a:0 "Take the crown of Saint Wenceslas"
 dse_flavour_sudetenland.8.b:0 "We remain the bulwark of the faith"
 sud_order_of_the_landfrieden_tt:0 "Afterwards, we choose whether to re-found the realm as a §Ycrusader theocracy§!, a §Yrepublic§!, or remain a §Ymonarchy§!."
 dse_flavour_sudetenland.9.t:0 "The Order of the Landfrieden"
 dse_flavour_sudetenland.9.d:0 "The crown of Saint Wenceslas has gone back to its cushion in Prague, and the men who refused it have gathered in the great hall of Plzen to decide what they will be instead. The priests and the old crusading lords want the Landfrieden re-founded as the knights of Prussia and Livonia once were: a sworn realm of the faith, ruled by its captains. The lords of the league would rather govern it themselves, as a republic of equals. And the borderers, burghers and peasants who have held the walls since Zizka's day ask why a land they defended should answer to any lord at all. A few voices, the loudest ones at court, simply want the old monarchy left as it is."
 dse_flavour_sudetenland.9.a:0 "A Crusading Kingdom, ruled by its knights"
 dse_flavour_sudetenland.9.b:0 "A militarised Crusader Order, sworn to war on the heretic"
 dse_flavour_sudetenland.9.c:0 "A republic of the Landfrieden lords"
 dse_flavour_sudetenland.9.dd:0 "A republic of the borderers who held the walls"
 dse_flavour_sudetenland.9.e:0 "The crown stays in Plzen"

 sud_landfrieden_levies:0 "Levies of the Landfrieden"
 desc_sud_landfrieden_levies:0 "The Catholic lords of the borderland have sworn to march together under one banner."
 sud_one_faith_in_bohemia:0 "One Faith in Bohemia"
 desc_sud_one_faith_in_bohemia:0 "Bohemia prays at one altar again, and our preachers carry the example into every neighbouring land."
 sud_captured_war_wagons:0 "Captured War Wagons"
 desc_sud_captured_war_wagons:0 "Our captains have learned the Hussite wagon fort and now chain up their own."
 sud_chalice_broken:0 "The Chalice Broken"
 desc_sud_chalice_broken:0 "No Hussite congregation remains in the Crown lands, and Christendom knows who ended it."
 sud_papal_banner:0 "Papal Banner"
 desc_sud_papal_banner:0 "Our wars against the heathen and the heretic carry the blessing of the Holy See."
 sud_lusatian_linen:0 "Lusatian Linen"
 desc_sud_lusatian_linen:0 "The Lusatian looms work and trade under our protection."
 sud_crown_of_silesia:0 "Homage of the Silesian Dukes"
 desc_sud_crown_of_silesia:0 "The Piast dukes of Silesia pay homage to us as they once did to the Bohemian kings."
 sud_chalice_torn_down:0 "Chalice Torn Down"
 desc_sud_chalice_torn_down:0 "The chalice of the Týn has been melted down, and our preachers speak with a conqueror's confidence."
 sud_utraquist_resentment:0 "Utraquist Resentment"
 desc_sud_utraquist_resentment:0 "Prague has not forgiven the loss of its chalice."
 sud_chalice_left_standing:0 "Chalice Left Standing"
 desc_sud_chalice_left_standing:0 "We left the Týn chalice in place, and the Utraquists take it as a sign they will be tolerated."
 sud_tyn_chalice:0 "The Týn Chalice"
 desc_sud_tyn_chalice:0 "Its chalice untouched, Prague accepts its new masters more calmly."
 sud_olomouc_bishopric:0 "Bishopric of Olomouc"
 desc_sud_olomouc_bishopric:0 "The restored bishopric has its estates back and preaches across Moravia."
 sud_olomouc_chapter:0 "Chapter of Olomouc"
 desc_sud_olomouc_chapter:0 "The cathedral chapter of Olomouc serves again, though its tithes go to Rome."
 sud_burned_grove:0 "Burned Grove"
 desc_sud_burned_grove:0 "The sacred grove on the Landeskrone is ash, and the Sorbs have not forgotten who burned it."
 sud_church_over_the_grove:0 "Church on the Landeskrone"
 desc_sud_church_over_the_grove:0 "A church stands where the grove did, and the Sorbs climb the hill to it out of old habit."
 sud_bulwark_of_the_faith:0 "Bulwark of the Faith"
 desc_sud_bulwark_of_the_faith:0 "We refused a crown to remain what we always were: the wall the faith stands behind."
 sud_veterans_of_the_crusade:0 "Veterans of the Crusade"
 desc_sud_veterans_of_the_crusade:0 "The men who broke the Chalice and felled the groves still muster under the banner of the Landfrieden, and their sons learn the trade from them."
