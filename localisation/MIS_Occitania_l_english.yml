l_english:

 # Occitania missions: missions/_MIS_Occitania_Missions.txt

 # ---- Unity & France
 occ_heart_of_the_midi_title: "Heart of the Midi"
 occ_heart_of_the_midi_desc: "Toulouse, Narbonne, Carcassonne and the Languedoc coast were once held together by the counts of Toulouse, before the old realms broke apart and every town went its own way. A crown that calls itself Occitan has to hold the Languedoc first, and hold it as its own."
 occ_gascony_and_guyenne_title: "Gascony and Guyenne"
 occ_gascony_and_guyenne_desc: "West of Toulouse the Garonne runs down through Guyenne to the sea, and the Pyrenean valleys of Foix, Bearn and Armagnac look to whichever lord is strongest. Bring the southwest under our banner and the road to the Atlantic is ours."
 occ_massif_central_title: "The Massif Central"
 occ_massif_central_desc: "The hills of Auvergne and the Bourbonnais stand between the Midi and the north. Whoever holds them decides where the next war is fought. We would rather it was not fought in Languedoc."
 occ_face_the_lilies_title: "Face the Lilies"
 occ_face_the_lilies_desc: "For as long as anyone remembers, the crown of France has claimed the south as its own, and it was French knights who rode against Toulouse in the old crusade. Limousin is ours already, and Poitou marks the edge of our lands. Hold it, and make the Lilies accept that the Midi answers to itself."
 occ_face_the_lilies_dyn_a: "If §YFrance§! is our subject:"
 occ_face_the_lilies_dyn_b: "If §YFrance§! is not our subject, we gain permanent claims on its provinces in the §YFrance§! region that border us:"
 occ_face_the_lilies_dyn_c: "If §YFrance§! no longer exists, we gain permanent claims on every province in the §YFrance§! region that borders us and is not held by us or our subjects:"
 occ_face_the_lilies_no_rival_tt: "§YFrance§! does not exist, and no independent country with its capital in France has a stronger army than ours"
 occ_two_tongues_title: "The Two Tongues"
 occ_two_tongues_desc: "North of the Loire they say oïl for yes, and in the Midi we say oc. For centuries the kings in Paris spoke for both, and since the old realms broke apart the north has been fought over by its own small lords. Hold the Île-de-France or make France answer to us, take a broad stretch of the French lands, and the crown in Toulouse will speak for both tongues."

 # ---- Toulouse & land
 occ_capitol_of_toulouse_title: "The Capitol of Toulouse"
 occ_capitol_of_toulouse_desc: "Toulouse is run from the Capitole by its capitouls, magistrates elected by the city, and they keep better accounts than most kings. Build the city up and let the capitouls lend their clerks to the crown."
 occ_pastel_country_title: "Pastel Country"
 occ_pastel_country_desc: "Pastel, the woad plant, turns the fields around Toulouse blue every summer, and the dye made from it sells from Bordeaux to Antwerp. With workshops across Languedoc and Guyenne and the cloth of Languedoc behind it, the Midi could live off its colour."
 occ_schools_of_montpellier_title: "The Schools of Montpellier"
 occ_schools_of_montpellier_desc: "Montpellier, in Languedoc, has taught medicine and law since before the old realms fell, and its teachers still read Arabic and Hebrew books that are banned elsewhere. Once the new learning reaches us and the city has grown around its schools, the crown can charter them as a proper university."
 occ_lions_gulf_trade_title: "Trade of the Gulf of Lion"
 occ_lions_gulf_trade_desc: "The Gulf of Lion runs from Marseille to the Pyrenees, and most of its trade still ends up in Genoese hands. If Aix and its port of Marseille become a real centre of trade and our merchants take their share of the Genoa market, the gulf will pay for the crown."

 # ---- Paratge
 occ_the_consulates_title: "The Consulates"
 occ_the_consulates_desc: "Every town of the Languedoc worth the name elects its own consuls and keeps its own charter, from Narbonne on the coast to Carcassonne on its hill. Give the towns their town halls and courts and keep the merchants content, and the consulates will pay their taxes and man their walls. Trample them and they will lock their gates."
 occ_the_floral_games_title: "The Floral Games"
 occ_the_floral_games_desc: "Every May the Consistori del Gai Saber, a society of poets in Toulouse, holds a contest in the langue d'oc and gives a golden violet to the best poem. The games have outlived counts, crusades and the breaking of the old realms. A crown that pays for them is seen to care for the Occitan tongue."
 occ_troubadours_courts_title: "Courts of the Troubadours"
 occ_troubadours_courts_desc: "The troubadours once travelled from court to court across the south, and a lord was judged by the songs sung about him. Win the good opinion of our neighbours and the old courts can meet again under our patronage."
 occ_parliament_of_toulouse_title: "Parliament of Toulouse"
 occ_parliament_of_toulouse_desc: "A realm of consuls, lords and Perfecti needs a court where their disputes can be heard. A Parliament sitting in Toulouse would make paratge the law of the land rather than a line in a song."
 occ_parliament_of_toulouse_tt: "The §YParatge§! side of our government now also gives up to §G-1§! National Unrest and §G+10%§! National Tax Modifier."
 occ_paratge_triumphant_title: "Paratge Triumphant"
 occ_paratge_triumphant_desc: "The old songs describe a south where a lord kept his word, a town kept its charter and a stranger was heard. If our realm can be that, and hold many peoples in peace, the song will have been true after all."

 # ---- Mediterranean
 occ_marseille_harbour_title: "The Harbour of Marseille"
 occ_marseille_harbour_desc: "Marseille, the port of Aix in Provence, has the best harbour between Genoa and Barcelona, and Toulon along the coast shelters a fleet in any weather. Take the Provencal coast, build up the docks, and the Midi has a navy."
 occ_across_the_pyrenees_title: "Across the Pyrenees"
 occ_across_the_pyrenees_desc: "The Catalans and the Occitans share a coast and nearly a language, and King Peter of Aragon, count of Barcelona, died at Muret in 1213, fighting beside the count of Toulouse. Roussillon and Barcelona can be ours, by conquest or by friendship."
 occ_across_the_pyrenees_dyn_a: "If we own §YBarcelona§!:"
 occ_across_the_pyrenees_dyn_b: "If §YBarcelona§! is held by our subject:"
 occ_across_the_pyrenees_dyn_c: "If §YBarcelona§! is held by our ally:"
 occ_balearic_bridge_title: "The Balearic Bridge"
 occ_balearic_bridge_desc: "The Balearic Islands sit halfway between Barcelona and the African coast, and every ship bound for Sardinia passes them. Hold the islands and keep enough light ships or galleys to patrol them."
 occ_mistress_of_the_middle_sea_title: "Mistress of the Middle Sea"
 occ_mistress_of_the_middle_sea_desc: "Sardinia and Corsica close off the western Mediterranean. With both islands and a proper fleet, no one sails between Marseille and Tunis without our leave."

 # ---- Cathar faith
 occ_perfecti_endure_title: "The Perfecti Endure"
 occ_perfecti_endure_desc: "The Perfecti, the ascetic preachers of the Cathar faith, survived the crusade in the hills around Foix, where the castle of Montségur held out to the end. Rebuild a fortress in Foix or let the town grow strong again, keep the realm united in the faith and the clergy content, and the Perfecti will preach openly again."
 occ_avignon_question_title: "The Avignon Question"
 occ_avignon_question_desc: "Avignon, in Provence, was the seat of the popes for most of a century, and the Palace of the Popes still stands over the Rhone. Now that the city is in our hands, we have to decide what the Church of the Good Men makes of it."
 occ_houses_of_good_men_title: "Houses of the Good Men"
 occ_houses_of_good_men_desc: "Before the crusade every Cathar town had its houses of the Good Men, where the Perfecti lived, taught and gave the consolament to the dying. Rebuild them across a realm that is Cathar through and through."
 occ_houses_of_good_men_tt: "Up to §Y3§! of our §YCathar§! provinces get the permanent modifier '§YHouse of the Good Men§!', provinces with at least §Y15§! development before the others. Each one also gets its tax building upgraded: a §YTemple§! if it has none, a §YCathedral§! if it has a Temple, or §G+2§! Base Tax if it already has a Cathedral."
 occ_zeal_below_50_tt: "§YParatge§! is below §Y-50§! (Zeal)"
 occ_italian_mission_title: "The Italian Mission"
 occ_italian_mission_desc: "The Cathar faith once had churches in Lombardy and Tuscany as well as in the Midi. From the Ligurian coast our preachers can reach Italy again, and the road to Rome begins at Genoa."
 occ_italian_mission_zeal_tt: "If §YParatge§! is below §Y-50§! (Zeal), every province of §YLiguria§! we own §Gconverts§! to the §YCathar§! faith."
 occ_throne_of_peter_title: "The Throne of Peter"
 occ_throne_of_peter_desc: "It was from Rome that the crusade against the Midi was called. Hold Rome and all of Lazio, and the city of the popes will hear the Good Men preach."

 # ---- Events
 occ_events.1.t: "A Sign in the Breaking"
 occ_events.1.d: "The Midi is whole again, the first of the old realms to be put back together since everything came apart. In Toulouse they are already arguing about what the breaking meant. The Perfecti say it proves what they always taught: this world was never God's work, and it falls apart because evil made it. The consuls say it was a trial, and that the south passed it by keeping faith with each other. The capitouls, the elected magistrates of Toulouse, mostly want the roads repaired."
 occ_events.1.a: "The Perfecti are right. The world is the work of evil."
 occ_events.1.b: "It was a trial of honour, and we passed it."
 occ_events.1.c: "Whatever it was, there is rebuilding to do."
 occ_events.2.t: "The Floral Games"
 occ_events.2.d: "The Consistori del Gai Saber, the society of poets that has met in Toulouse every May for over a century, has asked the crown to sponsor this year's Floral Games. The winning poem, in the langue d'oc, is rewarded with a golden violet. Some of the younger poets want the games opened to verse in Catalan, French and Hebrew as well."
 occ_events.2.a: "Pay for a golden violet worthy of the crown."
 occ_events.2.b: "Open the games to every tongue."
 occ_events.2.c: "A modest ceremony will do."
 occ_events.3.t: "Courts of Love"
 occ_events.3.d: "The troubadours are back at our court, and with them the old courts of love, where lords and ladies judged questions of honour and verse. The courts have been popular enough that our chancellor suggests they could be given real work."
 occ_events.3.a: "Let them receive envoys from our neighbours."
 occ_events.3.b: "Let them hear disputes between our subjects."
 occ_events.3.c: "Let them stay courts of song."
 occ_events.4.t: "The Avignon Question"
 occ_events.4.d: "Avignon is ours, and with it the Palace of the Popes, the largest building in the Midi. The Perfecti want it turned into a seat of the Cathar church. The consuls of Avignon, who have lived well off pilgrims for a century, would rather it were left as it is, and Rome has made it known it would pay well to have it back in friendly hands."
 occ_events.4.a: "Make it a seat of the Good Men."
 occ_events.4.b: "Spare the palace and the city."
 occ_events.4.c: "Take Rome's money."
 occ_events.5.t: "Paratge Triumphant"
 occ_events.5.d: "Travellers from the north come to Toulouse expecting a nest of heretics and find a court where Cathars, Catholics and Jews argue in the same hall and a lord who breaks his word is shamed in verse. For once the realm lives up to its songs."
 occ_events.5.a: "Let it be proclaimed in every town."
 occ_events.5.b: "Write it into the law of the realm."
 occ_events.6.t: "The Throne of Peter"
 occ_events.6.d: "The city that called the crusade against the Midi is in Cathar hands. The Pope and most of the cardinals have fled, but the archives of the Curia were left behind, with every sentence ever passed against the Good Men. The Perfecti want them burned in the square before Saint Peter's. The consuls remind us that a few cardinals are still hiding in the city, and that every Catholic court will hear how we treat them."
 occ_events.6.a: "Burn the archives."
 occ_events.6.b: "Keep them, so no one forgets."
 occ_events.6.c: "Give the cardinals safe conduct."
 occ_events.6.e: "Let the Perfecti preach a crusade of our own."
 occ_events.11.t: "The Two Tongues"
 occ_events.11.d: "The north answers to Toulouse now. The barons of Champagne and Picardy wait to hear whether they keep their lands, the towns of the Île-de-France want to know which of their charters still stand, and the Perfecti point out that Paris has never once heard a Good Man preach. The council has sat for three days. Everyone agrees the north cannot be ruled as it was before. Nobody agrees on how it should be ruled instead."
 occ_events.11.a: "One crown for both tongues."
 occ_events.11.b: "The northern lords keep their lands, as our vassals."
 occ_events.11.c: "Give the northern towns charters, as in the Midi."
 occ_events.11.e: "Send the Perfecti north."
 occ_events.11.a_tt: "We gain permanent claims on every province in §YFrance§! that borders us and is not yet held by us or our subjects."
 occ_events.11.b_tt: "Every subject with its capital in §YFrance§! loses §G15§! Liberty Desire."
 occ_events.11.e_tt: "If we own §YParis§! and it is not §YCathar§!, it §Gconverts§! to the §YCathar§! faith."
 occ_events.7.t: "The Ideal of Paratge"
 occ_events.7.d: "Nobody in the realm can remember the consuls, the lords and the Perfecti agreeing on so much. Foreign envoys write home about the courtesy of the Occitan court, and the troubadours have run out of complaints."
 occ_events.7.a: "Celebrate it."
 occ_events.7.b: "Spend the goodwill on the realm."
 occ_events.8.t: "The Zeal of the Perfecti"
 occ_events.8.d: "The Perfecti now have the ear of the court and the loyalty of the crowds. They preach in every market, and converts come in by the thousand. The consuls warn that the preaching is turning neighbour against neighbour."
 occ_events.8.a: "Let them preach."
 occ_events.8.b: "Rein them in."
 occ_events.9.t: "Houses of the Good Men"
 occ_events.9.d: "For the first time since the crusade, the Good Men can live openly among their flock. Houses are being raised in [occ_good_men_house_1.GetName] and other towns of the faith, where the Perfecti will live together, teach the believers and give the consolament to the dying. The crown has only to grant them the ground."
 occ_events.9.a: "Let the houses open their doors."
 occ_events.10.t: "The Floral Games"
 occ_events.10.d: "May has come round again, and the Consistori del Gai Saber gathers in Toulouse to judge the year's poems. Poets have come from across the Midi and a few from beyond it, and the crown's patronage is expected."
 occ_events.10.d_leys: "The Consistori del Gai Saber meets in Toulouse for the Floral Games, and this year its masters bring more than poems. They have finished the Leys d'Amors, their book of the rules of the langue d'oc, and ask the crown to pay for copies so it can be taught in every town of the Midi."
 occ_events.10.a: "A golden violet for the winner."
 occ_events.10.b: "Open the contest to verse in every tongue."
 occ_events.10.c: "Bring the winning poet to court."
 occ_events.10.e: "Publish the Leys d'Amors."
 occ_events.10.f: "Give the violet to a poet of another faith."
 occ_events.10.g: "The Perfecti call the games a vanity. Cancel them."
 occ_events.10.h: "Commission sirventes against our enemies."
 occ_events.10.i: "Let the capitouls pay for the violet."
 occ_events.10.j: "Invite the poets of Barcelona."
 occ_events.10.k: "Hold this year's games in Rome."
 occ_events.10.l: "Our [Root.Monarch.GetTitle] enters a poem of [Root.Monarch.GetHerHis] own."
 occ_events.10.m: "Let [Root.Consort.GetName] preside over a court of love."
 occ_events.10.n: "Ask the doctors of Montpellier to judge the verse."
 occ_events.10.o: "Every town of the Midi wants its own games this year."
 occ_events.10.p: "Poets have come from every court in Europe."
 occ_events.10.q: "Hold the games in Paris, in the langue d'oc."
 occ_events.10.r: "Crown the winner before the imperial court."
 occ_floral_violet_opinion_tt: "Neighbours of another faith gain §G+15§! opinion of us."
 occ_floral_violet_opinion: "Crowned a Poet of Our Faith"
 occ_floral_electors_opinion_tt: "Every §YElector§! gains §G+15§! opinion of us."
 occ_floral_guest_opinion: "Guest at the Floral Games"
 occ_sirventes_modifier: "Sirventes"
 desc_occ_sirventes_modifier: "The troubadours' war songs mock the enemy in every camp and tavern, and our soldiers sing them on the march."
 occ_laureate_home_modifier: "Home of the Laureate"
 desc_occ_laureate_home_modifier: "§gThe winner of the golden violet comes from here, and the town has not stopped talking about it.§!"
 occ_barcelona_jocs_florals_modifier: "Jocs Florals of Barcelona"
 desc_occ_barcelona_jocs_florals_modifier: "§gBarcelona holds its own Floral Games every May, in the Catalan manner, under the crown's patronage.§!"
 occ_rome_games_modifier: "Floral Games of Rome"
 desc_occ_rome_games_modifier: "§gThe Floral Games were held in Rome, and the city that once preached the crusade against the Midi listened to its poets.§!"
 occ_paris_verse_modifier: "Occitan Verse in Paris"
 desc_occ_paris_verse_modifier: "§gThe Floral Games were held in Paris, in the langue d'oc, and the city has taken to the songs of the south.§!"
 occ_capitouls_unlock_tt: "Unlocks the §Y[Root.GetBurghersName]§! privilege §YCapitoulat of Toulouse§!."
 occ_floral_games_return_tt: "The §YFloral Games§! will return to Toulouse in May, about once every §Y10§! years."
 occ_montsegur_pilgrimage_unlock_tt: "Unlocks the decision §YPilgrimage to Montségur§!."
 occ_pilgrimage_to_montsegur_title: "@[Root.GetTag] Pilgrimage to Montségur"
 occ_pilgrimage_to_montsegur_desc: "Every spring the believers climb the Pog to the castle where the last Perfecti held out against the crusaders. If the court walks with them and pays the alms, the [Root.GetClergyName] will remember it."
 occ_montsegur_pilgrimage_cooldown_tt: "No pilgrimage to Montségur has been made in the last §Y15§! years."
 dse_estate_burghers_occ_capitoulat: "Capitoulat of Toulouse"
 dse_estate_burghers_occ_capitoulat_desc: "The capitouls, the elected magistrates of Toulouse, ask the crown to confirm their old rights: to govern the city from the Capitole, judge its quarrels and enter the nobility when their term ends. In return they run the city's affairs at their own cost."
 occ_montsegur_modifier: "The Pog of Montségur"
 desc_occ_montsegur_modifier: "§gThe castle on the Pog above Montségur, where the last Perfecti held out against the crusaders, is garrisoned again. Believers climb the path to it every spring.§!"
 occ_capitoulat_modifier: "Capitoulat"
 desc_occ_capitoulat_modifier: "§gThe capitouls govern Toulouse from the Capitole and collect its dues more carefully than any royal officer would.§!"
 occ_leys_damors_modifier: "The Leys d'Amors"
 desc_occ_leys_damors_modifier: "The Leys d'Amors, the rules of the langue d'oc written for the Floral Games, are copied and taught across the realm."

 # Reformation centre
 cathar_center_of_reformation: "Center of Reformation"

 # Paratge mechanic
 occ_paratge_mechanic: "Paratge"
 ability_occ_paratge_mechanic: "§YParatge§!"
 paratge: "Paratge"
 monthly_paratge: "Monthly Paratge"
 paratge_desc: "§YParatge§! is the old Occitan ideal of honour among equals: a lord who keeps his word, a town that keeps its charter, a court where a stranger is heard. Against it stands the §YZeal§! of the Perfecti, who would see the whole realm turned to the true faith.\n\nThe effects grow the further the bar leans to one side:\n\n§YFull Paratge (+100):§!\nTrade Efficiency: §G+10%§!\nTolerance of Heretics: §G+2§!\nDiplomatic Reputation: §G+1§!\nNational Unrest: §G-1§!, National Tax Modifier: §G+10%§! (after the §YParliament of Toulouse§!)\n\n§YFull Zeal (-100):§!\nTolerance of the True Faith: §G+2§!\nMissionary Strength: §G+3%§!\nWar Score Cost vs Other Religions: §G-10%§!\n\n§YTowards Paratge:§!\nStability: §G+0.02§! per point\nPrestige: up to §G+0.05§!, Legitimacy: up to §G+0.025§!\nSatisfied Burghers, Traders in power: §G+0.10§! each\nA realm of many faiths: up to §G+0.10§!\nAt least 2 Accepted Cultures, an Artist advisor: §G+0.10§! each\nBeing at peace: §G+0.05§!\nA tolerant, kind-hearted or benevolent ruler: small bonus\n\n§YTowards Zeal:§!\nNegative Stability: §R-0.05§! per point\nReligious Unity: up to §R-0.10§!\nSatisfied Clergy, Church in power, Defender of the Faith, an Inquisitor advisor: §R-0.10§! each\nBeing at war, Militarists in power: §R-0.05§! each\nA zealous, pious or cruel ruler: small bonus\n\nMissions, events and modifiers also move it."
 occ_paratge_monarchy: "Paratge Monarchy"
 occ_paratge_monarchy_desc: "The lords of the Midi never ruled alone. The towns kept their consuls, the courts their customs, and a lord was judged by whether he kept his word. The crown of Occitania rests on the same bargain, while the merchants, the Perfecti and the old fighting houses of the south still compete for its ear."
 occ_patronise_troubadours: "Patronise the Troubadours"
 occ_patronise_troubadours_desc: "Pay for new songs to be written and sung in the langue d'oc. The troubadours carry the good name of our court to every hall in the Midi, and the better our name already is, the further the songs travel.\n"
 occ_troubadours_scaling_tt: "Gain §G+1§! Paratge for every §Y5§! Prestige, up to §G+20§!. Doubled if we employ an §YArtist§! advisor."
 occ_troubadours_overflow_tt: "Paratge is already above §Y75§!. The new songs add to our fame instead."
 occ_open_the_gates: "Open the Gates"
 occ_open_the_gates_desc: "Exiles from the crusading lands, craftsmen of every tongue and faith, are knocking at our gates. Let them in, and let our officials keep their word that none will be turned away.\n"
 occ_open_gates_settle_2_tt: "\nRefugee craftsmen settle in §Y2§! of our cities, preferring centres of trade and towns with trade buildings. Each gains §G+1§! Base Production.\n"
 occ_open_gates_settle_3_tt: "\nRefugee craftsmen settle in §Y3§! of our cities, preferring centres of trade and towns with trade buildings. Each gains §G+1§! Base Production.\n"
 occ_public_disputation: "Hold a Public Disputation"
 occ_public_disputation_desc: "At Montreal near Carcassonne and at Pamiers in Foix the Good Men once argued their faith in open debate against the preachers of Rome, before the lords of the Midi. Call such a disputation again. Whatever the outcome, it will cool the passions of the realm, and it will be remembered for the side we took.\n"
 occ_disputation_paratge_tt: "The debate ends without a verdict, and both sides are heard with courtesy. Paratge is spent, and our tolerance is noted abroad: neighbours of another faith gain §G+25§! opinion of us.\n"
 occ_disputation_zeal_tt: "Our preachers carry the day, and the crowds follow them home. Zeal is spent, but the faith gains ground.\n"
 occ_disputation_convert_tt: "The most developed province of another faith in our realm §Gconverts§! to our religion."
 # Modifiers
 occ_highland_levies_modifier: "Highland Levies"
 desc_occ_highland_levies_modifier: "The hill country of Auvergne and the Massif Central sends its sons to our banners."
 occ_lilies_humbled_modifier: "The Lilies Humbled"
 desc_occ_lilies_humbled_modifier: "The French crown no longer speaks for the south, and the other courts of Europe have noticed."
 occ_one_crown_modifier: "One Crown for Both Tongues"
 desc_occ_one_crown_modifier: "Oc and oïl answer to the same crown, and every French land that is not yet ours is waiting to be brought under it."
 occ_peers_of_the_north_modifier: "Peers of the North"
 desc_occ_peers_of_the_north_modifier: "The lords of the north keep their lands and titles, and now hold them from Toulouse."
 occ_northern_charters_modifier: "Charters for the North"
 desc_occ_northern_charters_modifier: "The towns of the north have been given charters modelled on the consulates of the Midi, and are coming to like them."
 occ_preaching_in_the_north_modifier: "Good Men in the North"
 desc_occ_preaching_in_the_north_modifier: "Perfecti preach in the markets of the north, where the crusade against the Midi was once preached."
 occ_capitoul_administration_modifier: "The Capitouls of Toulouse"
 desc_occ_capitoul_administration_modifier: "The capitouls, the elected magistrates of Toulouse, run the city from the Capitole and lend their clerks to the crown to bring newly won lands under its law."
 occ_pastel_fields_modifier: "Pastel Fields"
 desc_occ_pastel_fields_modifier: "§gThe fields around Toulouse grow pastel, the woad plant that gives Europe its blue dye.§!"
 occ_montpellier_schools_modifier: "Schools of Montpellier"
 desc_occ_montpellier_schools_modifier: "The medical and law schools of Montpellier, in Languedoc, draw students from all over the Mediterranean."
 occ_lions_gulf_merchants_modifier: "Merchants of the Gulf of Lion"
 desc_occ_lions_gulf_merchants_modifier: "Occitan merchants from Marseille to Narbonne hold their own against the Genoese in the trade of the Gulf of Lion."
 occ_consulates_modifier: "The Consulates"
 desc_occ_consulates_modifier: "Our towns govern themselves through elected consuls, and in return they stand by the crown."
 occ_troubadour_courts_modifier: "Courts of the Troubadours"
 desc_occ_troubadour_courts_modifier: "Envoys and poets pass between our court and the courts of our neighbours, and our name is spoken well."
 occ_paratge_realised_modifier: "Paratge Realised"
 desc_occ_paratge_realised_modifier: "Honour among equals is no longer an old song. It is how the realm is run."
 occ_paratge_proclaimed_modifier: "Paratge Proclaimed"
 desc_occ_paratge_proclaimed_modifier: "Every town has heard it read aloud: whoever keeps faith with the realm is a peer within it, whatever tongue they speak."
 occ_marseille_arsenal_modifier: "Arsenal of Marseille"
 desc_occ_marseille_arsenal_modifier: "§gThe shipyards of Marseille, the port of Aix, build and fit out galleys for the crown.§!"
 occ_pyrenean_bond_modifier: "Across the Pyrenees"
 desc_occ_pyrenean_bond_modifier: "The Catalans and the Occitans share a coast, a trade and much of a language. Old ties across the Pyrenees are being renewed."
 occ_balearic_waystation_modifier: "Balearic Waystation"
 desc_occ_balearic_waystation_modifier: "Our ships put in at the Balearic Islands on their way to Sardinia and the African coast."
 occ_middle_sea_modifier: "Mistress of the Middle Sea"
 desc_occ_middle_sea_modifier: "From the Balearics to Sardinia and Corsica, the western Mediterranean belongs to the Occitan fleet."
 occ_perfecti_modifier: "The Perfecti Endure"
 desc_occ_perfecti_modifier: "The Perfecti, the ascetic preachers of the Cathar faith, walk openly again where once they hid in the hills around Foix."
 occ_good_men_house_modifier: "House of the Good Men"
 desc_occ_good_men_house_modifier: "§gA house of the Good Men stands here, where the Perfecti live, teach and give the consolament to the dying.§!"
 occ_italian_preachers_modifier: "Preachers in Italy"
 desc_occ_italian_preachers_modifier: "Cathar preachers work their way down the Italian coast from Liguria."
 occ_cathar_rome_modifier: "Rome of the Good Men"
 desc_occ_cathar_rome_modifier: "The city of the popes is in Cathar hands, and the Perfecti preach from the steps where the crusade against the Midi was called."
 occ_sign_zeal_modifier: "A Sign of Evil"
 desc_occ_sign_zeal_modifier: "The Perfecti preach that the breaking of the realms proves this world was never God's work."
 occ_courts_of_law_modifier: "Courts of Law"
 desc_occ_courts_of_law_modifier: "The courts of Occitania settle quarrels before they become revolts."
 occ_courts_of_song_modifier: "Courts of Song"
 desc_occ_courts_of_song_modifier: "The best songs of the Midi are sung first at our court."
 occ_paratge_law_modifier: "Paratge in Law"
 desc_occ_paratge_law_modifier: "Every people of the realm has the same standing before our courts."
 occ_burned_curia_modifier: "The Curia Burned"
 desc_occ_burned_curia_modifier: "The archives of the popes are ash, and with them the old sentences against the Cathars."
 occ_ashes_of_the_curia_modifier: "Ashes of the Curia"
 desc_occ_ashes_of_the_curia_modifier: "§gThe Perfecti preach over the ashes of the papal archives. Many Romans listen, and many more are angry.§!"
 occ_archive_of_sentences_modifier: "Archive of the Sentences"
 desc_occ_archive_of_sentences_modifier: "§gThe records of the Curia are kept in Rome, open to anyone who wants to know what was done to the Midi and why.§!"
 occ_safe_conduct_modifier: "Safe Conduct for the Cardinals"
 desc_occ_safe_conduct_modifier: "We let the cardinals leave Rome unharmed. Even Catholic courts admit that the Occitans kept their word."
 occ_counter_crusade_modifier: "The Counter-Crusade"
 desc_occ_counter_crusade_modifier: "Rome once called a crusade against the Midi. Now the Perfecti call one against Rome's faithful."
 occ_burned_the_curia_opinion: "Burned the Curia"
 occ_spared_the_cardinals_opinion: "Spared the Cardinals"
 occ_burned_curia_opinion_tt: "Every §YCatholic§! country gets §R-50§! opinion of us (§YBurned the Curia§!)."
 occ_spared_cardinals_opinion_tt: "Every §YCatholic§! country gets §G+25§! opinion of us (§YSpared the Cardinals§!)."
 occ_throne_of_peter_c_tt: "Requires §YParatge§! of at least §Y50§!:"
 occ_throne_of_peter_d_tt: "Requires §YParatge§! below §Y-50§! (Zeal):"
 occ_avignon_question_a_tt: "Requires the §YCathar§! faith and §YAvignon§! owned directly:"
 occ_ideal_of_paratge_modifier: "The Ideal of Paratge"
 desc_occ_ideal_of_paratge_modifier: "For now the realm lives up to its own songs."
 occ_zeal_unleashed_modifier: "Zeal Unleashed"
 desc_occ_zeal_unleashed_modifier: "The Perfecti preach without restraint. Converts come quickly, and so do quarrels."
 occ_open_gates_province_modifier: "Open Gates"
 desc_occ_open_gates_province_modifier: "§gNewcomers of another tongue or faith have been welcomed here, and they pay their dues like anyone else.§!"
 occ_open_gates_minorities_tt: "Every city of another faith or a non-accepted culture gets '§YOpen Gates§!' for §Y10§! years:\nLocal Unrest: §R+1.00§!\nLocal Tax Modifier: §G+15.0%§!\n"
 occ_disputation_tolerance_modifier: "The Disputation Heard"
 desc_occ_disputation_tolerance_modifier: "Our disputation ended with both sides heard in peace, and the realm is calmer for it."
 occ_disputation_zeal_modifier: "The Disputation Won"
 desc_occ_disputation_zeal_modifier: "Our preachers won the disputation, and their arguments are repeated in every market town."
 occ_disputation_opinion: "Heard at the Disputation"
 # ---- Mid/late: Consular Republic
 occ_consular_republic: "Consular Republic"
 occ_consular_republic_desc: "The Midi has always had consuls, elected by the towns to keep their charters and man their walls. In the Consular Republic they rule the whole realm, while the merchants, the Perfecti and the old fighting houses of the south still compete for their votes."
 occ_events.19.t: "The Paratge Reform"
 occ_events.19.d: "Our government keeps its Paratge reform in step with its form."
 occ_events.19.a: "Very well."
 # ---- Mid/late: Crown and Consulates (mechanic)
 occ_crown_route_req_tt: "Requires §YAbsolutism§! of at least §Y60§!:"
 occ_consulates_route_req_tt: "Requires §YParatge§! of at least §Y60§! and the §YParliament of Toulouse§!:"
 occ_crown_route_tt: "The crown becomes the §YRoyal Arbiter§!: while §YParatge§! is between §Y-25§! and §Y25§!, our government gives Max Absolutism: §G+10§! and Stability Cost Modifier: §G-10%§!. §YPublic Disputation§! also gives §G+5§! Absolutism."
 occ_consulates_route_tt: "The §YParatge§! side of our government also gives up to §G+10%§! [Root.GetBurghersName] Influence, and §YOpen the Gates§! settles craftsmen in §Y1§! more city."
 occ_open_gates_consulates_tt: "The consulates settle craftsmen in §Y1§! more city."
 # ---- Mid/late: mercenaries
 merc_occ_cadets_de_gascogne: "§JCadets de Gascogne§!"
 # ---- Mid/late: privileges
 dse_estate_burghers_occ_chamber_of_commerce: "Chamber of Commerce of Marseille"
 dse_estate_burghers_occ_chamber_of_commerce_desc: "The merchants of Marseille run their own chamber of commerce, which settles disputes, inspects cargoes and speaks for the port at court. While granted, Marseille gets '§YChamber of Commerce§!' (Local Trade Power: §G+25%§!, Local Tax Modifier: §G+10%§!)."
 dse_estate_church_occ_council_of_good_men: "Council of the Good Men"
 dse_estate_church_occ_council_of_good_men_desc: "The council of the Good Men meets regularly and speaks for the church on matters of doctrine. Some of its benefits depend on the doctrine the council chose."
 occ_chamber_of_commerce_modifier: "Chamber of Commerce"
 desc_occ_chamber_of_commerce_modifier: "§gThe merchants of Marseille settle their own disputes and inspect their own cargoes.§!"
 # ---- Mid/late: Cathar faith
 occ_age_reformation_tt: "The §YAge of Reformation§! or a later age has begun"
 occ_age_absolutism_tt: "The §YAge of Absolutism§! or a later age has begun"
 occ_brothers_in_heresy_title: "Brothers in Heresy"
 occ_brothers_in_heresy_desc: "For centuries the Good Men were the only Christians in the west who said no to Rome. Now preachers in the north print their own arguments against the Pope, and whole realms turn their backs on him. They are not Cathars, and most of them would burn a Perfectus as quickly as any inquisitor. But Rome's enemies could still be useful to each other."
 occ_brothers_in_heresy_friend_tt: "A country of the §YProtestant§!, §YReformed§!, §YHussite§!, §YWaldensian§!, §YLollard§!, §YAnglican§! or §YBogomilist§! faith is our ally or subject, or has at least §Y150§! opinion of us"
 occ_brothers_in_heresy_alone_tt: "No country of the §YProtestant§!, §YReformed§!, §YHussite§!, §YWaldensian§!, §YLollard§!, §YAnglican§! or §YBogomilist§! faith exists, and we own at least §Y25§! §YCathar§! provinces"
 occ_book_of_two_principles_title: "Book of the Two Principles"
 occ_book_of_two_principles_desc: "The Book of the Two Principles, written in Italy long before the old realms broke apart, teaches that the world was made by an evil power and the soul by a good one. For generations it was copied by hand and hidden from the inquisitors. Now the printers of Toulouse can turn it out by the hundred."
 occ_council_of_good_men_title: "Council of the Good Men"
 occ_council_of_good_men_desc: "The church of the Good Men has never had a pope, only its bishops, deacons and Perfecti, and they have never fully agreed with each other. Some teach that the evil power is as old as the good one, others that it is a fallen servant. Call every Cathar church of the realm to a council and settle what the faith of the Midi is to be."
 occ_council_seat_tt: "The council meets in §YRome§! if we own it and it is §YCathar§!. Otherwise it meets in §YToulouse§! if we own it, or else in our capital. The council's seat gets the permanent modifier '§YSeat of the Council§!' (Local Unrest: §G-1§!, Local Missionary Strength: §G+2%§!, Local Trade Power: §G+10%§!)."
 occ_council_privilege_unlock_tt: "Unlocks the §Y[Root.GetClergyName]§! privilege §YCouncil of the Good Men§!."
 occ_last_crusade_title: "The Last Crusade"
 occ_last_crusade_desc: "Rome has called crusades against the Midi before, and the Good Men remember every one. As long as a Catholic power strong enough to try again stands at our border, the faith is not safe. Break the will of Rome's champions, or grow so strong that none of them dares to march."
 occ_last_crusade_war_tt: "We have won a war against a §YCatholic§! great power in the last §Y25§! years"
 occ_last_crusade_no_stronger_tt: "No §YCatholic§! great power has a stronger army than ours"
 occ_last_crusade_no_gp_tt: "No §YCatholic§! country is a great power"
 occ_last_crusade_cathar_count_tt: "At least §Y150§! provinces in Europe are §YCathar§!"
 occ_last_crusade_catholic_count_tt: "Fewer than §Y300§! provinces in Europe are §YCatholic§!"
 occ_events.12.t: "Brothers in Heresy"
 occ_events.12.d: "Letters have come from the new churches of the north. Their preachers want to know where the Church of the Good Men stands. They do not share our faith, they write, but they share our enemies. The Perfecti want nothing to do with men who still believe the world was made by a good God. The consuls point out that these churches are driving their own dissenters into exile, and that many of the exiles are craftsmen."
 occ_events.12.a: "A common front against Rome."
 occ_events.12.b: "We walk our own road."
 occ_events.12.c: "Take in their exiles."
 occ_events.12.a_tt: "Every country of the §YProtestant§!, §YReformed§!, §YHussite§!, §YWaldensian§!, §YLollard§!, §YAnglican§! or §YBogomilist§! faith gains §G+25§! opinion of us (§YBrothers in Heresy§!)."
 occ_events.13.t: "The Council of the Good Men"
 occ_events.13.d: "Bishops, deacons and Perfecti from every Cathar church in the realm have gathered in [occ_council_seat.GetName]. For a month they have argued over the oldest question of the faith: is the evil power as old and as strong as the good one, or a fallen servant who will one day be undone? Their answer will shape what our church asks of its believers."
 occ_events.13.d_noseat: "Bishops, deacons and Perfecti from every Cathar church in the realm have gathered in council. For a month they have argued over the oldest question of the faith: is the evil power as old and as strong as the good one, or a fallen servant who will one day be undone? Their answer will shape what our church asks of its believers."
 occ_events.13.a: "The evil power is a fallen servant."
 occ_events.13.b: "Two powers, both eternal."
 occ_events.13.c: "The consolament for all who ask."
 occ_events.13.e: "A church of the poor."
 occ_brothers_opinion: "Brothers in Heresy"
 occ_brothers_front_modifier: "Common Front"
 desc_occ_brothers_front_modifier: "The Good Men and the new churches of the north stand together against Rome, for now."
 occ_printed_dualism_modifier: "The Printed Book"
 desc_occ_printed_dualism_modifier: "Printed copies of the Book of the Two Principles pass from hand to hand in every market town."
 occ_mitigated_dualism_modifier: "Mitigated Dualism"
 desc_occ_mitigated_dualism_modifier: "Our church teaches that the evil power is a fallen servant, and that those who err can still be won back."
 occ_absolute_dualism_modifier: "Absolute Dualism"
 desc_occ_absolute_dualism_modifier: "Our church teaches that two eternal powers fight over the world, and that there is no middle ground between them."
 occ_consolament_for_all_modifier: "Consolament for All"
 desc_occ_consolament_for_all_modifier: "The Perfecti give the consolament to anyone who asks for it sincerely, whatever their tongue."
 occ_church_of_the_poor_modifier: "A Church of the Poor"
 desc_occ_church_of_the_poor_modifier: "Our church owns nothing and asks for nothing, and the people trust it for that."
 occ_council_seat_modifier: "Seat of the Council"
 desc_occ_council_seat_modifier: "§gThe council of the Good Men met here, and pilgrims still come to see the hall.§!"
 occ_church_triumphant_modifier: "Church Triumphant"
 desc_occ_church_triumphant_modifier: "No crusade will come for the Midi again. The Good Men preach where they please."
 # ---- Mid/late: Mediterranean
 occ_ports_of_the_levant_title: "The Ports of the Levant"
 occ_ports_of_the_levant_desc: "The merchants of Marseille have traded with the eastern Mediterranean since the city was Greek. Cloth from Languedoc goes out, and silk, spices and cotton come back from Alexandria, Aleppo and Constantinople. Get our factors into those markets, or come to terms with whoever rules them, and Marseille becomes the gate of the east."
 occ_ports_of_the_levant_dyn_a: "If another country owns §YConstantinople§!, a treaty with its owner:"
 occ_ports_of_the_levant_dyn_b: "Otherwise, if another country owns §YAlexandria§!, a treaty with its owner:"
 occ_chamber_unlock_tt: "Unlocks the §Y[Root.GetBurghersName]§! privilege §YChamber of Commerce of Marseille§!."
 occ_barbary_corsairs_title: "Corsairs of the Barbary Coast"
 occ_barbary_corsairs_desc: "From Algiers, Tunis and the harbours between them, corsairs raid the coast of Provence and take our ships within sight of Marseille. No merchant will sail east while the western sea is not safe. Take their ports, or hunt them down and make their masters pay."
 occ_barbary_ports_tt: "At least §Y2§! of §YMitidja§!, §YTunis§!, §YOran§!, §YKabylia§!, §YAnnaba§! and §YTripoli§! are held by us or our non-tributary subjects"
 occ_barbary_war_tt: "We have won a war in the last §Y15§! years against the owner of §YMitidja§! or §YTunis§!"
 occ_barbary_claims_tt: "Gain permanent claims on every province of the §YBarbary Coast§!, §YKabylia§!, §YTunisia§!, §YAlgiers§! and §YTripolitania§! areas not yet held by us or our subjects."
 occ_ocean_sea_title: "The Ocean Sea"
 occ_ocean_sea_desc: "Beyond Gascogne the Ocean Sea runs all the way to lands the old maps never showed. The wine ships of the Port de la Lune already know the Atlantic, and their crews say there is room out there for a realm that dares to cross it. Give the port a proper harbour, and our captains will go west."
 occ_nouvelle_occitanie_title: "Nouvelle Occitanie"
 occ_nouvelle_occitanie_desc: "Every crown on the Ocean Sea is planting settlements across the water. Let the Occitans have theirs: towns with consuls and charters, and ports that ship their goods home to Gascogne and Marseille. If the new lands are already taken, there is still trade to be had in the far markets."
 occ_nouvelle_occitanie_trade_tt: "We have at least §Y20%§! trade share in the §YGulf of St. Lawrence§!, §YChesapeake Bay§!, §YMississippi River§!, §YMexico§!, §YBrazil§!, §YRio de La Plata§!, §YIvory Coast§!, §YCape of Good Hope§! or §YZanzibar§! trade node"
 occ_levant_treaty_opinion: "Levant Trade Treaty"
 occ_levant_factors_modifier: "Factors in the Levant"
 desc_occ_levant_factors_modifier: "Our factors have their warehouses in the ports of the Levant."
 occ_gascon_mariners_modifier: "Gascon Mariners"
 desc_occ_gascon_mariners_modifier: "The sailors of Gascogne have learned the Ocean Sea, and they are carrying settlers across it."
 occ_nouvelle_occitanie_modifier: "Nouvelle-Occitanie"
 desc_occ_nouvelle_occitanie_modifier: "Occitan towns and factories across the sea send their goods and their dues home."
 # ---- Mid/late: Unity & France
 occ_cadets_of_gascony_title: "The Cadets of Gascony"
 occ_cadets_of_gascony_desc: "A Gascon lord leaves his land to his eldest son. The younger ones get a sword, a horse if they are lucky, and a name to live up to. For generations Gascony has filled other crowns' armies with its cadets. Build an army worth serving in, and they will serve us."
 occ_cadets_unlock_tt: "Unlocks the mercenary company §YCadets de Gascogne§!, recruited in §YBordeaux§!."
 occ_break_the_ring_title: "Break the Ring"
 occ_break_the_ring_desc: "Every realm that grows in the Midi soon finds itself ringed by rivals waiting for it to stumble. We will not wait to be strangled. Beat our rivals in the field, or build an army none of them can match."
 occ_ring_has_rival_tt: "We have at least one rival"
 occ_ring_war_tt: "We have won a war against one of our rivals in the last §Y20§! years"
 occ_ring_army_tt: "None of our rivals has a stronger army than ours"
 occ_ring_claims_tt: "Gain permanent claims on every province of our rivals that borders us."
 occ_iberian_question_title: "The Iberian Question"
 occ_iberian_question_desc: "South of the Pyrenees, Aragon and Valencia look out on the same sea we do, and whoever holds them holds the road into Iberia. Take them, bind their rulers to us, or beat them in the field, and then decide what the Midi wants from the lands beyond the mountains."
 occ_iberian_union_tt: "A country with its capital in §YIberia§! is our junior partner in a personal union"
 occ_iberian_war_tt: "We have won a war in the last §Y20§! years against the owner of §YValencia§! or §YAragon§!"
 occ_events.14.t: "The Iberian Question"
 occ_events.14.d: "Our envoys and our generals agree on one thing: the Pyrenees are no longer the edge of our world. They disagree on everything else. The marshals want the passes and the plains beyond them. The consuls point out that the kings of Iberia buy our cloth and our wine, and that a treaty would cost less than a war."
 occ_events.14.a: "Carve out what borders us."
 occ_events.14.b: "A treaty of the Pyrenees."
 occ_events.14.a_tt: "Gain permanent claims on every province in §YIberia§! that borders us and is not yet held by us or our subjects."
 occ_events.14.b_tt: "Every independent country with its capital in §YIberia§! that borders us gains §G+30§! Trust and §G+50§! opinion of us (§YTreaty of the Pyrenees§!)."
 occ_pyrenees_treaty_opinion: "Treaty of the Pyrenees"
 occ_arbiter_of_the_west_title: "Arbiter of the West"
 occ_arbiter_of_the_west_desc: "There was a time when the Midi was a prize for northern kings to fight over. Now the courts of Europe send their envoys to Toulouse and wait to hear what we think. Become one of the first powers of the world, or wear the imperial crown, and the south will be the one that decides."
 occ_gascon_cadets_modifier: "Gascon Cadets"
 desc_occ_gascon_cadets_modifier: "The younger sons of Gascony fill our infantry, each of them eager to make a name."
 occ_treaty_of_the_pyrenees_modifier: "Treaty of the Pyrenees"
 desc_occ_treaty_of_the_pyrenees_modifier: "A treaty keeps the peace along the Pyrenees, and our envoys come and go freely."
 occ_arbiter_modifier: "Arbiter of the West"
 desc_occ_arbiter_modifier: "The courts of Europe bring their quarrels to Toulouse to be settled."
 # ---- Mid/late: Toulouse & land
 occ_royal_cloth_title: "Royal Cloth of Languedoc"
 occ_royal_cloth_desc: "The cloth of Languedoc is woven in a hundred villages and finished in Montpellier, and the best of it already sells as far as the Levant. Gather the weavers into real manufactories and put the crown's seal on every bolt, and the south will clothe half the Mediterranean."
 occ_survey_two_seas_title: "The Survey of the Two Seas"
 occ_survey_two_seas_desc: "From Narbonne on the Mediterranean to the Garonne and the Ocean Sea, the Midi is barely a week wide. For centuries engineers have dreamed of a canal across it, fed from the springs in the hills above Carcassonne. Survey the route past Carcassonne and Toulouse and down the Garonne to Bordeaux, put up the money, and the works can begin."
 occ_survey_start_canal_tt: "Construction of the §YDeux Canal§! (the Canal des Deux Mers) begins at §YNarbonne§!, paid for with the survey's funds instead of its usual cost."
 occ_canal_deux_mers_title: "Canal des Deux Mers"
 occ_canal_deux_mers_desc: "The canal is open. Barges loaded with wine, grain and cloth pass from Narbonne to the Garonne without ever sailing round Iberia, and Toulouse sits in the middle of it all."
 occ_academy_floral_games_title: "Academy of Floral Games"
 occ_academy_floral_games_desc: "The Consistori del Gai Saber has judged poems in Toulouse every May for centuries. The age of learning asks for more than poetry. Make the old society a royal academy of letters and sciences, and let it choose what the Midi will be known for."
 occ_academy_laurel_tt: "The §YFloral Games§! gain an §YAcademy laurel§! option."
 occ_events.15.t: "The Academy of the Floral Games"
 occ_events.15.d: "The academy has its charter and its hall beside the Capitole of Toulouse, and its first members are already quarrelling over what it is for. The poets want it to keep the langue d'oc alive, the natural philosophers want instruments and a botanical garden, and the physicians of Montpellier want a school of medicine."
 occ_events.15.a: "Letters, and the langue d'oc."
 occ_events.15.b: "Sciences and instruments."
 occ_events.15.c: "Medicine, with Montpellier."
 occ_events.10.s: "Crown an academician."
 occ_languedoc_cloth_modifier: "Royal Cloth"
 desc_occ_languedoc_cloth_modifier: "§gEvery bolt of Languedoc cloth that leaves Montpellier carries the crown's seal.§!"
 occ_canal_port_modifier: "Port of the Two Seas"
 desc_occ_canal_port_modifier: "§gThe barges of the Canal des Deux Mers unload their goods at the quays of Toulouse.§!"
 occ_academy_letters_modifier: "Academy of Letters"
 desc_occ_academy_letters_modifier: "The academy keeps the langue d'oc in print and in fashion."
 occ_academy_sciences_modifier: "Academy of Sciences"
 desc_occ_academy_sciences_modifier: "The academy's instruments and its correspondence reach every learned society in Europe."
 occ_academy_medicine_modifier: "Academy of Medicine"
 desc_occ_academy_medicine_modifier: "The physicians of Montpellier train surgeons for the army and doctors for every town."
 # ---- Mid/late: Paratge
 occ_estates_of_languedoc_title: "The Estates of Languedoc"
 occ_estates_of_languedoc_desc: "Languedoc has always voted its own taxes. Each year its bishops, barons and town consuls meet as the Estates of Languedoc and haggle with the crown over every coin. Some at court call this the heart of paratge. Others say a realm this size cannot be run from a hall full of quarrelling deputies."
 occ_events.16.t: "The Estates of Languedoc"
 occ_events.16.d: "The Estates have sat for six weeks and granted barely half of what the treasury asked. The royal council is split. One faction wants to make the Estates a partner of the crown, with a fixed share in the business of the realm. The other wants royal intendants in every province, and the Estates meeting only to say yes."
 occ_events.16.a: "A land of estates."
 occ_events.16.b: "Send the intendants."
 occ_crown_or_consulates_title: "Crown or Consulates"
 occ_crown_or_consulates_desc: "Sooner or later every realm has to decide who rules it. In Occitania the question has its own shape: either the crown stands above the quarrel between paratge and zeal and settles it, or the towns, their consuls and the Parliament of Toulouse rule by agreement while the crown keeps the peace."
 occ_crown_or_consulates_tt: "An event lets us choose between the routes we qualify for. The choice is permanent."
 occ_events.17.t: "Crown or Consulates"
 occ_events.17.d: "The question can no longer be put off. The crown's ministers want the [Root.Monarch.GetTitle] to settle the quarrels of the realm in person, above Perfecti and consuls alike. The consuls and the Parliament of Toulouse want a realm run by agreement, with the crown as its guarantor rather than its master. Whatever we choose now will shape the realm for generations."
 occ_events.17.a: "The crown stands above the quarrel."
 occ_events.17.b: "The consulates rule by agreement."
 occ_declaration_of_paratge_title: "Declaration of Paratge"
 occ_declaration_of_paratge_desc: "Across the world, men argue about the rights of subjects and the limits of rulers. The Midi had a word for these things long before the philosophers: paratge, the honour that equals owe each other. Write it down as the law of the realm, and decide what kind of state will keep it."
 occ_events.18.t: "The Declaration of Paratge"
 occ_events.18.d: "The declaration has been read in the Capitole of Toulouse and printed in every town of the realm: no subject to be judged without a hearing, no tax without the consent of those who pay it, no faith to be persecuted for its own sake. Now comes the harder part, deciding who will see that it is kept."
 occ_events.18.a: "A crown bound by the declaration."
 occ_events.18.b: "A consular republic."
 occ_events.18.c: "Order first, then rights."
 occ_events.18.e: "Let the debate continue."
 occ_events.18.a_req_tt: "Requires a §YMonarchy§!:"
 occ_events.18.c_req_tt: "Requires the §YCrown§! route of §YCrown or Consulates§!:"
 occ_events.18.b_tt: "Our government becomes a §YRepublic§! with the §YConsular Republic§! reform and gains §G+10§! Republican Tradition. Reforms that do not exist for republics are lost."
 occ_song_was_true_title: "The Song Was True"
 occ_song_was_true_desc: "The old songs promised a south where a lord kept his word, a town kept its charter and a stranger was heard, and for a long time nobody believed them. Make it true for every people of the realm, in good times as in bad, and the songs will be sung about us."
 occ_pays_detats_modifier: "Pays d'États"
 desc_occ_pays_detats_modifier: "The Estates of Languedoc vote the taxes and share in the work of governing."
 occ_royal_intendants_modifier: "Royal Intendants"
 desc_occ_royal_intendants_modifier: "The crown's intendants run the provinces, and the Estates meet when they are told to."
 occ_constitution_modifier: "Bound by the Declaration"
 desc_occ_constitution_modifier: "The crown has sworn to keep the Declaration of Paratge, and its subjects trust it the more for it."
 occ_restored_order_modifier: "Order Restored"
 desc_occ_restored_order_modifier: "The crown has put order before rights, and nobody in the realm doubts who rules it."
 occ_song_was_true_modifier: "The Song Was True"
 desc_occ_song_was_true_modifier: "The troubadours sing about our own time now, and the rest of the world listens."
