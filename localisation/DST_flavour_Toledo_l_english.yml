 tol_open_frontier_markets_modifier: "Open Frontier Markets"
 desc_tol_open_frontier_markets_modifier: "Merchants cross the southern border freely in both directions."
 tol_qurtuba_under_the_crown_modifier: "Qurtuba Under the Crown"
 desc_tol_qurtuba_under_the_crown_modifier: "Córdoba keeps its mosque, its people and its trade under our rule."
