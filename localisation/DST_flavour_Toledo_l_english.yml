l_english:

 # Toledo (TOL): missions/_MIS_Toledo_Missions.txt, events/_DSE_flavour_Toledo.txt

 DST_TOLEDO_CASTILE: "Castile"
 DST_TOLEDO_CASTILE_ADJ: "Castilian"

 # ---- The City
 tol_the_alcazar_title: "The Alcázar"
 tol_the_alcazar_desc: "The Alcázar stands on the highest point of Toledo, where Romans, Goths and kings have all kept a fortress. The city sits on a rock in a bend of the Tagus, and with a strong citadel it can hold out against almost anyone. The walls need work, or the city needs more people to man them."
 tol_the_forges_of_toledo_title: "The Forges of Toledo"
 tol_the_forges_of_toledo_desc: "Toledo's smiths quench their blades in the waters of the Tagus, and a Toledo sword is prized from Lisboa to Napoli. The iron comes from the hills around the city. Proper workshops would let the trade grow beyond a few famous families."
 tol_the_primates_cathedral_title: "The Primate's Cathedral"
 tol_the_primates_cathedral_desc: "The archbishop of Toledo is primate of all the Spains, the first churchman of the peninsula, and his cathedral is meant to look the part. The chapter wants it finished and endowed. A primate on our side would be worth a great deal; one against us would be a constant trouble."
 tol_the_school_of_translators_title: "The School of Translators"
 tol_the_school_of_translators_desc: "For three centuries scholars in Toledo have turned Arabic books into Latin and Castilian: astronomy, medicine, philosophy, law. Astronomers across Christendom still reckon by the Toledan Tables of the stars. A university, or a learned minister to organise the work, would give the school a home."
 tol_the_swordsmiths_of_toledo_title: "The Swordsmiths of Toledo"
 tol_the_swordsmiths_of_toledo_desc: "A great city, a veteran army and enough infantry to carry its steel: when we have all three, every soldier in Castile will carry a Toledo blade, and every enemy will know it."

 # ---- The Crown of Castile
 tol_madrid_title: "Madrid"
 tol_madrid_desc: "Madrid lies a few days north of Toledo, across the plains of New Castile. It is the nearest of the Castilian towns that went their own way when the crown broke, and the first we should bring back under a single ruler."
 tol_valladolid_and_burgos_title: "Valladolid and Burgos"
 tol_valladolid_and_burgos_desc: "Valladolid was the favourite seat of the last Castilian kings, and Burgos calls itself the head of Castile. Together they hold the wool trade of the north and the memory of the old court. A ruler who holds both can summon the cortes of Castile with some right to do it."
 tol_salamanca_title: "Salamanca"
 tol_salamanca_desc: "Salamanca has had its university since 1218 and lawyers from all over the peninsula learn their trade there. It belongs to León now. With Salamanca in our hands, the rest of the old Leonese kingdom would be hard put to deny our claim to it."
 tol_the_crown_of_castile_title: "The Crown of Castile"
 tol_the_crown_of_castile_desc: "When the heartland of Old Castile answers to Toledo and no Castilian court is left anywhere to claim the crown, there is no reason we should not wear it. Toledo was a royal city long before Valladolid."

 # ---- The East
 tol_the_aragonese_match_title: "The Aragonese Match"
 tol_the_aragonese_match_desc: "The Crown of Aragon broke apart as Castile's did, into Aragon, Valencia and Catalonia. A marriage with any of them would give us a footing in the east, and a claim on the rich Valencian coast."
 tol_valencia_title: "València"
 tol_valencia_desc: "València is the gateway to the Mediterranean, with silk weavers, a rich huerta and one of the busiest ports in the peninsula. Our lands at Albacete already look toward it."
 tol_zaragoza_title: "Zaragoza"
 tol_zaragoza_desc: "Zaragoza on the Ebro is the old capital of the kings of Aragon. Holding it would put the whole Ebro valley within reach and open the road to Barcelona."
 tol_barcelona_title: "Barcelona"
 tol_barcelona_desc: "Barcelona's merchants trade from Valencia to Alexandria and their consulate of the sea writes the laws of Mediterranean shipping. The city is proud and will not be easy to hold, but no ruler of Spain can do without it."
 tol_hispania_title: "Hispania"
 tol_hispania_desc: "Castile, León, Aragon and the south. If all of them answer to Toledo and no Muslim king rules anywhere in the peninsula, the old name of Hispania fits our realm better than any other. Toledo, the royal city of the Goths, need not wait for the lawyers: we can take the crown of Spain as soon as the land is ours."

 # ---- The Frontier
 tol_the_southern_frontier_title: "The Southern Frontier"
 tol_the_southern_frontier_desc: "South of the Tagus there is nothing between Toledo and the Muslim kings but the open plains of La Mancha and a few castles. When the crown broke, nobody was left to man the frontier but us. We need to decide how we mean to face it."
 tol_calatrava_title: "Calatrava"
 tol_calatrava_desc: "The knights of Calatrava were founded in 1158 to hold a castle near Ciudad Real, in La Mancha, that the Templars had given up as hopeless. They held it. The order still has its castles and its commanderies, and it would serve us gladly if we gave it reason to."
 tol_convivencia_or_crusade_title: "Convivencia or Crusade"
 tol_convivencia_or_crusade_desc: "Toledo has lived beside Muslims and Jews for centuries, inside its walls and across its borders. Now the cities to the south are ruled by Muslim kings, and Toledo has to decide whether to live beside them or march against them."

 # ---- The Southern Question
 tol_terms_with_the_south_title: "Terms with the South"
 tol_terms_with_the_south_desc: "Whatever road we chose, the south has to be dealt with. If we chose the crusade, we need the knights of the orders mounted and ready. If we chose to live alongside them, we need the Muslim courts to trust us, or to answer to us."
 tol_cordoba_title: "Córdoba"
 tol_cordoba_desc: "Córdoba, which its Muslim rulers call Qurtuba, was the city of the caliphs, and its great mosque is the most famous building in the peninsula. Taking it would show the whole south which way the frontier is moving. What we do with the mosque afterwards would show the rest."
 tol_the_southern_cities_title: "The Southern Cities"
 tol_the_southern_cities_desc: "Sevilla and Granada are the great cities of the south. On the crusade they must be taken. On the other road, the Muslims and Jews who live under our rule must find it a good place to live, and our realm must be steady enough to keep it so."
 tol_the_last_frontier_title: "The Last Frontier"
 tol_the_last_frontier_desc: "When no Muslim king rules anywhere in the peninsula, the frontier Toledo has guarded for so long will finally be closed. How it was closed, by the sword or by treaty and patience, will decide what kind of realm comes after."

 # ---- Mission tooltips
 tol_crown_of_castile_name_tt: "Our realm will be known as §YCastile§!."
 tol_betrayal_opinions_tt: "Every Muslim country holding land in §YIberia§! is now seen by us as a betrayer of the Reconquista (§R-50§! opinion), and holds us in contempt in turn (§R-25§! opinion)."
 tol_castile_claims_tt: "Gain permanent claims on every province of §YCastile§!, §YBurgos§! and §YPalencia§! we don't own."
 tol_leon_claims_tt: "Gain permanent claims on every province of §YLeón§! we don't own."
 tol_castile_gone_tt: "§YCastile§! no longer exists as a separate realm"
 tol_aragonese_match_tt: "Has a royal marriage with §YAragon§!, §YValencia§! or §YCatalonia§!, or owns §YValència§!, or none of the three still exists"
 tol_no_muslim_rule_tt: "No province in §YIberia§! is owned by a Muslim country"
 tol_form_spain_tt: "We form §YSpain§! now, without the administrative technology its decision asks for. The rest of the §YToledo§! missions are replaced by Spain's."
 tol_spain_not_formed_tt: "§YSpain§! has not been formed by anyone else"
 tol_choice_not_made_tt: "Has chosen between §YConvivencia§! and §YCrusade§!"
 tol_two_muslim_friends_tt: "At least §Y2§! of Sevilla, Algeciras, Alentejo, Granada and Andalusia are Muslim and are our subjects or have at least §Y50§! opinion of us, or we own at least §Y3§! Muslim provinces in §YIberia§!"
 tol_frontier_truce_tt: "Every Muslim neighbour ruling from §YIberia§! and we gain §G+30§! opinion of each other."
 tol_four_peaceful_provinces_tt: "Owns at least §Y4§! provinces that are not Christian and have no unrest"

 # ---- Events
 tol_events.1.t: "The Southern Frontier"
 tol_events.1.d: "Within living memory the Crown of Castile broke apart in a single season, and no one in Toledo can say why. The kings are gone, Valladolid and León go their own way, and Toledo stands alone on the frontier. To the south, Sevilla, Córdoba and the Algarve answer to Muslim kings who call themselves taifas. The preachers of Toledo have a name for that: a betrayal of the Reconquista and of everything the frontier was ever held for. The council agrees that something must be done. It does not agree on what."
 tol_events.1.a: "Swear to win them back"
 tol_events.1.b: "Look to the walls first"
 tol_events.2.t: "Convivencia or Crusade"
 tol_events.2.d: "The archbishop wants a crusade. The knights of the orders want it too, and so do the frontier lords who have lost cattle to raiders from the south. The merchants of the city want peace and the southern markets. The translators and the Jewish quarter point out that Toledo has prospered most when Christians, Muslims and Jews lived side by side. It is time to choose a road."
 tol_events.2.a: "Crusade"
 tol_events.2.a.tt: "We take the road of the §YCrusade§!: conquer the south and bring it back to the faith."
 tol_events.2.b: "Convivencia"
 tol_events.2.b.tt: "We take the road of §YConvivencia§!: bring the south under our rule, but leave its people as they are."
 tol_events.3.t: "The Forges of Toledo"
 tol_events.3.d: "The new workshops by the Tagus produce more blades in a month than the old forges did in a year. Genoese and Portuguese buyers are asking for whole cargoes. Our captains would rather keep the best steel for our own men."
 tol_events.3.a: "Sell the blades"
 tol_events.3.b: "Arm the city"
 tol_events.4.t: "The School of Translators"
 tol_events.4.d: "The school has a home and patrons again, and the scholars are arguing over where to begin. The astronomers want to finish their tables of the stars. The physicians and jurists want the Arabic books on medicine and law, which they say would do more good for the realm."
 tol_events.4.a: "The astronomers"
 tol_events.4.b: "The physicians and jurists"
 tol_events.5.t: "The Primate of Toledo"
 tol_events.5.d: "The new cathedral is consecrated and the archbishop has used the occasion to remind everyone that he is primate of all the Spains. He wants a voice in the council and a share of the frontier tithes. Our ministers want him kept to his church."
 tol_events.5.a: "Back the archbishop"
 tol_events.5.b: "Keep the see in its place"
 tol_events.6.t: "Calatrava"
 tol_events.6.d: "The master of Calatrava has ridden to Toledo with an offer. His knights will hold the castles of La Mancha against the south if the crown grants the order the lands around them. Our council would rather keep the castles in royal hands."
 tol_events.6.a: "Grant the order its lands"
 tol_events.6.b: "The castles belong to the crown"
 tol_events.7.t: "The Crown of Castile"
 tol_events.7.d: "Old Castile answers to Toledo, and no one else can claim the crown. The council has agreed that the crown of Castile should pass to [Root.Monarch.GetName]. Only the ceremony remains to be decided: a coronation by the primate in the cathedral, or an acclamation before the cortes as the old kings had."
 tol_events.7.a: "Crowned in the cathedral"
 tol_events.7.b: "Acclaimed before the cortes"
 tol_events.8.t: "Córdoba"
 tol_events.8.d: "Córdoba has fallen. Our knights rode through the gates under the banners of the orders, and the archbishop has asked for the great mosque to be consecrated as a cathedral at once. Some of our captains, looking at the forest of arches inside, think it would be a shame to change anything."
 tol_events.8.a: "Consecrate the mosque"
 tol_events.8.b: "Leave it standing as it is"
 tol_events.9.t: "The Frontier Treaties"
 tol_events.9.d: "Envoys from the southern courts have come to Toledo to settle the frontier. They offer a truce between the garrisons and the return of captives. In return they want our markets opened to their merchants, or hostages from good families as a guarantee."
 tol_events.9.a: "Open the frontier markets"
 tol_events.9.b: "Exchange hostages"
 tol_events.10.t: "The Zealots of Toledo"
 tol_events.10.d: "A preacher has drawn crowds in the cathedral square, calling our treaties with the south a second betrayal and demanding a crusade. The clergy are listening, and so are the young knights. Our ministers want him silenced before the city does something we cannot undo."
 tol_events.10.a: "Silence him"
 tol_events.10.b: "Let them preach a crusade"
 tol_events.11.t: "Raiders from the South"
 tol_events.11.d: "Riders from across the southern border have burned farms and driven off cattle near the frontier. The lords of the marches want to ride after them at once. Our captains say it would be wiser to build more watchtowers and hold the line."
 tol_events.11.a: "Ride after them"
 tol_events.11.b: "Strengthen the line"
 tol_events.12.t: "Hispania"
 tol_events.12.d: "From Barcelona to the Ocean, from Salamanca to Granada, the peninsula answers to us, and no Muslim king rules anywhere in it. [Root.Monarch.GetName] has been proclaimed in the cathedral of Toledo as ruler of all the Spains. The council now asks where the court of the new realm should sit: in Toledo, the old royal city on its rock, or in Madrid, on the open plain at the centre of the peninsula."
 tol_events.12.a: "Toledo remains the seat of the crown"
 tol_events.12.b: "The court moves to Madrid"
 tol_events.12.b.tt: "If we own §YMadrid§! as a core, it becomes our capital and gains §G+1§! base tax and §G+1§! base production."

