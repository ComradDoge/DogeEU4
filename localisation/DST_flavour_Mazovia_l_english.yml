 maz_the_mazovian_election_title: "The Mazovian Election"
 maz_the_mazovian_election_desc: "Once before, at Piotrkow, the lords of the Crown chose a duke of Mazovia as king and then let the offer lapse. Since then no house has bled more in the Crown's wars or come to hold more of its land. If the succession falls into doubt, the Sejm at Wola, outside Warszawa, will turn to us. The Crown and its lands would pass to Warszawa, and at the Coronation Sejm our blood for the Crown would buy one privilege per issue. Blood not spent on fiefs is kept for that day."
 maz_election_sworn_tt: "We are sworn to the Crown and have kept the oath."
 maz_election_crown_ai_tt: "The Crown is not ruled by a player."
 maz_election_crown_peace_tt: "The Crown is at peace."
 maz_election_opinion_tt: "The Crown has an opinion of at least §G150§! of us."
 maz_senators_opinion_tt: "The Crown has an opinion of at least §G190§! of us."
 maz_election_crisis_tt: "The Crown has a §Yregency§! or §Yno heir§!."
 maz_election_half_tt: "Our development is at least §Yhalf§! of the Crown's.\n§gChecked every month.§!"
 maz_election_reward_tt: "The Sejm meets at Wola to elect a king: §YThe Mazovian Election§!."
 maz_election_tt: "We become king of the Crown:\n     We take its lands, its subjects and its name\n     §YLithuania§! stays in union with us if it was in union with the Crown\n     §YWarszawa§! stays our capital\n     §YSworn at Piotrkow§! ends, §YSenators of the Crown§! stays\n\nThen the §YCoronation Sejm§! opens, where our blood for the Crown buys one privilege per issue."
 maz_events.20.t: "The Mazovian Election"
 maz_events.20.d: "With the succession in doubt, the lords of the Crown have gathered on the field at Wola, outside Warszawa, to elect a king. Once before, at Piotrkow, they chose a duke of Mazovia and then let the offer lapse. Since then our house has fought in every war of the Crown and come to hold more of its land than any magnate. The senators put forward [Root.Monarch.GetName], the nobles agree, and the Primate declares the election."
 maz_events.20.a: "The crown comes to Warszawa."
