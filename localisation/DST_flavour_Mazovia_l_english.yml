 maz_sworn_duchy_title_plural: "Sworn Duchies"
 maz_sworn_duchy_is_our: "$NAME|Y$ is our Sworn Duchy."
 maz_sworn_duchy_long_desc: "A Sworn Duchy behaves like a Vassal, but may declare its own wars on independent countries and on other overlords' subjects. It may never attack the other subjects of its overlord.\n"
