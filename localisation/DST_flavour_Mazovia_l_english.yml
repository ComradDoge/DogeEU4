 # Privilege and mercenaries
 dse_estate_nobles_maz_mazovian_law: "Mazovian Law"
 dse_estate_nobles_maz_mazovian_law_desc: "The petty nobility of Mazovia keeps its own law, apart from the Crown's: its own courts, its own inheritance customs and its own levy. In return, every noble village rides when the duke calls."
