 # Events
 maz_events.1.t: "The Piotrkow Offer"
 maz_events.1.d: "Since Varna the Polish throne has stood empty. Kazimierz the Jagiellon, who rules in Lithuania, has kept the lords waiting for an answer, and some of them have lost patience. At Piotrkow, near Lodz, they have let it be known that if he will not come, they will elect the duke of Mazovia, whose ancestors were kings of Poland long before the Jagiellons. [Root.Monarch.GetName] can send word that Mazovia will not stand against the rightful heir, or let the lords believe that the offer is accepted."
 maz_events.1.a: "Kneel to the Jagiellon."
 maz_events.1.b: "Take the lords at their word."
 maz_events.2.t: "Fiefs of the Crown"
 maz_events.2.d: "Our banners have served in the royal army, and the king's chancellor has written to [Root.Monarch.GetName] with the Crown's thanks. The letter offers a choice. The king can grant us one of the royal lands bordering Mazovia, Leczyca to the west or Dobrzyn across the Vistula, or settle the debt in coin."
 maz_events.2.a: "The land of Leczyca."
 maz_events.2.b: "The land of Dobrzyn."
 maz_events.2.c: "A purse from the royal treasury."
