 # Events
 maz_events.1.t: "The Piotrkow Offer"
 maz_events.1.d: "Since Varna the Polish throne has stood empty. Kazimierz the Jagiellon, who rules in Lithuania, has kept the lords waiting for an answer, and some of them have lost patience. At Piotrkow in Sieradz, where the realm's assemblies meet, they have let it be known that if he will not come, they will elect the duke of Mazovia, whose ancestors were kings of Poland long before the Jagiellons. [Root.Monarch.GetName] can send word that Mazovia will not stand against the rightful heir, or let the lords believe that the offer is accepted."
 maz_events.1.a: "Kneel to the Jagiellon."
 maz_events.1.b: "Take the lords at their word."
 maz_events.10.t: "The Treasurer's Clerk"
 maz_events.10.d: "A clerk of the Crown Treasurer has come up from Krakow with a chest of ledgers and a letter that opens our muster rolls to him. He compares them with the reports of the Crown's captains, walks the churchyards of Warszawa, and asks politely why so many of our fallen were last seen drilling outside Plock. Somebody will have to answer him before he writes his report."
 maz_events.10.a: "Make sure his ledger goes missing."
 maz_events.10.b: "Hang a quartermaster for the mistake."
 maz_events.10.c: "Swear to the rolls on our oath."
 maz_events.11.t: "Widows at Krakow"
 maz_events.11.d: "A dozen women from the villages around Rawa have gone to Krakow and stood outside the Crown Treasurer's door with copies of our muster rolls. Each finds her husband's name there, entered as fallen in the Crown's wars, and each asks for the wages the Crown still owes him. The husbands are at home, ploughing. So far the clerks have only written down the women's names."
 maz_events.11.a: "Pay them from our own coffers."
 maz_events.11.b: "Let Krakow pay: the petitions prove our losses."
 maz_events.11.c: "Strike the husbands from the rolls."
 maz_events.12.t: "Fallen at Grunwald"
 maz_events.12.d: "The petty nobles of Mazovia have heard that blood spilled for the Crown is counted at Krakow, and suddenly every noble village has an ancestor who fell at Grunwald. That was the great battle of 1410 against the Teutonic Order, fought in the fields south of Osterode, where the Mazovian banners rode beside the king's. The nobles want their dead entered in the Crown's rolls, and their families' standing raised with them. Judging by the claims, Mazovia lost more men that day than it had."
 maz_events.12.a: "Enter them all."
 maz_events.12.b: "Only the names in the parish books."
 maz_events.12.c: "Sell them letters of service instead."
 maz_events.13.t: "Chronicler of Krakow"
 maz_events.13.d_dlugosz: "Jan Dlugosz, a canon of Krakow, is writing a history of the whole realm from its first kings to his own day. He has written to Warszawa asking how Mazovia served the Crown in its recent wars, and what names and numbers we can swear to. Whatever we send him will be copied into his Annals, and the Treasurer's clerks read those too."
 maz_events.13.d: "A canon of Krakow is writing a history of the realm, and he has written to Warszawa asking how Mazovia served the Crown in its recent wars, and what names and numbers we can swear to. Whatever we send him will be copied into his book, and the Treasurer's clerks read that too."
 maz_events.13.a: "Send him honest accounts."
 maz_events.13.b: "Pay him to write us larger."
 maz_events.14.t: "Ice on the Vistula"
 maz_events.14.d: "To keep the levies sharp through the winter, our captains marched a company onto the frozen Vistula below Warszawa to practise crossing a river under fire. The ice held for the first rank and not for the rest. Fishermen at Plock are still finding them. Their families want them buried, and the captains want to know what to write in the rolls."
 maz_events.14.a: "Report them as fallen in the Crown's service."
 maz_events.14.b: "Bury them with honours, and drill on land from now on."
 maz_events.97.t: "Fiefs of the Crown"
 maz_events.97.d: "The prices of the Crown's fiefs are worked out again."
 maz_events.97.a: "Very well."
 maz_events.98.t: "Blood for the Crown"
 maz_events.98.d: "Our losses in the Crown's wars are counted."
 maz_events.98.a: "OK"
