 maz_events.99.d: "Blood spilled for the Crown: §Y[Root.maz_crown_blood.GetValue]§!\nArmy size: §Y[Root.maz_dev_army_size.GetValue]§!\n\n§gFiefs of the Crown needs §Y10000§g.\n     prices update after every change\n     every option except the last re-opens this event§!"
