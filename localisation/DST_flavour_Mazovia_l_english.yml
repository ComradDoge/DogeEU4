l_english:
 # Mazovia on the vanilla map (MAZ as the Crown's vassal): missions/_DST_Mazovia_Missions.txt, events/_DSE_flavour_Mazovia.txt
 # Missions
 maz_warszawa_market_title: "Warszawa Market"
 maz_warszawa_market_desc: "The dukes of Mazovia have kept their court at Warszawa since 1413, and the town has grown around the castle on the Vistula bank. Its merchants want a market hall and a fair of their own, so that the grain and timber floating down the river are bought and sold here and not further down in Danzig."
 maz_grain_to_danzig_title: "Grain to Danzig"
 maz_grain_to_danzig_desc: "Every spring the barges leave Plock and Warszawa loaded with rye and float down the Vistula to Danzig, where Dutch and Hanseatic ships wait for them. More grain lands along the river and a firm hold on the Krakow trade would make the river pay for the whole duchy."
 maz_vistula_staple_title: "Vistula Staple"
 maz_vistula_staple_desc: "Grain that passes Warszawa without stopping makes money for others. A staple, forcing the barges to unload and offer their cargo in the town, or enough of the Krakow trade in our hands that they stop here anyway, would turn Warszawa from a ducal seat into a merchant city."
 maz_seat_of_sejms_title: "Seat of Sejms"
 maz_seat_of_sejms_desc: "Warszawa lies between Greater Poland, Lesser Poland and Lithuania, and is closer to all of them than Krakow is. A capital with workshops and a court of its own would be the natural meeting place for the lords of the whole realm, and the Sejms that now gather at Piotrkow, near Lodz, could one day meet here."
 maz_the_piotrkow_offer_title: "Piotrkow Offer"
 maz_the_piotrkow_offer_desc: "King Wladyslaw fell at Varna in November 1444, and Poland has had no crowned king since. His brother Kazimierz rules Lithuania and keeps the Polish lords waiting. Some of them, meeting at Piotrkow, near Lodz, have begun to say that the duke of Mazovia is of an older royal line and could be elected instead. Before we answer, we need friends at the Crown's court."
 maz_oath_at_piotrkow_title: "Oath at Piotrkow"
 maz_oath_at_piotrkow_desc: "We stood aside and let the lords crown the Jagiellon. Now the oath must mean something: a duke who keeps faith, asks for nothing out of turn and sends his men when called will find the royal council willing to listen to him."
 maz_fiefs_of_the_crown_title: "Fiefs of the Crown"
 maz_fiefs_of_the_crown_desc: "The Crown rewards those who bleed for it. If our banners ride with the royal army against the Order or Lithuania, the king may grant us one of his own lands, Leczyca or Dobrzyn, as his predecessors once granted Belz."
 maz_senators_of_the_crown_title: "Senators of the Crown"
 maz_senators_of_the_crown_desc: "A generation of loyal service has made the dukes of Mazovia part of the Crown's own council. Our palatines sit in the Senate beside the bishops and the great lords, and the realm's law and coin are shaped with our voice in the room."
 maz_a_mazovian_king_title: "A Mazovian King"
 maz_a_mazovian_king_desc: "The lords at Piotrkow offered us the crown, and the Jagiellon took it anyway. Our claim is still good, but no duke of Mazovia can take it alone. A foreign power willing to back our independence against Krakow, or a court and nobility no longer willing to bow, is where the road to the throne begins."
 maz_break_with_krakow_title: "Break with Krakow"
 maz_break_with_krakow_desc: "As long as we owe homage to Krakow, our claim is only a story told at our own court. Mazovia must stand free of the Crown before it can contest it."
 maz_crown_to_warszawa_title: "Crown to Warszawa"
 maz_crown_to_warszawa_desc: "Krakow, where the kings are crowned, and Gniezno, where the first of them was, are in our hands, and the Jagiellon has no crown left to defend. What the lords offered in 1446 can now be taken: one realm again, ruled from Warszawa."
 maz_crown_path_unknown_1_title: "Branching Mission"
 maz_crown_path_unknown_1_desc: "This mission is a §YBranching Mission§!. Its triggers and rewards depend on the choice we make in '§YPiotrkow Offer§!'."
 maz_crown_path_unknown_2_title: "Branching Mission"
 maz_crown_path_unknown_2_desc: "This mission is a §YBranching Mission§!. Its triggers and rewards depend on the choice we make in '§YPiotrkow Offer§!'."
 maz_crown_path_unknown_3_title: "Branching Mission"
 maz_crown_path_unknown_3_desc: "This mission is a §YBranching Mission§!. Its triggers and rewards depend on the choice we make in '§YPiotrkow Offer§!'."
 maz_villages_of_nobles_title: "Villages of Nobles"
 maz_villages_of_nobles_desc: "No land in Poland has as many nobles as Mazovia. Whole villages are noble, and many of their families own little more than a horse, a sabre and a coat of arms. Called to the banner, they make a cavalry host far larger than the duchy's size suggests, and in return they want their own law kept."
 maz_mazovian_statutes_title: "Mazovian Statutes"
 maz_mazovian_statutes_desc: "Mazovia keeps its own law, distinct from the Crown's, and the duke's statutes on it are scattered over a century of charters. With the nobles' rights confirmed and a proper court at Warszawa, the law could be gathered into one code, and the land court at Plock would have something firm to judge by."
 maz_mazovian_banners_title: "Mazovian Banners"
 maz_mazovian_banners_desc: "The petty nobles of Mazovia ride to war under the banners of their lands, each family in its own colours. Trained and led as a single host, after the wars on the Prussian border, they could serve any lord who pays them."
 maz_wizna_ramparts_title: "Wizna Ramparts"
 maz_wizna_ramparts_desc: "Wizna guards the crossing of the Narew, where the roads from Prussia and Lithuania meet the Mazovian border. Its earthen ramparts are old, and the garrison is only as strong as the army behind it. A full army in the field would let us man the border properly and look across it."
 maz_drohiczyn_title: "Drohiczyn"
 maz_drohiczyn_desc: "Drohiczyn, the chief town of Podlasia, has changed hands between Mazovia, Lithuania and the Order more than once. The Lithuanians hold it now. Taken, held for the Crown, or settled by a firm friendship with the Grand Duke, it would end a quarrel older than any of us."
 maz_the_orders_border_title: "Order's Border"
 maz_the_orders_border_desc: "South of the Prussian lakes lie the Order's woodland commanderies of Osterode and Ortelsburg, thinly peopled and close to our border. Mazovian peasants already cross to clear land there. If the Order loses its grip on them, the woods could become Mazovian in all but name."
 maz_belz_fief_title: "Belz Fief"
 maz_belz_fief_desc: "Belz came to the dukes of Mazovia in 1388, a royal grant in Red Ruthenia among Ruthenian villages and Orthodox churches. The Crown has never forgotten that it gave Belz and can take it back. Governed as part of the realm proper, with its own officials and a Ruthenian nobility that counts itself ours, the fief would be hard to reclaim."
 maz_chelm_and_belz_title: "Chelm and Belz"
 maz_chelm_and_belz_desc: "Belz and Chelm are two of the old Cherven Towns that Poles and Ruthenians have fought over for five centuries. With Chelm held by us or the Crown, and Belz run by our own officials instead of its local lords, the fief would become part of Mazovia in fact."
