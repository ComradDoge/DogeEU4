l_english:
 skj_marko_inheritance_title:0 "@SKJ Kraljevic Marko"
 skj_marko_inheritance_desc:0 "King Vukasin fell at the Battle of the Marica in 1371, and the old Serbian Empire fell with him. His son Marko kept only a small town south of Skopje and a Sultan's leave to keep it, and the empire has since broken into far more crowns than that. The peasants sing of Marko as though he still rides free."
 skj_marko_legend:0 "Marko's Legend"

 dse_flavour_skopje.1.t:0 "Marko's Legacy"
 dse_flavour_skopje.1.d:0 "The court proclaims that the blood of King Vukasin and the legend of his son Marko give Skopje the right to rule what is left of Emperor Dusan's Serbian Empire. It is worth noting, quietly, that Marko himself paid tribute to the Ottoman Sultan until the day he died - the songs simply never mention it."
 dse_flavour_skopje.1.a:0 "Let the songs speak for us"
 dse_flavour_skopje.1.b:0 "Rule as Vukasin did, without illusions"

 dse_flavour_skopje.2.t:0 "Pec or Ohrid"
 dse_flavour_skopje.2.d:0 "When Emperor Dusan crowned himself in 1346, he raised the Serbian church to a Patriarchate seated at Pec, in the lands around Kosovo, and stripped half the sees of the older Archbishopric of Ohrid to fill it, Skopje's own bishopric among them. The Patriarchate has not forgotten the Empire that made it; Ohrid, in the same lands as Skopje, has not forgiven the Empire that robbed it. Both now write to Skopje asking which allegiance the crown intends to keep."
 dse_flavour_skopje.2.a:0 "Stand with the Patriarchate at Pec"
 dse_flavour_skopje.2.b:0 "Stand with Ohrid, the older archbishopric"

 dse_flavour_skopje.3.t:0 "The Other Heir"
 dse_flavour_skopje.3.d:0 "Macedonia's court to the south styles itself heir to the same fallen Empire Skopje claims, down to the double-headed eagle and the old imperial title of Tsar. Two courts cannot both be Dusan's heir without one of them being wrong, and neither seems willing to say which."
 dse_flavour_skopje.3.a:0 "Press our claim"
 dse_flavour_skopje.3.b:0 "There is room enough for two heirs"

 dse_flavour_skopje.4.t:0 "The Monastery of Saint Andrew"
 dse_flavour_skopje.4.d:0 "In a gorge on the Treska river, half a day's ride west of Skopje, stands the monastery of Saint Andrew. King Vukasin's sons Marko and Andrijaš raised it after their father's death, and Marko, the same Marko the peasants sing of, is painted on its walls among the patrons. The roof lets in rain now, and the abbot has written to ask which house counts itself Vukasin's heir and will maintain the foundation."
 dse_flavour_skopje.4.a:0 "Restore it as a dynastic foundation"
 dse_flavour_skopje.4.b:0 "Fortify it as a refuge for the gorge road"
 skj_bards_of_prilep:0 "Bards of Marko"
 desc_skj_bards_of_prilep:0 "Singers carry Marko's legend to every court."
 skj_sober_court:0 "Sober Court"
 desc_skj_sober_court:0 "Vukasin's line rules without illusions, and keeps its ledgers honest."
 skj_patriarchate_ally:0 "Ally of the Patriarchate"
 desc_skj_patriarchate_ally:0 "The Patriarchate of Pec stands behind the crown."
 skj_ohrid_autocephaly:0 "Ohrid's Privileges"
 desc_skj_ohrid_autocephaly:0 "Ohrid keeps its old privileges, and its clergy keep the peace."
 skj_elder_claim:0 "Claim to Dusan's Empire"
 desc_skj_elder_claim:0 "Skopje presses its claim to Dusan's empire, and makes enemies doing it."
 skj_two_heirs:0 "Two Heirs, One Empire"
 desc_skj_two_heirs:0 "Skopje and Macedonia keep a cold peace as co-claimants."
 skj_treska_monastery:0 "Monastery of Saint Andrew"
 desc_skj_treska_monastery:0 "The monastery of Saint Andrew near Skopje is restored and its scriptorium busy, drawing pilgrims."
 skj_gorge_refuge:0 "Gorge Refuge"
 desc_skj_gorge_refuge:0 "The monastery doubles as a fortified refuge, and its roads are watched."
 desc_skj_marko_legend:0 "The songs of Marko's legend give the court a right to rule that no treaty can."
