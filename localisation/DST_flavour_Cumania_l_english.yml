 # ---- The Clans
 cum_council_of_the_clans_title: "The Council of the Clans"
 cum_council_of_the_clans_desc: "Whatever the court decided, it decided it without most of the clans. The elders of the old seats want a council of their own, where every clan sends its chief and every grievance gets a hearing. Their riders also remember the Nagykunság east of Szolnok, which Hungarian lords now graze, as Cuman land."
 cum_the_halas_seat_title: "The Halas Seat"
 cum_the_halas_seat_desc: "Halas, in the Kiskunság of Bacs, has been the seat of a Cuman clan captain since the Hungarian kings first gave the clans their own courts. It is still where the southern clans bring their quarrels over pasture and water. A market or a workshop there, or simply more people, would make the seat worth its name again."
 cum_the_nagykunsag_title: "The Nagykunság"
 cum_the_nagykunsag_desc: "East of Szolnok, along the Tisza, lies the Nagykunság, the greater Cuman land. Its clans have answered to Hungarian lords for generations, but they still count their descent from the riders who came with Köten. Bring Szolnok under our banner, or bring Hungary to heel, and they will answer to us."
 cum_what_broke_the_world_title: "What Broke the World"
 cum_what_broke_the_world_desc: "Every hearth in the realm has its own story of the breaking. The kams say one thing, the priests in our towns say another, and the old riders say nothing at all. When the realm is settled enough to listen, the court will have to decide which story it tells."
 cum_the_clans_answer_title: "The Clans Answer"
 cum_the_clans_answer_desc: "With Bacs in our hands, Szolnok held and the Banat secured, the clans can no longer say we are too weak to matter. The council of the clans will meet one last time to give its answer. How it answers depends on how we have treated them."

 # ---- The Banat
 cum_the_white_city_title: "The White City"
 cum_the_white_city_desc: "Belgrade sits on the rock where the Sava meets the Danube. The Hungarian name, Nándorfehérvár, and the Serbian Beograd both name it for its white walls. Whoever holds it controls the river road between Buda and the Black Sea. The walls need work, and the town needs people."
 cum_syrmian_vineyards_title: "The Syrmian Vineyards"
 cum_syrmian_vineyards_desc: "The hills of the Fruska Gora, above Mitrovica in Syrmia, have carried vineyards since Roman times. Syrmian wine sells well upriver, and the monasteries on the hills know how to make it. A little investment would turn a grain province into something richer."
 cum_temesvar_title: "Temesvár"
 cum_temesvar_desc: "Temesvár, in Temes, stands in the marshes of the Bega. Its people are Transylvanians and Catholics, and they never chose a Cuman lord. A strong castle, or a town large enough to be worth defending, would settle the matter."
 cum_the_iron_gates_title: "The Iron Gates"
 cum_the_iron_gates_desc: "Below Severin the Danube forces its way through the Carpathians in a gorge called the Iron Gates. Every boat between Belgrade and the Black Sea passes through it. Severin is held by Wallachia. We can take it, or make the Wallachians friends close enough that the river stays open to us."
 cum_the_danube_shield_title: "The Danube Shield"
 cum_the_danube_shield_desc: "Belgrade and Temesvár are the two gates into the Banat. With both fortified, an army in the field and every one of our old provinces firmly ours, the Banat can be held against anyone who comes up the river or down from the hills."

 # ---- Horde: The Raids
 cum_back_in_the_saddle_title: "Back in the Saddle"
 cum_back_in_the_saddle_desc: "The decision is made, and the clans are taking down their tents. A horde is only as strong as its riders, and many of ours have spent their lives behind a plough. Before we ride anywhere we need a real host of horsemen again."
 cum_the_plain_burns_title: "The Plain Burns"
 cum_the_plain_burns_desc: "The Alföld is flat, rich and badly defended. Our grandfathers' grandfathers rode across it every summer, and its lords paid them to stop. Burn a few villages and the lords will remember."
 cum_tribute_from_buda_title: "Tribute from Buda"
 cum_tribute_from_buda_desc: "Two hundred years ago the Hungarian kings paid the Cumans to settle down. Now they can pay us to stay away. A Hungary that sends tribute to our tents, or a Buda in our hands, would prove that the horde is back."
 cum_the_salt_of_turda_title: "The Salt of Turda"
 cum_the_salt_of_turda_desc: "The salt mines at Turda, in Transylvania, have been worked since Roman times, and salt is worth more than gold to anyone who keeps herds. Let the Transylvanians pay us in salt, or let the mines pay us directly."
 cum_the_serbian_tribute_title: "The Serbian Tribute"
 cum_the_serbian_tribute_desc: "South of Belgrade the Serbian lords hold Smederevo and the Morava valley. They are proud, and their mountains are a poor place for horses. They are also rich, and close."
 cum_the_croatian_march_title: "The Croatian March"
 cum_the_croatian_march_desc: "Upriver, beyond Syrmia, the Croatian lords hold Slavonia and the Drava. They are the last obstacle between our riders and the western edge of the plain. Make them pay, or make them afraid."
 cum_envoys_from_the_west_title: "Envoys from the West"
 cum_envoys_from_the_west_desc: "With three realms paying us tribute, the West has noticed. A papal legate and a Hungarian bishop are already on the road to our camp, and they want to talk about our souls."
 cum_the_scourge_of_the_plain_title: "The Scourge of the Plain"
 cum_the_scourge_of_the_plain_desc: "Fifteen burned towns and four tributaries. The chroniclers of the West are already writing about us the way their grandfathers wrote about the Mongols. Let them."

 # ---- Horde: The Ride East
 cum_over_the_carpathians_title: "Over the Carpathians"
 cum_over_the_carpathians_desc: "East of the Iron Gates the passes lead into Wallachia, and beyond Wallachia lies the steppe. Our riders cannot get there without crossing the voivode's lands, so the voivode will pay us, or Târgoviste will be ours."
 cum_the_moldavian_plain_title: "The Moldavian Plain"
 cum_the_moldavian_plain_desc: "North of the Danube mouths, Moldavia stretches from the Carpathians to the Dniester. Its southern edge, the Budjak around Kilia, is already open steppe. Moldavia's prince can send us tribute, or lose his southern pastures."
 cum_kotens_road_title: "Köten's Road"
 cum_kotens_road_desc: "In 1239 the khan Köten led some forty thousand Cuman families west across the Budjak and into Hungary, running ahead of the Mongols. Two centuries later, with Kilia and Bender in our hands, the road runs the other way."
 cum_yedisan_title: "Yedisan"
 cum_yedisan_desc: "Between the Dniester and the Bug lies Yedisan, open grass from the river mouths to the forests. It was Cuman pasture once. The Zaporozhians hold most of it now, and the Crimeans hold Kherson. Take it back."
 cum_the_dnieper_rapids_title: "The Dnieper Rapids"
 cum_the_dnieper_rapids_desc: "Where the Dnieper falls over its rapids, the Zaporozhians have built their Sich. Every army that crosses the steppe from west to east has to cross the river somewhere near them."
 cum_the_crimean_kin_title: "The Crimean Kin"
 cum_the_crimean_kin_desc: "The Tatars of the Crimea speak a Kipchak tongue close enough to ours that our riders can follow their songs. They are the nearest thing we have to kin. We can make them allies, make them subjects, or take Qirq-Yer from them."
 cum_kaffa_title: "Kaffa"
 cum_kaffa_desc: "Kaffa, on the Crimean coast, was built up by the Genoese into the richest port on the northern Black Sea. Slaves, grain, furs and silk pass through its harbour. Whoever holds it taxes the whole steppe's trade with the sea."
 cum_the_great_horde_title: "The Great Horde"
 cum_the_great_horde_desc: "On the lower Don the Great Horde still claims to rule the steppe in the name of Batu's heirs. It was their ancestors who drove ours out of the Desht-i Qipchaq. There is only room for one horde on the steppe."

 # ---- Horde: The Khanate
 cum_the_kurultai_title: "The Kurultai"
 cum_the_kurultai_desc: "A horde is not a kingdom. Its khan rules because the clans raised him on a felt, and they can lower him again. Before the horde goes further, the clans must meet in kurultai and agree on how the khan is chosen."
 cum_horsetail_banners_title: "Horsetail Banners"
 cum_horsetail_banners_desc: "Each clan rides under its own standard of horsetails. A host of twenty banners or more is no longer a raiding party. It is an army that kingdoms have to plan around."
 cum_the_steppe_roads_title: "The Steppe Roads"
 cum_the_steppe_roads_desc: "From the Alföld to the Moldavian plain our lands now stretch further than a rider can cross in a week. Relay stations and fresh horses along the roads would let our messengers, and our armies, move faster than anyone expects."
 cum_the_khans_law_title: "The Khan's Law"
 cum_the_khans_law_desc: "Custom is enough for a raiding band. A khanate needs law: who judges the clans, who divides the plunder, who inherits the pastures. The khan's word must be written down, so the clans can argue about the text instead of starting a feud."
 cum_the_golden_tent_title: "The Golden Tent"
 cum_the_golden_tent_desc: "The great khans of the steppe held court in a golden tent, and visitors measured their power by its size. Our own camp at [Root.Capital.GetName] is ready to become a real ordu, a court that moves with the khan and is never short of guests."
 cum_kipchak_kin_title: "Kipchak Kin"
 cum_kipchak_kin_desc: "The Crimeans, and the Mishary of the Don and the Volga, are what is left of the old Kipchak peoples. Bound to us by alliance or tribute, they would make the horde something larger than the Cumans alone."
 cum_desht_i_qipchaq_title: "Desht-i Qipchaq"
 cum_desht_i_qipchaq_desc: "The Persians called it the Desht-i Qipchaq, the Kipchak steppe: grassland from the Dniester to the Don and beyond. It was ours before the Mongols came. With the Crimea and the steppe in our hands, the khan can take a title to match."

 # ---- Settled: The Crown
 cum_a_house_of_stone_title: "A House of Stone"
 cum_a_house_of_stone_desc: "The court at Nagybecskerek still meets in the felt tents of the old chiefs, pitched every spring in the same field. If we mean to stay, the court needs a hall that does not blow away, and a town around it."
 cum_chiefs_into_lords_title: "Chiefs into Lords"
 cum_chiefs_into_lords_desc: "The clan chiefs ride with their own men and judge their own people. A Hungarian lord would call that nobility; the chiefs call it custom. The difference matters, because one comes with charters and the other does not."
 cum_a_bride_from_the_steppe_title: "A Bride from the Steppe"
 cum_a_bride_from_the_steppe_desc: "Elizabeth the Cuman, a chief's daughter, married Stephen V and was crowned queen of Hungary; her son Ladislaus ruled as the Cuman king. A marriage with a Christian court would remind our neighbours that Cuman blood has worn crowns before."
 cum_the_laws_of_the_realm_title: "The Laws of the Realm"
 cum_the_laws_of_the_realm_desc: "Clan custom, Hungarian county law, Serbian church law and the charters of the towns all apply somewhere in our lands, often in the same village. A realm that wants a crown needs one law above them all."
 cum_the_crown_of_the_cumans_title: "The Crown of the Cumans"
 cum_the_crown_of_the_cumans_desc: "Hungarian kings have called themselves kings of the Cumans for two hundred years without asking the Cumans. With Belgrade, Temesvár and Nagybecskerek firmly ours and the river trade flowing, we can take the title for ourselves, and choose the name the crown will carry."
 cum_the_hungarian_question_title: "The Hungarian Question"
 cum_the_hungarian_question_desc: "Buda still remembers when it ruled us. Whatever is left of Hungary must either become a friend we trust, or stop being able to threaten us."
 cum_the_diet_of_cumania_title: "The Diet of Cumania"
 cum_the_diet_of_cumania_desc: "The chiefs who became lords and the burghers of our towns want a voice in how the realm is run. A diet where both sit together would make taxes easier to collect and quarrels easier to settle."
 cum_a_realm_of_many_peoples_title: "A Realm of Many Peoples"
 cum_a_realm_of_many_peoples_desc: "Cumans are now a minority in their own kingdom. Hungarians, Serbs, Transylvanians and others work the fields and fill the towns. A kingdom that keeps them all at peace is stronger than one that rules by and for the clans."
 cum_the_cuman_crown_title: "The Cuman Crown"
 cum_the_cuman_crown_desc: "A crown worn for a decade is no longer an experiment. With the realm grown large and its name known in every court, the crown of the Cumans can take its place among the old ones."

 # ---- Settled: The Danube
 cum_the_belgrade_market_title: "The Belgrade Market"
 cum_the_belgrade_market_desc: "Ragusan cloth, Hungarian copper and Bulgarian grain all change hands in Belgrade, at the meeting of the Sava and the Danube. A proper market hall would keep the merchants there longer, and their silver with them."
 cum_the_pest_fairs_title: "The Pest Fairs"
 cum_the_pest_fairs_desc: "The great fairs of Pest draw merchants from Vienna, Krakow and Venice. If our own merchants can claim a real share of that trade, our towns will grow faster than any campaign could make them."
 cum_the_ragusan_road_title: "The Ragusan Road"
 cum_the_ragusan_road_desc: "The merchants of Ragusa run a caravan road from the Adriatic through the Balkan mountains to Belgrade. A share of their trade, or Ragusa's friendship, would tie our river to the sea."
 cum_towns_of_the_banat_title: "Towns of the Banat"
 cum_towns_of_the_banat_desc: "Belgrade, Temesvár and Nagybecskerek are the three towns that make the Banat more than a pasture. Each should have the workshops and markets of a real town."
 cum_the_vidin_crossing_title: "The Vidin Crossing"
 cum_the_vidin_crossing_desc: "Downriver from the Iron Gates, Vidin guards the crossing into Bulgaria. Held by us, or by a friend, it opens the lower Danube to our boats."
 cum_the_lower_danube_title: "The Lower Danube"
 cum_the_lower_danube_desc: "Between Giurgiu and Silistria the Danube is wide and slow, and both banks trade with whoever controls the river. Holding both would make the lower Danube ours from bank to bank."
 cum_the_danube_mouths_title: "The Danube Mouths"
 cum_the_danube_mouths_desc: "At Kilia, in Bessarabia, and around Tolcu, the Danube spreads into its delta and meets the Black Sea. Hold the mouths, and every barge from Belgrade can reach the sea without paying anyone else."
 cum_lords_of_the_danube_title: "Lords of the Danube"
 cum_lords_of_the_danube_desc: "From Pest to the delta, our merchants now set the prices. Belgrade has become a centre of trade in its own right. The river that once carried our raiders now carries our wealth."

 # ---- Catholic
 cum_cat_the_friars_of_kalocsa_title: "The Friars of Kalocsa"
 cum_cat_the_friars_of_kalocsa_desc: "The archbishop of Kalocsa, north of Bacs, has sent missions to the Cumans for two hundred years with mixed success. Now that we have taken the Latin cross, he is ready to send more friars than ever. A church at Bacs would give them somewhere to start."
 cum_cat_baptising_the_clans_title: "Baptising the Clans"
 cum_cat_baptising_the_clans_desc: "A Catholic king cannot rule over pagan clans for long without questions from Rome. Every Cuman province must follow the faith of its king."
 cum_cat_the_cuman_laws_title: "The Cuman Laws"
 cum_cat_the_cuman_laws_desc: "In 1279 King Ladislaus, half Cuman himself, issued laws ordering the Cumans to settle in houses, give up their dress and convert. The Cumans rose against him, and in 1290 a few of them murdered him. The laws are still on the books in Buda. We must decide what to do with them."
 cum_cat_a_seat_in_the_curia_title: "A Seat in the Curia"
 cum_cat_a_seat_in_the_curia_desc: "The Pope's court decides which crowns are respected in the West. A Cuman voice in the Curia would make sure ours is one of them."
 cum_cat_the_bulwark_title: "The Bulwark"
 cum_cat_the_bulwark_desc: "Belgrade is the gate of Christendom on the Danube. Strong bastions and a professional army would make the Cumans, once the scourge of the Latins, their shield."
 cum_cat_regnum_cumaniae_title: "Regnum Cumaniae"
 cum_cat_regnum_cumaniae_desc: "For two centuries 'rex Cumaniae' has been one of the titles of the Hungarian kings. A Catholic Cuman king, crowned and ruling Catholic Cuman lands, can claim it for himself."

 # ---- Orthodox
 cum_ort_the_church_of_belgrade_title: "The Church of Belgrade"
 cum_ort_the_church_of_belgrade_desc: "Belgrade's Serbs have kept the Greek rite through every change of ruler. Now their king shares it. A proper church and an endowed clergy would make Belgrade the centre of Orthodoxy north of the Danube."
 cum_ort_the_terter_blood_title: "The Terter Blood"
 cum_ort_the_terter_blood_desc: "In 1280 George Terter, a Cuman lord, took the throne of the Bulgarian tsars at Tarnovo, and his line ruled there for decades. With a Bulgarian marriage, or simply enough prestige, we can say that the Terter claim has passed to us."
 cum_ort_tarnovo_title: "Tarnovo"
 cum_ort_tarnovo_desc: "Tarnovo, on its hills above the Yantra, was the capital of the Bulgarian tsars and the seat of their patriarch. Karvuna holds it now. A Cuman claimant to the Terter throne cannot leave it in another's hands."
 cum_ort_the_patriarchs_blessing_title: "The Patriarch's Blessing"
 cum_ort_the_patriarchs_blessing_desc: "An Orthodox king needs a patriarch's blessing. There are two within reach: the patriarch of Tarnovo, heir of the Bulgarian church, and the patriarch of Pec, in Kosovo, head of the Serbian church. We will have to choose."
 cum_ort_kingdom_of_syrmia_title: "The Kingdom of Syrmia"
 cum_ort_kingdom_of_syrmia_desc: "Stefan Dragutin, a Serbian king who gave up his throne, ruled Syrmia and Belgrade as a kingdom of his own until 1316. With Syrmia ours and Smederevo held, or the Serbs at our feet, his kingdom lives again under a Cuman crown."
 cum_ort_tsars_of_the_danube_title: "Tsars of the Danube"
 cum_ort_tsars_of_the_danube_desc: "Crowned, holding the old Bulgarian heartland and blessed by the church, a Cuman king can rule as the Terters once did, from the Sava to the Black Sea."

 # ---- Bogomil
 cum_bog_the_krstjani_title: "The Krstjani"
 cum_bog_the_krstjani_desc: "The krstjani of the Bosnian Church call themselves simply 'Christians' and their elders the Good Men. They have kept their faith against Rome and Constantinople alike. With our conversion, we are their closest friends in the north."
 cum_bog_league_of_the_good_men_title: "The League of the Good Men"
 cum_bog_league_of_the_good_men_desc: "Bosnia, Zeta and parts of Dalmatia follow the same faith we do. Alone, every one of them can be crushed by a crusade. Together, they cannot."
 cum_bog_the_djed_title: "The Djed"
 cum_bog_the_djed_desc: "The head of the Bosnian Church is called the djed, the grandfather. He rarely leaves the hills, but word has reached him that the Cumans have joined the faith, and he has offered to come north."
 cum_bog_against_the_inquisitors_title: "Against the Inquisitors"
 cum_bog_against_the_inquisitors_desc: "The Catholic lords around us call our faith heresy, and some of them would welcome a crusade. Our army must be large enough that no Catholic neighbour thinks it can win one."
 cum_bog_a_centre_of_the_faith_title: "A Centre of the Faith"
 cum_bog_a_centre_of_the_faith_desc: "The Good Men have always been scattered across Bosnia's valleys. A realm with ten provinces of the faith, or a true centre of it, can give them a home they have never had."
 cum_bog_the_bright_kingdom_title: "The Bright Kingdom"
 cum_bog_the_bright_kingdom_desc: "A crowned king ruling fifteen provinces of the faith has made the Church of the Good Men something it has never been: the faith of a kingdom that does not need anyone's permission to exist."

 # ---- Tengri
 cum_ten_the_kams_title: "The Kams"
 cum_ten_the_kams_desc: "Our kams still read the sky and speak to the spirits, as they did on the steppe. But our towns are full of Christian priests, and the kams want to know where they stand."
 cum_ten_the_codex_title: "The Codex"
 cum_ten_the_codex_desc: "More than a century ago Italian merchants and German friars in the Crimea wrote our tongue down in a book, the Codex Cumanicus, with Latin and Persian beside it. A copy at court would let our scribes, envoys and children learn it properly."
 cum_ten_the_stone_fathers_title: "The Stone Fathers"
 cum_ten_the_stone_fathers_desc: "On the kurgans of the steppe north of the Black Sea, in Yedisan and beyond, our ancestors set stone figures of their dead, each holding a cup in both hands. Some still stand. The kams say we should remember them."
 cum_ten_harmony_title: "Harmony"
 cum_ten_harmony_desc: "Tengri does not ask the other faiths to disappear. A realm of many faiths can keep its own and still live at peace with them, if it chooses well."
 cum_ten_a_sky_over_all_title: "A Sky over All"
 cum_ten_a_sky_over_all_desc: "Christians, Muslims and the followers of Tengri all live under the same sky in our lands. A realm that can keep all of them at peace has something the old kingdoms never managed."
 cum_ten_under_the_blue_sky_title: "Under the Blue Sky"
 cum_ten_under_the_blue_sky_desc: "Crowned, and ruling twenty provinces, the last Tengri kingdom in Europe has proven it can stand among the Christian ones without becoming one of them."

 # ---- Events: the Clans
 dse_flavour_cumania.10.t: "The Council of the Clans"
 dse_flavour_cumania.10.d_horde: "The chiefs have ridden in from every corner of the realm, and they are not all happy. The clans of the old seats around Bacs and Halas have lived in houses for generations, and many of them have no wish to take down their roofs and follow the herds. They ask to keep their seats while the rest of the horde rides."
 dse_flavour_cumania.10.d_settled: "The chiefs have ridden in from every corner of the realm, and they are not all happy. The riders of the Nagykunság and the southern pastures never settled as fully as the town clans, and they fear that a settled kingdom will take away the freedoms the old Hungarian kings left them: their own captains, their own courts, and no taxes but service in the saddle."
 dse_flavour_cumania.10.ha: "Those who stay can keep their seats."
 dse_flavour_cumania.10.hb: "Every clan rides. No exceptions."
 dse_flavour_cumania.10.hc: "Pay them in herds to come along."
 dse_flavour_cumania.10.sa: "Grant the riders their old freedoms."
 dse_flavour_cumania.10.sb: "The clan law yields to the king's law."
 dse_flavour_cumania.10.sc: "Let the elders settle it among themselves."
 dse_flavour_cumania.11.t: "The Captain of Halas"
 dse_flavour_cumania.11.d: "Two clans of the Halas seat in Bacs both claim the summer pastures by the lake. Each has witnesses, each has elders who swear their grandfathers grazed there, and each has started guarding the grass with armed men. The captain of Halas has sent the quarrel to the court."
 dse_flavour_cumania.11.a: "Judge it by clan custom."
 dse_flavour_cumania.11.b: "Judge it by written law."
 dse_flavour_cumania.11.c: "Split the pasture and tax both halves."
 dse_flavour_cumania.12.t: "Riders of the Nagykunság"
 dse_flavour_cumania.12.d: "The riders of the Nagykunság east of Szolnok have sent their chiefs to [Root.Capital.GetName]. They are glad to answer to Cumans again, but they want to know what we will ask of them. Some of our advisers want them settled in villages to hold Szolnok for good. Others want them in the host."
 dse_flavour_cumania.12.a: "Settle the clans around Szolnok."
 dse_flavour_cumania.12.b: "Take them into the host."
 dse_flavour_cumania.12.c: "Leave them to their pastures."
 dse_flavour_cumania.13.t: "What Broke the World"
 dse_flavour_cumania.13.d: "A feast at court ends in an argument. A kam says that Tengri tore the old realms like a tent in a storm, because the kings had forgotten the sky. A priest says the kings sinned and God judged them. An old rider at the end of the table says that nobody knows, and that the people who claim to know are usually selling something. The whole court is now waiting to hear what the ruler thinks."
 dse_flavour_cumania.13.a: "Tengri tore the old realms like a tent in a storm."
 dse_flavour_cumania.13.b: "The old kings sinned, and God judged them."
 dse_flavour_cumania.13.c: "Nobody knows. We go on."
 dse_flavour_cumania.14.t: "The Clans Answer"
 dse_flavour_cumania.14.d_favour: "The council of the clans has met for the last time as a separate body. The chiefs remember that the court listened when it mattered, and they have given their answer in the old way: each chief has struck his standard into the ground before the ruler's tent. The clans are ours."
 dse_flavour_cumania.14.d_grudge: "The council of the clans has met for the last time as a separate body. The chiefs remember every slight, and some of them left before the vote. Those who stayed still give their answer, but it is a grudging one: they will serve, and they will be counting what it costs them."
 dse_flavour_cumania.14.a: "The clans are the realm."
 dse_flavour_cumania.15.t: "The Ispán of Temes"
 dse_flavour_cumania.15.d: "The Catholic Transylvanians of Temes have petitioned for a count of their own, an ispán, as they had under the Hungarian kings. Our Cuman captains in the province say that an ispán would answer to the townsmen, not to us. A third party, a merchant of Temesvár, has quietly offered a large sum for the office."
 dse_flavour_cumania.15.a: "Give Temes a count of its own."
 dse_flavour_cumania.15.b: "Appoint a Cuman captain."
 dse_flavour_cumania.15.c: "Sell the office."

 # ---- Events: the Horde
 dse_flavour_cumania.20.t: "Striking the Tents"
 dse_flavour_cumania.20.d: "The host is gathering, and the towns we leave behind are nervous. The burghers of Belgrade have sent a delegation to ask what the horde means for them. Some of our chiefs say that towns exist to be taxed. Others say towns exist to be emptied."
 dse_flavour_cumania.20.a: "Tax the burghers of Belgrade hard."
 dse_flavour_cumania.20.b: "Leave the towns be."
 dse_flavour_cumania.20.c: "Empty the market before we ride."
 dse_flavour_cumania.21.t: "The Hungarian Tribute"
 dse_flavour_cumania.21.d: "The Hungarian envoys have come to agree terms. They will pay, but they want to know how. Their treasury has gold, their lords have the best horses on the plain, and their king, if it comes to that, has unmarried daughters."
 dse_flavour_cumania.21.a: "Gold."
 dse_flavour_cumania.21.b: "Horses."
 dse_flavour_cumania.21.c: "A bride."
 dse_flavour_cumania.22.t: "Envoys from the West"
 dse_flavour_cumania.22.d: "A papal legate and a Hungarian bishop have reached the khan's camp with an escort of priests. They have come to preach the faith to the Cumans, as their predecessors did two hundred years ago. They are polite, persistent, and very far from home."
 dse_flavour_cumania.22.a: "Hear them out."
 dse_flavour_cumania.22.b: "Send them home with gifts."
 dse_flavour_cumania.22.c: "Keep them, and name a ransom."
 dse_flavour_cumania.23.t: "Köten's Road"
 dse_flavour_cumania.23.d: "Our riders have reached the Budjak around Kilia, where the grass runs flat to the sea. The old men say that Köten led our people west through here in 1239, with the Mongols a few days behind. Two hundred years later, the horde has come back the same way."
 dse_flavour_cumania.23.a: "Raise a kurgan for Köten."
 dse_flavour_cumania.23.b: "Turn the herds loose in the Budjak."
 dse_flavour_cumania.23.c: "Ride on. The steppe is wide."
 dse_flavour_cumania.24.t: "The Same Tongue"
 dse_flavour_cumania.24.d: "The Crimean chiefs who came to meet us brought their own singers, and our riders were surprised to understand most of the songs. The Crimeans speak a Kipchak tongue close to ours. Whatever happened to the world, some things survived it."
 dse_flavour_cumania.24.a: "Feast with them as kin."
 dse_flavour_cumania.24.b: "Take their best riders into our host."
 dse_flavour_cumania.24.c: "Kin or not, they pay like everyone else."
 dse_flavour_cumania.25.t: "The Kurultai"
 dse_flavour_cumania.25.d: "The clans have met in kurultai on the open plain, every chief with his banner. They have agreed to raise the khan on a felt as their ancestors did. What they have not agreed on is how the next khan is chosen: by the seniority of the elder clans, by the khan's own line, or by whoever leads the strongest host."
 dse_flavour_cumania.25.a: "The elder clans speak first."
 dse_flavour_cumania.25.b: "The khan's line, and no other."
 dse_flavour_cumania.25.c: "Whoever leads the strongest host."
 dse_flavour_cumania.26.t: "Khan of the Desht-i Qipchaq"
 dse_flavour_cumania.26.d: "From the Carpathians to the Don, the steppe answers to our khan again. The clans want a name to match: one the chroniclers of the West, the merchants of Kaffa and the Great Horde's old allies will all have to learn."
 dse_flavour_cumania.26.a: "Desht-i Qipchaq."
 dse_flavour_cumania.26.b: "The Kipchak Khanate."
 dse_flavour_cumania.26.c: "The Horde of Köten."
 dse_flavour_cumania.26.keep: "We are the Cuman Horde. That is enough."

 # ---- Events: the Settled Realm
 dse_flavour_cumania.30.t: "A House of Stone"
 dse_flavour_cumania.30.d: "The court is moving out of its tents and into a hall at Nagybecskerek. Three builders have offered their services: a Hungarian master who built churches in Pest, a Serbian builder from Belgrade, and the clans' own craftsmen, who suggest a stone hall with the old felt tents kept in the yard for feasts."
 dse_flavour_cumania.30.a: "The Hungarian master builder."
 dse_flavour_cumania.30.b: "The Serbian builder from Belgrade."
 dse_flavour_cumania.30.c: "A stone hall, and the tents in the yard."
 dse_flavour_cumania.31.t: "Chiefs into Lords"
 dse_flavour_cumania.31.d: "The clan chiefs have come to court to ask what they are now. A Hungarian lord holds his land by charter, passes it to his sons and sits in the diet. A Cuman chief holds his people by custom and leads them by consent. The chiefs want to know which one the crown will recognise."
 dse_flavour_cumania.31.a: "Land charters, as the Hungarian lords hold them."
 dse_flavour_cumania.31.b: "Titles, and nothing more."
 dse_flavour_cumania.31.c: "Keep the clan law beside the royal one."
 dse_flavour_cumania.32.t: "The Crown of the Cumans"
 dse_flavour_cumania.32.d: "The crown has been made and the bishops, kams and chiefs have all taken their places. Before the ceremony, the court must settle one last thing: the name the kingdom will carry."
 dse_flavour_cumania.32.cumania: "Cumania."
 dse_flavour_cumania.32.kunsag: "Kunság."
 dse_flavour_cumania.32.regnum: "Regnum Cumaniae."
 dse_flavour_cumania.32.syrmia: "Syrmia."
 dse_flavour_cumania.32.banat: "Banat."
 dse_flavour_cumania.32.kunorszag: "Kunország."
 dse_flavour_cumania.33.t: "The Ragusan Factors"
 dse_flavour_cumania.33.d: "Merchants from Ragusa have come up the caravan road to Belgrade. They want a house of their own in the town, a warehouse by the river and the right to trade without paying the market tolls. In return they offer Ragusa's connections across the whole Adriatic."
 dse_flavour_cumania.33.a: "Grant them a monopoly."
 dse_flavour_cumania.33.b: "Give them a house, and tax it."
 dse_flavour_cumania.33.c: "Send our own merchants to Ragusa instead."

 # ---- Events: the Faiths
 dse_flavour_cumania.40.t: "The Friars of Kalocsa"
 dse_flavour_cumania.40.d: "The archbishop of Kalocsa has sent a party of Franciscans to Bacs with letters of welcome and a long list of requests. They want to preach in every clan's camp, build chapels at every seat and teach the chiefs' sons Latin. Few of them speak a word of Cuman."
 dse_flavour_cumania.40.a: "Send them to every clan."
 dse_flavour_cumania.40.b: "Let them preach in the towns."
 dse_flavour_cumania.40.c: "Ask for friars who speak our tongue."
 dse_flavour_cumania.41.t: "The Cuman Laws"
 dse_flavour_cumania.41.d: "The archbishop has brought a copy of the Cuman Laws of 1279 to court. They order the Cumans to live in houses, cut their hair, give up their dress and send their children to be baptised. The clans remember how those laws ended last time. The bishops want them enforced."
 dse_flavour_cumania.41.a: "Enforce them."
 dse_flavour_cumania.41.b: "Soften them."
 dse_flavour_cumania.41.c: "Rewrite them in our own favour."
 dse_flavour_cumania.42.t: "The Terter Blood"
 dse_flavour_cumania.42.d: "Our genealogists have traced the line of George Terter, the Cuman lord who became tsar at Tarnovo in 1280, and found that our house shares his blood. The Bulgarian lords do not all agree, but enough of them have listened."
 dse_flavour_cumania.42.a: "Press the claim openly."
 dse_flavour_cumania.42.b: "Court the Bulgarian lords quietly."
 dse_flavour_cumania.42.c: "Remember it, and look to our own lands."
 dse_flavour_cumania.43.t: "The Patriarch's Blessing"
 dse_flavour_cumania.43.d: "Two patriarchs have offered to bless our crown. The patriarch of Tarnovo would make us heirs of the Bulgarian tsars. The patriarch of Pec, in Kosovo, would make us protectors of the Serbian church. Our own bishop at Belgrade quietly suggests that we need neither."
 dse_flavour_cumania.43.a: "The patriarch at Tarnovo."
 dse_flavour_cumania.43.b: "The patriarch at Pec."
 dse_flavour_cumania.43.c: "Our own bishop at Belgrade."
 dse_flavour_cumania.44.t: "The Djed"
 dse_flavour_cumania.44.d: "The djed of the Bosnian Church has come north with a handful of Good Men. He is old and walks with a stick, and he has offered to bless the elders of our own congregations with his own hands, as the Bosnian elders have been blessed for generations."
 dse_flavour_cumania.44.a: "Accept his blessing."
 dse_flavour_cumania.44.b: "Our elders need no Bosnian hands."
 dse_flavour_cumania.44.c: "Invite him to stay in Belgrade."
 dse_flavour_cumania.45.t: "The House of the Good Men"
 dse_flavour_cumania.45.d: "The faith has spread far enough that the Good Men want a house of their own, a place where their elders can meet and teach. Some want it in Belgrade, where everyone will see it. Others say the faith has always been plain and should stay that way."
 dse_flavour_cumania.45.a: "Build it in Belgrade."
 dse_flavour_cumania.45.b: "Keep it plain, as the krstjani do."
 dse_flavour_cumania.45.c: "Send preachers into Hungary."
 dse_flavour_cumania.46.t: "The Sky and the Cross"
 dse_flavour_cumania.46.d: "The kams have come to court to complain. Franciscan friars preach in the market at Bacs, Orthodox priests run every church in Belgrade, and the kams say the people are forgetting the sky. The friars and priests, for their part, have offered to keep the peace if they are left to work."
 dse_flavour_cumania.46.a: "Welcome the friars. The sky is wide."
 dse_flavour_cumania.46.b: "Welcome the priests of Belgrade."
 dse_flavour_cumania.46.c: "The kams alone speak for Tengri."
 dse_flavour_cumania.47.t: "The Stone Fathers"
 dse_flavour_cumania.47.d: "A rider back from the east says that the stone figures still stand on the kurgans of Yedisan, each holding a cup in both hands. The kams want one brought to court. Our stonemasons say they could carve new ones in Torontál. The old riders say the dead should be left where they were buried."
 dse_flavour_cumania.47.a: "Send for one from the Yedisan steppe."
 dse_flavour_cumania.47.b: "Carve new ones in Torontál."
 dse_flavour_cumania.47.c: "Let them stand where they are."

 # ---- Modifiers: the Clans and the Banat
 cum_halas_seat_modifier: "The Halas Seat"
 desc_cum_halas_seat_modifier: "The clan captain of Halas keeps order among the southern clans."
 cum_kun_settlers_modifier: "Kun Settlers"
 desc_cum_kun_settlers_modifier: "Cuman clans have returned to the pastures around Szolnok."
 cum_every_clan_rides_modifier: "Every Clan Rides"
 desc_cum_every_clan_rides_modifier: "No clan was allowed to stay behind, and some of them are still angry about it."
 cum_kun_freedoms_modifier: "Kun Freedoms"
 desc_cum_kun_freedoms_modifier: "The riders keep their own captains and pay their dues in service, not coin."
 cum_written_law_modifier: "Written Law"
 desc_cum_written_law_modifier: "Clan disputes are now settled by written law."
 cum_kun_resettlement_modifier: "Kun Resettlement"
 desc_cum_kun_resettlement_modifier: "Cuman clans have settled around Szolnok, and the Hungarians there resent it."
 cum_kun_riders_modifier: "Riders of the Nagykunság"
 desc_cum_kun_riders_modifier: "The riders of the Nagykunság serve in our host."
 cum_torn_tent_modifier: "The Torn Tent"
 desc_cum_torn_tent_modifier: "Tengri tore the old realms apart. Ours still stands."
 cum_judgement_on_kings_modifier: "Judgement on Kings"
 desc_cum_judgement_on_kings_modifier: "The breaking was God's judgement on sinful kings. We mean to be better ones."
 cum_we_go_on_modifier: "We Go On"
 desc_cum_we_go_on_modifier: "Nobody knows what broke the world, and the realm has stopped waiting for an answer."
 cum_kipchak_clans_modifier: "The Kipchak Clans"
 desc_cum_kipchak_clans_modifier: "Every clan rides under the khan's banner, and gladly."
 cum_kipchak_clans_minor_modifier: "The Reluctant Clans"
 desc_cum_kipchak_clans_minor_modifier: "The clans ride with the horde, but they remember every slight."
 cum_kun_seats_modifier: "The Kun Seats"
 desc_cum_kun_seats_modifier: "The Cuman seats send their riders to the king, and gladly."
 cum_kun_seats_minor_modifier: "The Reluctant Seats"
 desc_cum_kun_seats_minor_modifier: "The Cuman seats serve the crown, but they remember every slight."
 cum_white_city_walls_modifier: "Walls of the White City"
 desc_cum_white_city_walls_modifier: "Belgrade's white walls have been repaired and its town is growing."
 cum_syrmian_vineyards_modifier: "Syrmian Vineyards"
 desc_cum_syrmian_vineyards_modifier: "The vineyards of the Fruska Gora are producing again."
 cum_temes_count_modifier: "Count of Temes"
 desc_cum_temes_count_modifier: "Temes has an ispán of its own, chosen from its own people."
 cum_temes_captain_modifier: "Cuman Captain of Temes"
 desc_cum_temes_captain_modifier: "A Cuman captain rules Temes, and the townsmen are not pleased."
 cum_iron_gates_toll_modifier: "Iron Gates Toll"
 desc_cum_iron_gates_toll_modifier: "Every boat through the Iron Gates pays us."
 cum_banat_march_modifier: "The Banat March"
 desc_cum_banat_march_modifier: "Belgrade and Temesvár guard the Banat against all comers."

 # ---- Modifiers: the Horde
 cum_back_in_the_saddle_modifier: "Back in the Saddle"
 desc_cum_back_in_the_saddle_modifier: "The Cumans are riders again."
 cum_belgrade_squeezed_modifier: "Belgrade Squeezed"
 desc_cum_belgrade_squeezed_modifier: "The burghers of Belgrade pay heavily for the horde's protection."
 cum_free_towns_modifier: "Free Towns"
 desc_cum_free_towns_modifier: "The horde leaves its towns to trade in peace."
 cum_hungarian_horses_modifier: "Hungarian Horses"
 desc_cum_hungarian_horses_modifier: "The best horses of the Hungarian plain now carry our riders."
 cum_serbian_tribute_modifier: "Serbian Tribute"
 desc_cum_serbian_tribute_modifier: "The Serbian lords send their silver to our camp."
 cum_heard_the_legate_modifier: "The Legate Heard"
 desc_cum_heard_the_legate_modifier: "The khan listened to the papal legate, and the West took note."
 cum_scourge_of_the_plain_modifier: "Scourge of the Plain"
 desc_cum_scourge_of_the_plain_modifier: "Our riders know how to empty a town quickly."
 cum_carpathian_passes_modifier: "The Carpathian Passes"
 desc_cum_carpathian_passes_modifier: "Our riders know every pass between the Banat and the steppe."
 cum_budjak_pastures_modifier: "Budjak Pastures"
 desc_cum_budjak_pastures_modifier: "The horde's herds graze the Budjak, as they did before Köten led them west."
 cum_kotens_memory_modifier: "Köten's Kurgan"
 desc_cum_kotens_memory_modifier: "A kurgan stands for Köten in the Budjak."
 cum_budjak_herds_modifier: "Herds of the Budjak"
 desc_cum_budjak_herds_modifier: "The horde's herds have been turned loose in the Budjak."
 cum_wide_steppe_modifier: "The Wide Steppe"
 desc_cum_wide_steppe_modifier: "The horde rides on across the open steppe."
 cum_dnieper_crossing_modifier: "The Dnieper Crossing"
 desc_cum_dnieper_crossing_modifier: "The fords of the Dnieper are ours, and so are the riders who know them."
 cum_kin_feast_modifier: "Kipchak Feast"
 desc_cum_kin_feast_modifier: "We feasted with the Crimeans as kin, and the steppe heard about it."
