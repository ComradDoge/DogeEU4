l_english:

 # Cumania (CUM): missions/_MIS_Cumania_Missions.txt, events/_DSE_flavour_Cumania.txt

 # ---- The path (dse_flavour_cumania.1)
 dse_flavour_cumania.1.t: "The Path of [Root.Monarch.GetName]"
 dse_flavour_cumania.1.d: "The kingdoms around us broke apart, and nobody can say why. Hungary, whose kings settled our clans on the plain two hundred years ago, is now a handful of lordships, and only one of them still calls itself Hungary. The clan elders gathered at [Root.Capital.GetName] are all asking the same question: what are the Cumans now?\n\nSome want the old life back: the herds, the tents and the riding seasons, with every neighbour too weak to stop us. Others have grown used to towns and fields, and the priests of three churches are already at the door."
 dse_flavour_cumania.1.o1: "Back to the horse."
 dse_flavour_cumania.1.o2: "Stay settled and take the Latin cross."
 dse_flavour_cumania.1.o3: "Stay settled and take the Greek cross."
 dse_flavour_cumania.1.o4: "Stay settled and follow the Good Men of Bosnia."
 dse_flavour_cumania.1.o5: "Stay settled, and keep the Sky."
 cum_path_horde_tt: "§YMission tree:§! the horde path. §YThe Raids§!, §YThe Ride East§! and §YThe Khanate§!."
 cum_path_catholic_tt: "§YMission tree:§! the settled path. §YThe Crown§!, §YThe Danube§! and the §YCatholic§! faith column."
 cum_path_orthodox_tt: "§YMission tree:§! the settled path. §YThe Crown§!, §YThe Danube§! and the §YOrthodox§! faith column."
 cum_path_bogomil_tt: "§YMission tree:§! the settled path. §YThe Crown§!, §YThe Danube§! and the §YBogomil§! faith column."
 cum_path_tengri_tt: "§YMission tree:§! the settled path. §YThe Crown§!, §YThe Danube§! and the §YTengri§! faith column."
 cuman_horde_name: "Cuman Horde"
 cuman_horde_name_ADJ: "Cuman Horde"

 # ---- Names
 CUM_DESHT_I_QIPCHAQ: "Desht-i Qipchaq"
 CUM_DESHT_I_QIPCHAQ_ADJ: "Qipchaq"
 CUM_DESHT_I_QIPCHAQ_tt: "§gThe Persian name for the Kipchak steppe: the grasslands from the Dniester to the Don, where the Cumans grazed their herds before the Mongols came.§!"
 CUM_KIPCHAK_KHANATE: "Kipchak Khanate"
 CUM_KIPCHAK_KHANATE_ADJ: "Kipchak"
 CUM_KIPCHAK_KHANATE_tt: "§gCumans and Kipchaks were one confederation of the steppe. The Greeks and Latins called us Cumans; the peoples of the east called us Kipchaks.§!"
 CUM_HORDE_OF_KOTEN: "Horde of Köten"
 CUM_HORDE_OF_KOTEN_ADJ: "Köten"
 CUM_HORDE_OF_KOTEN_tt: "§gKöten was the Cuman khan who led his people west into Hungary in 1239, fleeing the Mongols. The Hungarians murdered him at Pest two years later.§!"
 CUM_KUNSAG: "Kunság"
 CUM_KUNSAG_ADJ: "Kun"
 CUM_KUNSAG_tt: "§gThe Hungarian name for the lands the Cuman clans settled: the Kiskunság in Bacs and the Nagykunság east of Szolnok.§!"
 CUM_REGNUM_CUMANIAE: "Regnum Cumaniae"
 CUM_REGNUM_CUMANIAE_ADJ: "Cumanian"
 CUM_REGNUM_CUMANIAE_tt: "§gLatin for the Kingdom of Cumania. 'Rex Cumaniae' has been among the titles of the Hungarian kings since the 13th century. Now a Cuman wears it.§!"
 CUM_SYRMIA: "Syrmia"
 CUM_SYRMIA_ADJ: "Syrmian"
 CUM_SYRMIA_tt: "§gStefan Dragutin, a Serbian king who gave up his throne, ruled a Kingdom of Syrmia from Belgrade between 1282 and 1316.§!"
 CUM_BANAT: "Banat"
 CUM_BANAT_ADJ: "Banat"
 CUM_BANAT_tt: "§gA banate was a frontier march under a ban. The Hungarian kings kept banates along the lower Danube, at Macsó south of Syrmia and at Severin by the Iron Gates.§!"
 CUM_KUNORSZAG: "Kunország"
 CUM_KUNORSZAG_ADJ: "Kun"
 CUM_KUNORSZAG_tt: "§gHungarian for 'land of the Cumans'.§!"
 cum_name_choice_tt: "We choose the name our realm will carry."

