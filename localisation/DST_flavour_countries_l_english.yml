 dse_flavour_name_switzerland_helvetia_tt: "§gThe Helvetii were the Celtic people of the plateau around Bern when Caesar met them in 58 BC. Humanist scholars revived their name, and Helvetia became the figure of the Confederation in Latin verse and, later, on its coins.§!"
 dse_flavour_name_switzerland_confederatio_tt: "§gThe Latin name of the Confederation. Latin belongs to none of its peoples, German, French or Italian, so none stands above the others. The letters CH come from it.§!"
 dse_flavour_name_switzerland_oath_tt: "§gIn German the Swiss call their state the Eidgenossenschaft, the fellowship of the oath. It remembers the oath of 1291, when three mountain valleys of central Switzerland swore to aid one another against any lord.§!"

