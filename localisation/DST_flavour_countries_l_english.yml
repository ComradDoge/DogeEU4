 dse_flavour_name_sudetenland_chodsko_tt: "§gThe Chods were free peasants of the Domažlice borderland, west of Plzen, who guarded the passes of the Bohemian Forest for the Bohemian kings. In return they answered to no lord but the king, bore arms, and marched under their own banner with a dog's head on it. They kept those privileges until the 17th century, when their leader Jan Sladký Kozina was hanged for defending them.§!"
