 NAME_HIMALAYA_OPTION_6_ADJ: "Chakravartin"
 dse_flavour_name_himalaya_himavat_tt: "§gHimavat, Lord of the Snows, is the Himalaya itself as a king in the Puranas. His daughter Parvati became the wife of Shiva, and the pilgrims of Garhwal and Kumaon still call the mountains by his name.§!"
 dse_flavour_name_himalaya_kailash_tt: "§gMount Kailash rises above Purang in Ngari. Buddhists, Hindus, Jains and Bon followers all hold it sacred, and pilgrims of every faith walk the circuit around it.§!"
 dse_flavour_name_himalaya_devabhumi_tt: "§gDevabhumi, the Land of the Gods, is the old name for the hills of Garhwal and Kumaon, where the shrines of Badrinath and Kedarnath draw pilgrims from all of Hindustan.§!"
 dse_flavour_name_himalaya_shambhala_tt: "§gThe Kalachakra Tantra tells of Shambhala, a hidden kingdom beyond the snow mountains. One day its king will ride out, defeat the enemies of the Dharma and begin a golden age.§!"
 dse_flavour_name_himalaya_olmo_tt: "§gOlmo Lungring is the holy land where Tonpa Shenrab, the founder of Bon, was born. Some Bon masters placed it around Kailash, above Purang.§!"
 dse_flavour_name_himalaya_chakravartin_tt: "§gA Chakravartin, a wheel-turning king, is the universal monarch of both Buddhist and Hindu texts, who rules the whole world justly and in keeping with the Dharma.§!"
