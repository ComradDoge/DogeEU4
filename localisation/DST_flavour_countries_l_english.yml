 NAME_SUDETENLAND_OPTION_10_ADJ: "Borderland"
 dse_flavour_name_sudetenland_landfriede_tt: "§gIn the kingless years after 1440, Bohemia split into regional peace leagues, the Landfrieden. The Landfriede of Plzen gathered the Catholic lords and towns of the west, who had held Plzen against the Hussites.§!"
 dse_flavour_name_sudetenland_sudetenmark_tt: "§gThe Sudetes are the mountains along Bohemia's border with Silesia. A mark is a march, a frontier province held to guard a border.§!"
 dse_flavour_name_sudetenland_ordensstaat_tt: "§gOrdensstaat is the German word for a state ruled by a knightly order, as the Teutonic Order ruled Prussia and the Livonian Order ruled from Riga.§!"

