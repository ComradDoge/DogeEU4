 dse_flavour_name_tibet_chenpo_tt: "§gBod Chenpo, Great Tibet, was the name of the Yarlung kings' empire, which from its capital at Lhasa ruled from Ngari to Kham and beyond before breaking apart in the 9th century.§!"
 dse_flavour_name_tibet_khawachen_tt: "§gKhawachen, the Land of Snows, is how Tibetan poets and monks have long named the high plateau between Ngari in the west and Kham in the east.§!"
 dse_flavour_name_tibet_ganden_tt: "§gThe Ganden Palace stands in Drepung monastery, just west of Lhasa. It was the seat of the Dalai Lamas, and from 1642 its name was that of their government over all Tibet.§!"
 dse_flavour_name_tibet_zhangzhung_tt: "§gZhangzhung was the kingdom of western Tibet around Mount Kailash, near Purang, before the Yarlung kings conquered it. Bon followers remember it as the homeland of their faith.§!"
 dse_flavour_name_tibet_ngari_tt: "§gThe Three Circuits of Ngari: Purang, Guge around Tsaparang, and Maryul, which is Ladakh. The heirs of the old Tibetan kings ruled them after the empire fell.§!"

