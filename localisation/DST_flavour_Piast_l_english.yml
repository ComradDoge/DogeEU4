 kra_akademia_krakowska_modifier: "Krakow Academy"
 desc_kra_akademia_krakowska_modifier: "The Krakow Academy trains the clerks, lawyers and astronomers of the realm."

 # ---- Events
 piast_events.1.t: "The Empty Throne"
 piast_events.1.d: "A generation has passed since the crown of Poland lost its hold. No invader took it. The kingdom came apart from within, as every great realm did in those years, and nobody has found out why. The regalia still lie unused in the Wawel treasury at Krakow. The clergy of Gniezno call the breaking a judgement on the sins of the realm. The burghers of Krakow say the crown was hollow long before it broke. The old lawyers point to the seniorate of 1138, when one duke held primacy over the others."
 piast_events.1.a: "The clergy are right: atone for it"
 piast_events.1.b: "The burghers are right: the crown must pay its way"
 piast_events.1.c: "Revive the seniorate law"
 piast_events.2.t: "A Senior Duke Rises"
 piast_events.2.d: "The ruler of [From.GetName] has taken up the Seniorate, the old primacy of one Piast duke over the others. Their envoys ask us to acknowledge it. Our lords would rather we did not."
 piast_events.2.a: "Acknowledge the primacy of [From.GetName]"
 piast_events.2.b: "Protest the claim"
 piast_events.3.t: "Won by the Sword"
 piast_events.3.d: "The last Senior Duke has lost the war against us and has given up the title. Since we hold a seat of the old crown, the Seniorate passes to us."
 piast_events.3.a: "A Te Deum in the cathedral"
 piast_events.3.b: "Offer the beaten duke a place at our court"
 piast_events.4.t: "The Seniorate Lost"
 piast_events.4.d: "[From.GetName] has beaten us, and we have lost the Seniorate with the war. Unless they hold a seat of the old crown, the title now lies vacant."
 piast_events.4.a: "Bide our time"
 piast_events.4.b: "Swear to take it back"
 piast_events.5.t: "The Seniorate Lapses"
 piast_events.5.d_subject: "Now that we answer to an overlord, the other Piast dukes no longer call us Senior Duke in their letters. The Seniorate is vacant again."
 piast_events.5.d_seat: "We no longer hold Krakow, Gniezno or any other seat of the old crown, and the other Piast dukes no longer accept us as Senior Duke. The title is vacant again."
 piast_events.5.a: "Then we must win it back"
 piast_events.6.t: "The Wiec"
 piast_events.6.d: "Lords, bishops and the envoys of the towns have come to [Root.Capital.GetName] for the wiec, the first a Senior Duke has called in years. The knights want their privileges confirmed, the bishops want to preside, and the towns want a say in how they are taxed. We can only satisfy one of them."
 piast_events.6.a: "Confirm the knights' privileges"
 piast_events.6.b: "Let the bishops preside"
 piast_events.6.c: "Hear the towns"
 piast_events.7.t: "The Coronation"
 piast_events.7.d: "The crown of Boleslaw the Brave has been taken from the Wawel treasury for the first time since the old kingdom broke apart. Bishops, lords and envoys from every corner of Poland wait to see where it will be worn: in Krakow cathedral, where the kings after Lokietek were crowned, or at Gniezno, where the first Piast kings were."
 piast_events.7.a: "In the Wawel, at Krakow"
 piast_events.7.b: "At Gniezno, as the first kings were"
 piast_events.8.t: "A Piast Match"
 piast_events.8.d: "An envoy from [piast_match_target.GetName] has come with a proposal: a marriage between our houses. Both courts claim the Piast name, and the old families of Poland have always married each other when they were not at war."
 piast_events.8.a: "Accept the match"
 piast_events.8.b: "Decline politely"
 piast_events.9.t: "The Seniorate Lapses"
 piast_events.9.d: "Hidden check: the Senior Duke keeps the title only while it holds a seat and stays independent."
 piast_events.9.a: "Check the Seniorate"
 piast_events.10.t: "Won by the Sword"
 piast_events.10.d: "Hidden check: the winner of a war against the Senior Duke takes the title if it holds a seat."
 piast_events.10.a: "Take up the Seniorate"
 piast_events.11.t: "The Primate of Gniezno"
 piast_events.11.d: "The Archbishop of Gniezno has come to our court. He is still called the Primate of Poland, and he means to be one again. He will back our claim to the old crown, but he wants the church's lands and courts left in his hands. Some at court think the price is too high."
 piast_events.11.a: "Accept the Primate's terms"
 piast_events.11.b: "Keep him at arm's length"
 piast_events.12.t: "The Tombs at Plock"
 piast_events.12.d: "Two dukes lie in the cathedral at Plock: Wladyslaw Herman, and his son Boleslaw Wrymouth, whose testament of 1138 divided Poland among his sons and made the eldest Senior Duke. The tombs have been neglected since the kingdom broke. Restoring them, or reading the testament to the lords again, would remind everyone that the Seniorate began here."
 piast_events.12.a: "Restore the tombs"
 piast_events.12.b: "Read the testament aloud to the lords"
 piast_events.13.t: "The Short Duke"
 piast_events.13.d: "Wladyslaw Lokietek was born at Brzesc in Kujawy, a younger son with a small inheritance and no prospects. He was driven out, hid in the caves north of Krakow, came back, and in 1320 was crowned king of a Poland he had put back together himself. Our knights tell the story often these days, and they have started asking when we mean to follow it."
 piast_events.13.a: "Raise the lesser knights"
 piast_events.13.b: "Seek Rome's blessing, as he did"
 piast_events.14.t: "Keepers of the Regalia"
 piast_events.14.d: "The crown of Boleslaw the Brave, the sword Szczerbiec and the rest of the regalia are kept in the Wawel treasury, under the city's keys. The council is divided. Some want the crown shown to the people at Easter, so every duke in Poland remembers where it is kept. Others want the treasury sealed and guarded until someone has earned the right to open it."
 piast_events.14.a: "Show the crown at Easter"
 piast_events.14.b: "Seal the treasury"
 piast_events.15.t: "[From.GetName] Acknowledges Our Primacy"
 piast_events.15.d: "Envoys from [From.GetName] have come to our court and acknowledged us as Senior Duke before the assembled lords. The other dukes will hear of it."
 piast_events.15.a: "A sensible answer"
 piast_fealty_tt: "§YFealty of the Dukes§! rises by one level: §G+10§! Vassalization Acceptance for as long as we hold the §YSeniorate§!."
 piast_events.16.t: "[From.GetName] Protests Our Primacy"
 piast_events.16.d: "The court of [From.GetName] refuses to acknowledge our Seniorate. Envoys with gifts might change their minds. Otherwise we can remind them that we hold the title, and that their border is within our reach."
 piast_events.16.a: "Send envoys with gifts"
 piast_events.16.b: "Remind them who holds the title"

 # ---- Malopolska flavour (piast_events.17 to .20, mpk_* modifiers)
 mpk_seat_of_kings:0 "Seat of Kings"

 piast_events.17.t:0 "The Return to Wawel"
 piast_events.17.d:0 "Kazimierz the Great, the last Piast king, finished rebuilding the cathedral on Wawel hill in Krakow, and he and his father Lokietek lie beneath it. The banners of Checiny fly over Wawel castle now, and for the first time since the old Kingdom broke apart, Mass is said there for a living ruler rather than a dead one."
 piast_events.17.a:0 "Crown ourselves in the old rite"
 piast_events.17.b:0 "Restore the cathedral's endowments first"

 piast_events.18.t:0 "The Union of Krewo"
 piast_events.18.d:0 "Sixty years ago Grand Duke Jogaila of Lithuania took the Polish crown and the name Wladyslaw by marrying Queen Jadwiga, and promised to bring his people into the Church. Lithuania and Poland were meant to stand as one from that day, under the Union of Krewo. Neither has stood for much since the Kingdom broke apart, and the court at Vilnius asks whether Checiny still considers itself bound by an agreement made for a Poland that no longer exists."
 piast_events.18.a:0 "The union still holds"
 piast_events.18.b:0 "Krewo died with the Kingdom"

 piast_events.19.t:0 "Gniezno or Kraków"
 piast_events.19.d:0 "The envoys of Poznan enjoy reminding Checiny's court that the cathedral at Gniezno crowned Boleslaw the Brave three centuries before a single Piast king was buried in Krakow, and that Wielkopolska was Poland before Krakow ever was. Checiny's clerks are just as fond of reminding them where the coronation cathedral, the royal treasury and the university charter have been ever since."
 piast_events.19.a:0 "Kraków was, is, and remains the crown"
 piast_events.19.b:0 "Let Gniezno keep its pride, we'll keep the treasury"

 piast_events.20.t:0 "Akademia Krakowska"
 piast_events.20.d:0 "Kazimierz the Great chartered the Academy in Krakow in 1364, though the Pope refused it a faculty of theology and the school nearly died with him six years later. It still teaches law to the sons of the Polish nobility, and its masters have written asking whose purse it should draw from now."
 piast_events.20.a:0 "Take up the Academy's charter"
 piast_events.20.b:0 "That is Kraków's expense, not ours"
 mpk_piast_coronation:0 "Piast Coronation"
 desc_mpk_piast_coronation:0 "A ruler crowned in the old rite at Wawel."
 mpk_wawel_chapter:0 "Wawel Cathedral Endowed"
 desc_mpk_wawel_chapter:0 "The cathedral of Wawel is restored, and Krakow prospers with it."
 mpk_krewo_compact:0 "Union of Krewo"
 desc_mpk_krewo_compact:0 "Checiny keeps the old union with Vilnius alive."
 mpk_no_compact:0 "Krewo Repudiated"
 desc_mpk_no_compact:0 "The crown answers to no agreement, and no neighbor trusts it."
 mpk_krakow_crown:0 "Krakow Is the Crown"
 desc_mpk_krakow_crown:0 "Krakow, the coronation city, is the only seat that matters."
 mpk_gniezno_pride:0 "Gniezno's Pride"
 desc_mpk_gniezno_pride:0 "Gniezno is left its pride, and grumbles while filling the treasury."
 mpk_akademia_krakowska:0 "Akademia Krakowska"
 desc_mpk_akademia_krakowska:0 "The Academy's masters serve the crown."
 desc_mpk_seat_of_kings:0 "The Piast crown sits once more on Wawel hill."
