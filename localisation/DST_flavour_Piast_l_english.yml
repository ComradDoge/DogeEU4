l_english:

 # Piast duchies (WPK, MAZ, KJW, MPK, KRA): missions/_MIS_Piast_Duchies_Missions.txt, events/_DSE_flavour_Piast_Duchies.txt

 # ---- Wielkopolska
 wpk_gniezno_cathedral_title: "Gniezno Cathedral"
 wpk_gniezno_cathedral_desc: "The cathedral at Gniezno holds the relics of Saint Adalbert, and the first Piast kings were crowned there, three centuries before anyone was crowned in Krakow. Its canons need a patron to pay for the building and the chapter. Endowing the cathedral would bring the church of Wielkopolska to our side."
 wpk_crowned_at_gniezno_title: "Crowned at Gniezno"
 wpk_crowned_at_gniezno_desc: "The Archbishop of Gniezno is still styled Primate of Poland, although there has been no kingdom to be primate of since the old realm broke apart. With his blessing and enough prestige of our own, our claim to the crown would have the church of Poland behind it."
 wpk_poznan_fairs_title: "The Poznan Fairs"
 wpk_poznan_fairs_desc: "Poznan lies on the road from the German towns into the Polish lands, and its fairs draw cloth and salt merchants from both. Proper market halls would let the fairs grow, and the duke's share of them with it."
 wpk_the_notec_march_title: "The Notec March"
 wpk_the_notec_march_desc: "West of Notec lies the Neumark, split between a lord of its own and the Teutonic Order. Taking it would give Wielkopolska a western frontier it can defend, instead of open plain."

 # ---- Mazovia
 maz_the_warszawa_crossing_title: "The Warszawa Crossing"
 maz_the_warszawa_crossing_desc: "Warszawa grew up at a crossing of the Vistula where the roads from Plock and Rawa meet, and the dukes of Mazovia have held court there since 1413. Its merchants want a proper market and a duke who keeps the river open to their boats."
 maz_plocks_old_primacy_title: "Plock's Old Primacy"
 maz_plocks_old_primacy_desc: "From 1079 until the kingdom was divided in 1138, Plock was the seat of the Polish dukes, and two of them are buried in its cathedral. If the Seniorate is revived, Mazovia can argue that Plock has as good a claim to it as Krakow or Gniezno."
 maz_the_mazovian_szlachta_title: "The Mazovian Szlachta"
 maz_the_mazovian_szlachta_desc: "Mazovia has more petty nobles than any other Polish land. Whole villages are noble, and many of their families own little besides a horse and a coat of arms. They ride for the duke when he calls, as long as he respects their privileges."
 maz_warszawa_on_the_vistula_title: "Warszawa on the Vistula"
 maz_warszawa_on_the_vistula_desc: "Warszawa lies between Greater Poland, Lesser Poland and Lithuania, closer to all of them than Krakow or Poznan. Once the city has grown and the court is settled there for good, it could serve as the capital of the whole realm."

 # ---- Kujawy
 kjw_the_chelmno_merchants_title: "The Merchants of Torun"
 kjw_the_chelmno_merchants_desc: "Torun, the Hansa town in Chelmno, ships the grain of Kujawy down the Vistula to Danzig, and its merchants are richer than the duke. A proper market in Torun would keep more of their trade, and their taxes, in Kujawy."
 kjw_lokieteks_example_title: "Lokietek's Example"
 kjw_lokieteks_example_desc: "Wladyslaw Lokietek, the Elbow-High, was born in Kujawy with less land than we hold today, and in 1320 he was crowned in Krakow as king of a reunited Poland. Our knights hold that his example gives Kujawy a claim to every Polish province."
 kjw_brzesc_birthplace_of_kings_title: "Birthplace of Kings"
 kjw_brzesc_birthplace_of_kings_desc: "Two kings were born in Kujawy: Lokietek at Brzesc, and his son Kazimierz the Great at Kowal nearby. Fortify Brzesc and let it grow, and our capital will look like the home of a royal line."
 kjw_salt_of_inowroclaw_title: "The Salt of Inowroclaw"
 kjw_salt_of_inowroclaw_desc: "Salt has been boiled from the brine springs of Inowroclaw for centuries, but only on a small scale. Proper saltworks would make it one of the richest trades in Kujawy."

 # ---- Malopolska
 mpk_the_sandomierz_seat_title: "Sandomierz Seat"
 mpk_the_sandomierz_seat_desc: "Sandomierz became a duchy of its own when the kingdom was divided in 1138, and its castle on the Vistula still guards the way into Lesser Poland. Strengthen the castle or grow the town, and the lords of Sandomierz will stand with Checiny."
 mpk_the_wawel_title: "The Wawel"
 mpk_the_wawel_desc: "Krakow has gone its own way since the old kingdom came apart, but its cathedral holds the tombs of the Piast kings, and its castle holds the crown nobody has worn since. A duchy that calls itself heir to that crown needs the Wawel, the castle hill where it is kept."
 mpk_the_lublin_fairs_title: "The Lublin Fairs"
 mpk_the_lublin_fairs_desc: "Lublin lies on the road east to Ruthenia and Lithuania, and its fairs bring furs, wax and cattle west. Market halls and a larger town would keep more of that trade in Malopolska."
 mpk_red_ruthenia_title: "Red Ruthenia"
 mpk_red_ruthenia_desc: "Kazimierz the Great won Halicz, Lwow and the rest of Red Ruthenia for the crown, and they were ruled from Krakow until the kingdom broke apart. Galicia holds them now. Taking them back would give us Lwow and its trade with the east."

 # ---- Krakow
 kra_walls_of_krakow_title: "The Walls of Krakow"
 kra_walls_of_krakow_desc: "Krakow is a single city among larger neighbours, and every duke in Poland would like to own it. Its walls must be manned and kept in repair, and it needs at least one ally who will come to its aid."
 kra_keepers_of_the_regalia_title: "Keepers of the Regalia"
 kra_keepers_of_the_regalia_desc: "The crown of the Piast kings and the sword Szczerbiec lie in the Wawel treasury, and the city holds the keys. Whoever is crowned in Poland again will have to come to Krakow for them. A city that keeps the regalia need not be the largest duchy to claim the Seniorate."
 kra_the_wieliczka_salt_title: "The Wieliczka Salt"
 kra_the_wieliczka_salt_desc: "The salt mine at Wieliczka, south-east of Krakow, goes deeper every year, and its rock salt sells from Silesia to Hungary. Under the last kings the salt mines paid a third of the crown's income, and larger workings would pay the city just as well."
 kra_the_krakow_academy_title: "The Krakow Academy"
 kra_the_krakow_academy_desc: "Kazimierz the Great founded the Academy in Krakow in 1364, and it nearly died with him six years later. Rebuilt and properly endowed, it could train the clerks and lawyers a kingdom needs."

 # ---- The Seniorate
 piast_the_empty_throne_title: "The Empty Throne"
 piast_the_empty_throne_desc: "The crown of Poland has not been worn since the realm broke apart, and nobody at court agrees on why it broke. Before our house can speak for the other duchies, it needs an heir and a name people respect."
 piast_hold_the_seniorate_title: "Hold the Seniorate"
 piast_hold_the_seniorate_desc: "In 1138 Boleslaw Wrymouth left Poland to his sons, with the eldest as Senior Duke over the rest, seated at Krakow. The other dukes will try to take the title from us. If we keep it for five years, or hold every seat of the old crown, they will have to accept it."
 piast_summon_the_wiec_title: "Summon the Wiec"
 piast_summon_the_wiec_desc: "The wiec was the old assembly of Polish lords and bishops, where the Piast dukes settled matters that concerned them all. A Senior Duke can call one again, but it only counts if the other duchies attend as our subjects or our friends, or if none of them are left."
 piast_the_szczerbiec_title: "The Szczerbiec"
 piast_the_szczerbiec_desc: "Szczerbiec, the coronation sword of the Piast kings, is kept in the Wawel treasury in Krakow, and every king since Lokietek was girded with it at his coronation. Holding both coronation cities, Krakow and Gniezno, gives our ruler the right to carry it."
 piast_crown_of_the_boleslaws_title: "The Crown of the Boleslaws"
 piast_crown_of_the_boleslaws_desc: "Boleslaw the Brave was the first to be crowned King of Poland, in 1025, and the crown named after him still lies in the Wawel. A Senior Duke who has held the title for ten years and rules the old royal lands could wear it."
 piast_is_senior_duke_tt: "Is the §YSenior Duke§!"
 piast_no_other_duchy_tt: "No other Piast duchy exists"
 piast_seniorate_ten_years_tt: "Has held the §YSeniorate§! for at least §Y10§! years without losing it"
 piast_form_poland_now_tt: "The §TRestore the Realm of the White Eagle§! decision can now be taken, once its other conditions are met."
 piast_old_law_revived_tt: "Claiming the §YSeniorate§! will need §Y5§! less development in Polish provinces."
 piast_seniorate_five_years_tt: "Has held the §YSeniorate§! for at least §Y5§! years without losing it"
 piast_holds_all_seats_tt: "Owns every seat of the §YSeniorate§!: §YKrakow§! and §YGniezno§!, and §YPlock§! if it is one of our seats"
 piast_formable_senior_duke_tt: "Is the §YSenior Duke§!"

 # ---- Piast Lands
 piast_gather_the_duchies_title: "Gather the Duchies"
 piast_gather_the_duchies_desc: "No duchy holds more than a handful of Polish provinces, so none of them can speak for Poland. With eight of them under our rule, we would be the largest by some way."
 piast_the_vistula_title: "The Vistula"
 piast_the_vistula_desc: "The Vistula runs from Krakow past Sandomierz, Warszawa and Plock to Torun in Chelmno, and on to Danzig and the sea. Most of the grain grown in the Polish lands goes down it to be sold, and holding its whole course would put that trade in our hands."
 piast_greater_and_lesser_poland_title: "Greater and Lesser Poland"
 piast_greater_and_lesser_poland_desc: "Greater Poland around Poznan and Gniezno, and Lesser Poland around Krakow, were the two heartlands of the old kingdom, and their lords argued for centuries over which came first. Holding both would settle the argument in our favour."
 piast_all_piast_lands_title: "All Piast Lands"
 piast_all_piast_lands_desc: "Mazovia, Kujawy, Leczyca, Sieradz and Sandomierz were all separate duchies at one time or another. With all of them under one ruler, the Polish lands would be whole again for the first time since the kingdom broke."

 # ---- Borderlands
 piast_the_lithuanian_neighbour_title: "The Lithuanian Neighbour"
 piast_the_lithuanian_neighbour_desc: "Vilnius was tied to Krakow by marriage and by treaty under the last kings. Whoever rules there now, we would rather have them as friends or subjects than as rivals on our eastern border."
 piast_the_lithuanian_neighbour_dyn_a: "If we or a subject hold §YVilnius§!, we gain claims on the rest of Lithuania:"
 piast_the_lithuanian_neighbour_dyn_b: "If §YVilnius§! is held by a friendly ruler:"
 piast_podlasie_title: "Podlasie"
 piast_podlasie_desc: "Podlasie, Brest and Grodno lie between the Polish lands and Lithuania, and Turov-Pinsk holds them. Much of the land is still forest, and settlers from Mazovia are already moving in."
 piast_the_orders_frontier_title: "The Order's Frontier"
 piast_the_orders_frontier_desc: "Chelmno and Dobrzyn face the lands of the Teutonic Order to the north, and the knights have taken both before. A fortified border and a standing army would keep them from trying again."
 piast_royal_prussia_title: "Royal Prussia"
 piast_royal_prussia_desc: "Danzig, Marienburg and Pomorskie control the mouth of the Vistula, and every sack of Polish grain that reaches the sea passes through them. Holding them would keep the profits of that trade in Poland."

 # ---- Duchy tooltips
 maz_plock_seat_tt: "§YPlock§! counts as a seat of the §YSeniorate§! for us."
 kra_regalia_keepers_tt: "Claiming the §YSeniorate§! needs only §Y30§! development in Polish provinces instead of §Y60§!."
 kjw_lokietek_claims_tt: "Gain a permanent claim on every §YPolish§! province in Poland that we don't own."

 # ---- The Seniorate: decision, war, opinions
 piast_claim_seniorate_title: "@POL @[Root.GetTag] Claim the Seniorate"
 piast_claim_seniorate_desc: "The old law of the Piasts gave one duke primacy over the others: the Senior Duke, seated at Krakow. Nobody has held the title since the kingdom broke apart. A duke who holds a seat of the old crown and enough of the Polish lands can revive it."
 piast_owns_seat_tt: "Owns a seat of the Seniorate: §YKrakow§! or §YGniezno§! (or §YPlock§!, once Mazovia has completed §YPlock's Old Primacy§!)"
 piast_claim_development_tt: "Has at least §Y60§! development in §YPolish§! provinces (§Y55§! after reviving the old seniorate law; Krakow needs §Y30§!, or §Y25§!, after §YKeepers of the Regalia§!)"
 piast_grant_seniorate_tt: "\nWe become a §YSenior Duke§!. The other Piast duchies must answer: acknowledge our primacy, which makes vassalising easier for us, or protest it. \n\nThey resent it either way (§R-25§! opinion) and may go to war to take the title from us. Losing a war to one of them, all our seats, or our independence ends it."
 cb_piast_seniorate: "Contest the Seniorate"
 cb_piast_seniorate_desc: "They hold the Seniorate and we claim it. Beat them and the title passes to us, if we hold a seat of the old crown."
 piast_seniorate_wargoal: "Contest the Seniorate"
 piast_seniorate_wargoal_desc: "Defeat the Senior Duke. Polish provinces can be taken at a reduced cost."
 PIAST_SENIORATE_PROVS: "All Polish Provinces"
 PIAST_SENIORATE_WAR_NAME: "$ORDER$$FIRST$ War for the Seniorate"
 piast_rival_senior_duke: "Rival for the Seniorate"
 piast_acknowledged_senior: "Acknowledged the Senior Duke"
 piast_protested_senior: "Protested the Seniorate"
 piast_marriage_bond: "Piast Match"
 piast_match_refused: "Refused a Piast Match"

