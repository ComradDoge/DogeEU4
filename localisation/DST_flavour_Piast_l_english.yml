 piast_vistula_grain_trade_modifier: "Vistula Grain Trade"
 desc_piast_vistula_grain_trade_modifier: "Grain from the Vistula lands moves downriver under one lord."
 piast_two_polands_modifier: "Greater and Lesser Poland"
 desc_piast_two_polands_modifier: "The two halves of the old kingdom answer to one court again."
