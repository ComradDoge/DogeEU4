 desc_piast_baltic_outlet_modifier: "Polish grain reaches the Baltic through ports we control."
 piast_penance_modifier: "Penance for the Breaking"
 desc_piast_penance_modifier: "The clergy lead processions of penance for the sins that broke the crown."
 piast_hollow_crown_modifier: "The Burghers' Counsel"
 desc_piast_hollow_crown_modifier: "The burghers of our towns advise the court on taxes and help collect them."
 piast_revenge_oath_modifier: "Oath of Return"
 desc_piast_revenge_oath_modifier: "Our knights have sworn to win the Seniorate back."
 piast_wiec_knights_modifier: "Privileges of the Knights"
 desc_piast_wiec_knights_modifier: "The wiec confirmed the knights' privileges, and more of them turn out when we call."
 piast_wiec_bishops_modifier: "The Bishops' Wiec"
 desc_piast_wiec_bishops_modifier: "The bishops presided over the wiec and now help keep order in the realm."
 piast_wiec_towns_modifier: "The Towns Heard"
