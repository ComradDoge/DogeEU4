 desc_wpk_poznan_fairs_modifier: "Merchants from the German towns and the Polish lands meet at the fairs of Poznan."
 wpk_notec_march_modifier: "The Notec March"
 desc_wpk_notec_march_modifier: "Our western border rests on Notec and the Neumark beyond it, and the march trains our soldiers."
