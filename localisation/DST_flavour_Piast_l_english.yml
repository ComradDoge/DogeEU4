 maz_plock_tombs_modifier: "Tombs of the Dukes"
 desc_maz_plock_tombs_modifier: "The restored tombs in Plock cathedral draw pilgrims and endowments."
 maz_petty_szlachta_modifier: "Mazovian Szlachta"
 desc_maz_petty_szlachta_modifier: "Every village of petty nobles in Mazovia sends its riders."
 maz_warszawa_modifier: "Warszawa, Heart of the Realm"
 desc_maz_warszawa_modifier: "Warszawa sits at the centre of the Polish lands, and trade and people flow to it."
 maz_warszawa_court_modifier: "The Court at Warszawa"
 desc_maz_warszawa_court_modifier: "Envoys, clerks and merchants from every corner of Poland gather at our court in Warszawa."
 kjw_torun_merchants_modifier: "Merchants of Torun"
 desc_kjw_torun_merchants_modifier: "The Hansa merchants of Torun trade on our behalf."
 kjw_lokietek_example_modifier: "Lokietek's Example"
 desc_kjw_lokietek_example_modifier: "Like Lokietek before us, we claim all of Poland and take it piece by piece."
 kjw_lesser_knights_modifier: "Lesser Knights of Kujawy"
 desc_kjw_lesser_knights_modifier: "The lesser knights ride for the duke who promised them a share of Poland."
 kjw_inowroclaw_saltworks_modifier: "Inowroclaw Saltworks"
 desc_kjw_inowroclaw_saltworks_modifier: "Brine from the springs of Inowroclaw is boiled into salt and sold across Poland."
 kjw_salt_wealth_modifier: "Salt of Kujawy"
 desc_kjw_salt_wealth_modifier: "Salt money from Inowroclaw pays for building up the land."
 mpk_sandomierz_lords_modifier: "Lords of Sandomierz"
 desc_mpk_sandomierz_lords_modifier: "The lords of Sandomierz stand with Checiny."
 mpk_lublin_fairs_modifier: "Lublin Fairs"
 desc_mpk_lublin_fairs_modifier: "The fairs of Lublin bring the trade of Ruthenia and Lithuania west."
 mpk_lwow_staple_modifier: "Lwow Staple Right"
 desc_mpk_lwow_staple_modifier: "Merchants passing through Lwow must first offer their goods for sale in the city."
