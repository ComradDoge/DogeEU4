 gv_neighbours_on_the_pripyat_dyn_a: "If §YTurov-Pinsk§! is our ally:"
 gv_neighbours_on_the_pripyat_dyn_b: "If §YTurov-Pinsk§! no longer exists or is our subject, or we own §YPinsk§!, we gain claims on its lands:"
