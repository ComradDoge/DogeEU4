 gv_the_lands_of_rus_dyn_b: "If we took the §YCrown from Rome§!, the Catholic courts seek our friendship:"
 gv_the_lands_of_rus_dyn_c: "If we have not been crowned:"
 gv_events.1.b.tt: "If the other half of the old kingdom still stands, it and we gain §G+50§! opinion of each other."
 gv_events.16.a.tt: "§Y[gv_other_half.GetName]§! decides whether to accept a marriage and an accord."

 # ---- Events
 gv_events.1.t: "The Romanovich Inheritance"
 gv_events.1.d: "A generation ago the realms of the Poles and the Lithuanians fell apart almost overnight, for reasons the clergy and the astrologers still argue over, and the lands between the San and the Dnieper were left to whoever could hold them. In [Root.Capital.GetName] the court has begun to look further back, to the kingdom Roman the Great made of Galicia and Volhynia in 1199 and Daniel ruled as King of Rus'. Two princes now claim that inheritance, one in Lwow and one in Volodymyr. Our council wants to know on what grounds we will press ours."
 gv_events.1.a: "We are Roman's heirs"
 gv_events.1.b: "We are brothers, as Daniel and Vasylko were"
 gv_events.1.c: "The breaking was God's judgement: let the church lead us"
 gv_events.2.t: "The Boyar Council"
 gv_events.2.d: "The boyars of Galicia have come to [Root.Capital.GetName] in force. They want a fixed place on the prince's council, a voice in the succession and the right to refuse a war. Roman the Great answered their grandfathers bluntly: 'You cannot eat the honey without killing the bees.' His son Daniel was driven out of Galicia by them more than once before he made it his own. We have to decide what kind of prince we will be."
 gv_events.2.a: "Seat them on the council"
 gv_events.2.b: "Kill the bees"
 gv_events.2.c: "Set the families against each other"
 gv_events.3.t: "The Crown of Rus'"
 gv_events.3.d: "The crown is ready and the court has gathered. In 1253 Daniel took his crown at Drohiczyn from the legate of Pope Innocent IV, in return for promises of a crusade against the Horde and of a union of the churches. The crusade never came, and Daniel never forced the union on his clergy. Our bishops urge us to be crowned by the Metropolitan of Halicz in our own rite. The envoys from Rome point out that a crown from the Pope is recognised in every court of the west."
 gv_events.3.a: "Take the crown from Rome, as Daniel did"
 gv_events.3.b: "Be crowned at Halicz, by our own church"
 gv_events.4.t: "The Staple Right"
 gv_events.4.d: "The burghers of Lwow have brought their petition: every merchant passing through the city should be made to stop, unload and offer his goods to the townsmen for two weeks. The great merchants of the Black Sea trade say they would sooner take another road. Our treasurer suggests another way: let them pass, and toll the roads instead."
 gv_events.4.a: "Enforce the staple"
 gv_events.4.b: "Let them pass and toll the roads"
 gv_events.5.t: "The Nations of Lwow"
 gv_events.5.d: "Delegations from three of Lwow's communities wait on us. The Armenians, whose merchants trade as far as Persia, ask for their bishop's courts to be confirmed. The Jewish elders ask for a charter protecting their quarter and their trade. The town council, German by origin and governed by Magdeburg law, asks for its rights over the market. Each of them can make the city richer, but a charter for one means less for the others."
 gv_events.5.a: "Confirm the Armenian courts"
 gv_events.5.b: "Grant the Jewish charter"
 gv_events.5.c: "Uphold the council's Magdeburg law"
 gv_events.6.t: "The Court at Lutsk"
 gv_events.6.d: "The castle at Lutsk is garrisoned again, and the lords of Volhynia have come to see it. Lubart held court here as a prince of Volhynia, though he was a Lithuanian by birth and his knights came from the north. Some of our councillors want us to rule as he did, from Lutsk and among our own lords. Others point out that many Lithuanian knights have had no lord since Lithuania broke apart, and that they would ride for us."
 gv_events.6.a: "Hold court at Lutsk as Lubart did"
 gv_events.6.b: "Take the Lithuanian knights into our service"
 gv_events.7.t: "The Princely Houses"
 gv_events.7.d: "The princes of Volhynia have answered our summons with their retinues. The Ostrogski, whose castle at Ostroh lies south of Rowne, bring the most horsemen and want the command of our army. The Czartoryski, a branch of the old Lithuanian ruling house settled in Volhynia, have kin at half the courts of the east and offer to speak for us there. Choosing one will offend the other."
 gv_events.7.a: "Give the Ostrogski the command"
 gv_events.7.b: "Send the Czartoryski as our envoys"
 gv_events.7.c: "Favour no house above the others"
 gv_events.8.t: "The Footprint at Pochaiv"
 gv_events.8.d: "The monks of Pochaiv, south of Kremenets, have come to court with accounts of new miracles at the footprint in the rock. Pilgrims are already arriving from Podolia and Galicia, and the abbot asks what the prince will do for the shrine."
 gv_events.8.a: "Build a road and hostels for the pilgrims"
 gv_events.8.b: "Fund a scriptorium for the monks"
 gv_events.8.c: "Endow the monastery"
 gv_events.9.t: "The Ostroh Bible"
 gv_events.9.d: "The scholars of Ostroh have collated Greek and Slavonic manuscripts gathered from Moscow to Mount Athos, and propose to print a complete Bible in Church Slavonic, the first of its kind. Others at the academy would rather spend the money teaching Greek and Latin to the sons of the szlachta, so that they need not go to Krakow or Padua to study."
 gv_events.9.a: "Print the Bible"
 gv_events.9.b: "Teach the sons of the szlachta"
 gv_events.10.t: "The Union of the Churches"
 gv_events.10.d: "The papal legate has arrived at Drohiczyn with letters from Rome. The Pope is ready to recognise our church's rite, its language and its married priests, if our bishops acknowledge his primacy. Our own clergy are divided, and the older ones remember how little Daniel received for his promises."
 gv_events.10.a: "Proclaim the union in the royal lands"
 gv_events.10.b: "Promise much and sign little"
 gv_events.11.t: "The Metropolitan of Halicz"
 gv_events.11.d: "Constantinople raised the see of Halicz to a metropolis in 1303, at the request of King Yuri, and it has stood vacant or subordinate for most of the time since. With the cathedral repaired, we can put forward a candidate. The bishops favour a learned monk from Mount Athos. The court would prefer a man of our own household."
 gv_events.11.a: "Choose the learned monk"
 gv_events.11.b: "Choose a man we can trust"
 gv_events.12.t: "The Chronicle"
 gv_events.12.d: "The court scribes have read the old Galician-Volhynian Chronicle, with its accounts of Roman's wars, Daniel's crown and the treachery of the boyars, and are ready to continue it from 1292. They ask what the new chapters should dwell on."
 gv_events.12.a: "The deeds of the warrior kings"
 gv_events.12.b: "The treason of the boyars"
 gv_events.12.c: "The year the realms broke"
 gv_events.13.t: "The Wild Fields"
 gv_events.13.d: "Word comes from the steppe that the Cossacks have come in to bargain. They will fight the Tatars for us if we pay them and leave them their own officers. Our governors on the border also see good land lying empty and want to bring in settlers, which the Cossacks would not welcome."
 gv_events.13.a: "Put the Cossacks on our register"
 gv_events.13.b: "Bring settlers onto the steppe"
 gv_events.13.c: "Leave the steppe to the free men"
 gv_events.14.t: "Worse than Evil"
 gv_events.14.d: "The khanate's power is broken. Its murzas and their horsemen are scattered, and the slave markets of Crimea hold thousands of captives taken from our villages. Some of the murzas offer to serve us, as Tatars have served the Lithuanian princes for a century. Our priests would rather see the captives freed first."
 gv_events.14.a: "Settle the murzas as border horsemen"
 gv_events.14.b: "Free the captives"
 gv_events.15.t: "The Mother of Rus' Cities"
 gv_events.15.d: "Kiev is ours. The Golden Gate still stands, though much of the city it once guarded is now fields and ruins. The monks of the Caves monastery and the old boyar families ask the same question: will the court come to Kiev, or will the city be ruled from the west?"
 gv_events.15.a: "Move the court to Kiev"
 gv_events.15.b: "Rule it through a voivode"
 gv_events.16.t: "The Brothers' Accord"
 gv_events.16.d: "Daniel ruled Galicia and his brother Vasylko ruled Volhynia, and in thirty years they never once fought each other. Some of our councillors suggest sending envoys to [gv_other_half.GetName] to offer a marriage and an accord in the same spirit. Others say there is only one crown of Rus', and an accord would only put off the question of who wears it."
 gv_events.16.a: "Send envoys"
 gv_events.16.b: "There is one crown, not two"
 gv_events.17.t: "The Boyar Plot"
 gv_events.17.d: "A servant has warned us that several boyars met at night to talk about the succession. In 1340 the boyars of Galicia poisoned King Yuri II, and the kingdom died with him. Their descendants are richer now than their grandfathers ever were."
 gv_events.17.a: "Arrest the plotters"
 gv_events.17.b: "Buy their loyalty"
 gv_events.18.t: "Tatar Raiders"
 gv_events.18.d: "A Tatar war band crossed the steppe and fell on the villages around [gv_raided_province.GetName]. They were gone before our levies could gather, driving hundreds of captives south toward the markets of Crimea."
 gv_events.18.a: "Ransom the captives"
 gv_events.18.b: "Ride after them"
 gv_events.19.t: "The Night the Realms Broke"
 gv_events.19.d: "An old monk from Halicz has asked to see us. He says he was a novice on the night the old realms broke, and that every bell in his monastery rang by itself at midnight while the brothers stood in the yard and listened. The clergy have heard a hundred such stories since. His is the first told by a man willing to repeat it before the court."
 gv_events.19.a: "Have it written down"
 gv_events.19.b: "Send him to the metropolitan"
 gv_events.19.c: "Thank him and send him home"
 gv_events.20.t: "Envoys from [From.GetName]"
 gv_events.20.d: "Envoys from [From.GetName] have arrived with an offer: a marriage between our houses and an accord between Galicia and Volhynia, like the one Daniel and Vasylko kept. They say nothing about who should one day wear the crown."
 gv_events.20.a: "Accept the accord"
 gv_events.20.b: "Refuse"

