l_english:

 # Galicia and Volhynia (GLA, VLH): missions/_MIS_Galicia_Volhynia_Missions.txt, events/_DSE_flavour_Galicia_Volhynia.txt

 # ---- Galicia
 gla_the_lwow_market_title: "The Lwow Market"
 gla_the_lwow_market_desc: "Lwow sits where the road from Krakow meets the roads to Kiev and Moldavia, and Armenian, Jewish, German and Ruthenian traders already share its market square. A proper market hall, or simply a larger town, would keep more of that trade in our hands."
 gla_the_galician_boyars_title: "The Galician Boyars"
 gla_the_galician_boyars_desc: "No nobility in Rus' has been as stubborn as the boyars of Galicia. They called in Hungarian kings when it suited them, drove out princes they disliked, and in 1213 one of them, Vladislav Kormilchich, made himself prince. Before we look beyond our borders we need to settle how far their council can bind us."
 gla_the_drohobycz_salt_title: "The Brine Wells of Drohobycz"
 gla_the_drohobycz_salt_desc: "The springs at Drohobycz run salty, and the townsmen have boiled brine there since the days of the old princes. Galician salt went by cart north to Volhynia and west across the San at Peremyshl. Proper saltworks would turn a local trade into one of the realm's steadiest incomes."
 gla_the_staple_right_title: "The Staple Right"
 gla_the_staple_right_desc: "Merchants travelling between the Black Sea and the towns of the west pass through Lwow, and the burghers want them made to stop. A staple right would force every caravan to unload and offer its goods in the city for a fixed number of days before moving on. The burghers petitioned the old crown for it for years. The decision is now ours."
 gla_the_nations_of_lwow_title: "The Nations of Lwow"
 gla_the_nations_of_lwow_desc: "Lwow is a city of several nations. The Armenians began their cathedral in 1363 and keep their own courts, the Jews have their own quarter and elders, and the town council has governed by Magdeburg law since 1356. Each community wants its privileges confirmed by the crown, and the city's growth depends on keeping all of them content."
 gla_the_city_of_lions_title: "The City of Lions"
 gla_the_city_of_lions_desc: "Daniel of Halicz named Lwow after his son Lev, and the lion has been on the city's arms ever since. If the city keeps growing and its merchants come to dominate the Krakow trade, Lwow will be more than a provincial market. It will be the commercial capital of Rus'."

 # ---- Volhynia
 vlh_the_volodymyr_cathedral_title: "The Cathedral at Volodymyr"
 vlh_the_volodymyr_cathedral_desc: "The Assumption cathedral at Volodymyr, in Volhynia, was built by Prince Mstislav in 1160, and the princes of Volhynia are buried beneath it. Repairing it and endowing its clergy would show that the princely line still honours its dead, and the town around it would grow with the patronage."
 vlh_lubarts_castle_title: "Lubart's Castle"
 vlh_lubarts_castle_desc: "Lubart, the Lithuanian prince who held Volhynia in the last century, rebuilt the castle at Lutsk in brick, and it is still the strongest seat in the province of Volhynia. A garrisoned castle, at Lutsk or at Kremenets, would show the lords of Volhynia and our neighbours that we can hold what we have."
 vlh_kremenets_unconquered_title: "Kremenets Unconquered"
 vlh_kremenets_unconquered_desc: "In 1241 the army of Batu Khan burned its way through Volhynia but could not take the castle on the hill at Kremenets. The walls are old now. Rebuilt and garrisoned, they would guard the road south toward Podolia as they did then."
 vlh_the_princely_houses_title: "The Princely Houses"
 vlh_the_princely_houses_desc: "Volhynia's great families are princes in their own right, not mere boyars: the Ostrogski at Ostroh, south of Rowne, and the Czartoryski among them. Each rides to war with its own retinue. If we can bring their horsemen under our banner, Volhynia can field far more cavalry than its size suggests."
 vlh_the_pochaiv_lavra_title: "The Pochaiv Lavra"
 vlh_the_pochaiv_lavra_desc: "The monks at Pochaiv, south of Kremenets, show pilgrims a footprint in the rock which they say the Mother of God left in 1240, the year the Tatars came. The monastery is poor and its church small. A patron could make it the greatest shrine in Volhynia."
 vlh_the_ostroh_academy_title: "The Ostroh Academy"
 vlh_the_ostroh_academy_desc: "Ostroh, south of Rowne, is a small town with a large castle and a princely family that can afford scholars. A school there teaching Greek, Latin and Church Slavonic would train priests, clerks and envoys for the whole realm, and give the Orthodox of Rus' a place of learning to set beside the Latin universities."

 # ---- The Crown of Rus'
 gv_the_romanovich_inheritance_title: "Romanovich Inheritance"
 gv_the_romanovich_inheritance_desc: "In 1199 Roman the Great joined Galicia and Volhynia into one realm, and his son Daniel was crowned King of Rus'. The kingdom lasted until 1340, when the boyars poisoned its last king and the Poles and Lithuanians divided it between them. Now that their crowns have broken too, the old Romanovich lands are back in the hands of Ruthenian princes, and Galicia and Volhynia each claim to be the rightful heir."
 gv_reunite_the_halves_title: "Reunite the Halves"
 gv_reunite_the_halves_desc: "Galicia and Volhynia have been one realm before, and the lords of both remember it. Holding every town of Red Ruthenia and Volhynia would make our claim to Roman's inheritance more than words, and the people of both lands would accept a single ruler."
 gv_the_crown_of_rus_title: "The Crown of Rus'"
 gv_the_crown_of_rus_desc: "Daniel of Halicz accepted a royal crown from the Pope's legate in 1253, hoping for a crusade against the Horde that never came. With Lwow, Volodymyr and Halicz in our hands, we can take the royal title again. The question is who will place the crown: a legate from Rome, as in Daniel's day, or the Metropolitan of Halicz, by the rite of our own church."
 gv_the_church_of_rus_title: "The Church of Rus'"
 gv_the_church_of_rus_desc: "The coronation settled the church question in principle. Now it has to be carried out. If we took the crown from Rome, the Pope expects talk of union, and Drohiczyn, in Podlasie, where Daniel was crowned, is the place to hold it. If we were crowned at Halicz, the metropolitan see there must be given back the standing it had when Constantinople created it in 1303."
 gv_the_chronicle_title: "The Chronicle"
 gv_the_chronicle_desc: "The Galician-Volhynian Chronicle tells the history of the Romanovich princes up to 1292 and then stops. A reign as eventful as ours deserves to be added to it, and the court scribes are ready to take it up where the old monks left off."
 gv_ruska_pravda_title: "Ruska Pravda"
 gv_ruska_pravda_desc: "The Ruska Pravda, the law code of the old Kievan princes, is still cited in our courts alongside boyar custom, German town law and a pile of royal grants. A revised code issued in the crown's name would give the whole realm one law to answer to."
 gv_rex_russiae_title: "Rex Russiae"
 gv_rex_russiae_desc: "Daniel and his grandson Yuri sealed their charters as Rex Russiae, King of Rus', a title their heirs could not hold on to. After ten years under the crown, and with the realm grown strong, we can claim it in full, and with it every land that once belonged to Rus'."

 # ---- The Western Marches
 gv_the_cherven_towns_title: "The Cherven Towns"
 gv_the_cherven_towns_desc: "Chelm and Belz are two of the Cherven Towns, which Prince Vladimir of Kiev took from the Poles in 981 and which have been fought over ever since. Galicia holds one and Volhynia the other. Whoever holds both controls the road between the two lands."
 gv_the_line_of_the_san_title: "The Line of the San"
 gv_the_line_of_the_san_desc: "Peremyshl stands on the San where it leaves the Carpathians, and every Polish or Hungarian army bound for Galicia has passed under its walls. A castle there, and an army ready to man it, would close the western gate."
 gv_galicia_and_lodomeria_title: "Galicia and Lodomeria"
 gv_galicia_and_lodomeria_desc: "Since 1206 the kings of Hungary have styled themselves kings of Galicia and Lodomeria, the Latin name for the land of Volodymyr, and the title is still remembered in Buda. With Halicz and Drohobycz in our hands we can settle the matter: by an alliance that makes the claim meaningless, or by leaving Hungary no means to press it."
 gv_the_polish_question_title: "The Polish Question"
 gv_the_polish_question_desc: "The Polish lords to the west have their own claims on Red Ruthenia and will press them as soon as one of them is strong enough. If we took the crown from Rome, we can make friends of them: a Catholic-crowned king of Rus' is someone they can marry and ally with. If we were crowned at Halicz, we need an army and a fortified Chelm to keep them out. Either way, we can claim the lands around Lublin, which Daniel's son Lev held for a time."
 gv_lublin_and_sandomierz_title: "Lublin and Sandomierz"
 gv_lublin_and_sandomierz_desc: "Lublin, Sandomierz and Tarnow guard the approaches from Lesser Poland. Held by us or by a Polish vassal, they would turn our western border from open plain into a march of our own."

 # ---- Podolia and the Steppe
 gv_kamieniec_on_the_smotrych_title: "Kamieniec on the Smotrych"
 gv_kamieniec_on_the_smotrych_desc: "Kamieniec in Podolia stands on a rock almost surrounded by the gorge of the Smotrych, and its castle is reached by a single bridge. Whoever holds it holds Podolia. Strengthened, it would anchor our southern border and serve as the base for taking the rest of Podolia."
 gv_the_podolian_border_title: "The Podolian Border"
 gv_the_podolian_border_desc: "Winnica and Bratslav, east of Kamieniec, are thinly settled border country between our lands and Kiev's. With all of Podolia under one ruler, settlers could move in behind our castles, and the road to Kiev itself would lie open."
 gv_the_moldavian_road_title: "The Moldavian Road"
 gv_the_moldavian_road_desc: "The road from Lwow to the Black Sea runs through Moldavia, down to Suceava, in the province of Moldavia, and on to Kilia, in Bessarabia, where Genoese ships used to call. Whoever controls Moldavia controls the road. A firm alliance with its voivode, or his submission, would bring the trade to us."
 gv_the_wild_fields_title: "The Wild Fields"
 gv_the_wild_fields_desc: "South of Kiev the settled land ends and the steppe begins. Runaway serfs, outlaws and adventurers have gathered at Zaporozhia, below the Dnieper rapids, and call themselves Cossacks. They answer to nobody, but they fight the Tatars better than anyone. Ruling the lands around Zaporozhia and Mansur, or making their host our subject, would give us both the steppe and its horsemen."
 gv_bitter_is_tatar_honour_title: "Bitter Is Tatar Honour"
 gv_bitter_is_tatar_honour_desc: "When Daniel rode to Batu Khan's camp in 1245 to keep his lands, the chronicler wrote: 'O, worse than evil is Tatar honour!' The Crimean khans still raid Podolia for captives to sell. The raids will only stop when the khanate is gone, bound to us, or Crimea itself is ours."
 gv_the_black_sea_ports_title: "The Black Sea Ports"
 gv_the_black_sea_ports_desc: "Kilia, in Bessarabia, and the harbours of Yedisan are where our grain, salt and furs could reach the sea without paying anyone a toll. Holding both coasts would make us a Black Sea power."

 # ---- The Lands of Rus'
 gv_neighbours_on_the_pripyat_title: "Neighbours on the Pripyat"
 gv_neighbours_on_the_pripyat_desc: "North of Volhynia the princes of Turov and Pinsk rule the marshes of the Pripyat, and they also hold Drohiczyn, in Podlasie. Their river is the road between Kiev and the north-west. A close alliance would open it to us, and if they cannot stand on their own, their lands are as much a part of old Rus' as ours."
 gv_kiev_mother_of_cities_title: "The Mother of Rus' Cities"
 gv_kiev_mother_of_cities_desc: "The old chronicle calls Kiev the mother of the cities of Rus'. It was the seat of the grand princes and of the metropolitans, and every prince of Rus' still traces his line back to its rulers. Whoever holds it can speak for all of Rus'."
 gv_the_left_bank_title: "The Left Bank"
 gv_the_left_bank_desc: "Across the Dnieper from Kiev lie Pereyaslav, Poltava and Lubnie, rich black-earth country under the princes of Chernigov. The Left Bank would give us the grain of the whole middle Dnieper and push our border out toward the steppe."
 gv_the_lands_of_rus_title: "The Lands of Rus'"
 gv_the_lands_of_rus_desc: "With Kiev, Podlasie, the Pripyat lands and both banks of the Dnieper in our hands, we hold more of old Rus' than any prince since the Mongols came. The rest of Ruthenia is within reach."

