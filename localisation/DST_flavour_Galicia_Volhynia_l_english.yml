 gv_crown_of_halicz_tt: "We take the §YCrown of Halicz§!. Missions that depend on the crown follow its branch: a restored metropolitan see and a hard line against the Polish lords."
 gv_owns_drohiczyn_tt: "§YPodlasie§!, where Daniel was crowned at Drohiczyn in 1253, is held by us or one of our subjects"
 gv_catholic_friend_tt: "Has a §YCatholic§! ally, or a §YCatholic§! country has at least §Y100§! opinion of us"
 gv_crown_not_chosen_tt: "Has chosen how to take the §YCrown of Rus'§!"
