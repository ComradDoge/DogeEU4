 # ---- Modifiers: Galicia
 gla_lwow_market_modifier: "Lwow Market"
 desc_gla_lwow_market_modifier: "Traders of four nations meet in the market square of Lwow."
 gla_boyar_council_modifier: "The Boyar Council"
 desc_gla_boyar_council_modifier: "The boyars of Galicia sit on the prince's council and bring their men to war."
 gla_killing_the_bees_modifier: "Killing the Bees"
 desc_gla_killing_the_bees_modifier: "We have broken the boyars' resistance, as Roman the Great did."
 gla_drohobycz_brine_wells_modifier: "Brine Wells of Drohobycz"
