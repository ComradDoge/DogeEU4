 gv_galicia_and_lodomeria_dyn_b: "If §YHungary§! is not our ally (it is gone, our subject, or too weak to press its claim), we gain claims beyond the passes:"
 gv_the_moldavian_road_dyn_a: "If §YMoldavia§! is our ally:"
