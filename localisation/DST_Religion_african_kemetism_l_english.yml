l_english:
 # Info
  egyptian_religion: "Kemetism"
  egyptian_religion_religion_desc: "The old faith of Kemet, the Black Land. Amun-Ra, Osiris, Isis, Horus, Seth, Ptah, Thoth, Sobek, Anubis and many lesser gods were served in great temple houses along the Nile, and their worshippers are known for their elaborate funerary rites. The faith lives on in the western oases of Farafreh, Bahiriya and Kharga, and its priests have not forgotten where the Houses of the Gods once stood."


  # Decisions
  convert_to_kemetism_title: "£kemetic_icon£Convert to Kemetism"
  convert_to_kemetism_desc: "The old gods never left the oases. Their priests still keep the rites of Amun-Ra and Osiris, and now they ask our [Root.Monarch.GetTitle] to take up the faith of the old kings."

  # Modifiers
  kemetism_conversion: "Kemetic Conversion"
  desc_kemetism_conversion: "The restored priesthood sends its servants out to bring the people back to the old gods, and has little patience with those who refuse."
  kemet_favour_of_amun_modifier: "Favour of Amun-Ra"
  desc_kemet_favour_of_amun_modifier: "§gAmun-Ra is our patron, and his House at Waset stands restored.§!"
  kemet_favour_of_wsir_modifier: "Favour of Osiris"
  desc_kemet_favour_of_wsir_modifier: "§gOsiris is our patron, and his House at Abdju stands restored.§!"
  kemet_favour_of_aset_modifier: "Favour of Isis"
  desc_kemet_favour_of_aset_modifier: "§gIsis is our patron, and her House at Swenett stands restored.§!"
  kemet_favour_of_heru_modifier: "Favour of Horus"
  desc_kemet_favour_of_heru_modifier: "§gHorus is our patron, and his House at Behedet stands restored.§!"
  kemet_favour_of_sutekh_modifier: "Favour of Seth"
  desc_kemet_favour_of_sutekh_modifier: "§gSeth is our patron, and his House at Ta-iht stands restored.§!"
  kemet_favour_of_ptah_modifier: "Favour of Ptah"
  desc_kemet_favour_of_ptah_modifier: "§gPtah is our patron, and his House at Men-nefer stands restored.§!"
  kemet_favour_of_sobek_modifier: "Favour of Sobek"
  desc_kemet_favour_of_sobek_modifier: "§gSobek is our patron, and his House at Shedet stands restored.§!"
  kemet_favour_of_djehuty_modifier: "Favour of Thoth"
  desc_kemet_favour_of_djehuty_modifier: "§gThoth is our patron, and his House at Khemenu stands restored.§!"
  kemet_favour_of_anubis_modifier: "Favour of Anubis"
  desc_kemet_favour_of_anubis_modifier: "§gAnubis is our patron, and the necropolis of Bahiriya is tended under the Sacred Burials.§!"

 # Egyptian Deities
 egy_ra: "Amun-Ra"
 egy_ra_desc: "Amun, the Hidden One of Waset, joined with Ra, the sun who crosses the sky in his barque by day and the underworld by night. As king of the gods he made his priests at Waset the richest in the land, and foreign kings sent gifts to his temple.\n\nIf his House at §YWaset§! (Qus) is restored and ours, we also gain §G+15%§! Improve Relations while he is our patron."
 egy_osiris: "Osiris"
 egy_osiris_desc: "Lord of the dead and of the black earth the flood leaves behind. Slain by his brother Seth and made whole again by Isis, he judges every soul in the Hall of Two Truths.\n\nIf his House at §YAbdju§! (Girga) is restored and ours, we also gain §G+10%§! National Tax Modifier while he is our patron."
 egy_isis: "Isis"
 egy_isis_desc: "Wife of Osiris and mother of Horus, the greatest of the magicians. She gathered her husband's body and hid her son in the marshes until he could claim his father's throne. Rulers who fear for their line call on her.\n\nIf her House at §YSwenett§! (Aswan) is restored and ours, we also gain §G+1§! Tolerance of the True Faith while she is our patron."
 egy_horus: "Horus"
 egy_horus_desc: "The falcon of the sky, son of Isis and Osiris, who fought Seth for his father's throne and won it. Every living king is Horus on the throne.\n\nIf his House at §YBehedet§! (Isna) is restored and ours, we also gain §G+0.5§! Yearly Army Tradition while he is our patron."
 egy_set: "Seth"
 egy_set_desc: "Seth, or Sutekh, lord of the red desert, of storms and of foreign lands. He killed his brother Osiris, yet each night he stands at the prow of Ra's barque to spear the serpent Apep.\n\nIf his House at §YTa-iht§! (Farafreh) is restored and ours, we also gain §G+1§! Attrition for Enemies while he is our patron."
 egy_ptah: "Ptah"
 egy_ptah_desc: "Ptah of Men-nefer, who made the world by thinking it in his heart and speaking it with his tongue. Craftsmen, builders and sculptors are his.\n\nIf his House at §YMen-nefer§! (Cairo) is restored and ours, we also gain §G-10%§! Great Project Upgrade Cost while he is our patron."
 egy_sobek: "Sobek"
 egy_sobek_desc: "The crocodile-headed god of the Nile and of the marshes of Shedet, Sobek projects pharaonic power and is associated with fertility, military prowess and protection.\n\nIf his House at §YShedet§! (Fayyum) is restored and ours, we also gain §G+10%§! Manpower Recovery Speed while he is our patron."
 egy_thoth: "Thoth"
 egy_thoth_desc: "Thoth, or Djehuty, the ibis-headed scribe of the gods. He invented writing, keeps the count of the years and records the verdict when the hearts of the dead are weighed.\n\nIf his House at §YKhemenu§! (Minya) is restored and ours, we also gain §G-10%§! Advisor Costs while he is our patron."
 egy_anubis: "Anubis"
 egy_anubis_desc: "Anubis is the guardian of the necropolis and the god of embalming, famous for his jackal head. He leads the dead to the scales where their hearts are weighed.\n\nHe has no House of his own. If we grant the §YSacred Burials§! and hold §YBahiriya§!, we also gain §G-15%§! Fort Maintenance while he is our patron."

 # Kemetic Ideas
 kemet_ideas_0: "Kemetic Ideas"
 kemet_ideas_0_desc: "Our state religion is Kemetism."
 kemet_ideas_0_bonus: "Kemetic Bonus"
 kemet_ideas_1: "The Weighing of the Heart"
 kemet_ideas_1_desc: "In the Hall of Two Truths the heart of the dead is weighed against the feather of Ma'at. Those who keep faith with the gods have nothing to fear from the scales."
 kemet_ideas_2: "The House of Life"
 kemet_ideas_2_desc: "Every great temple keeps a House of Life, where scribes copy the sacred books, physicians are trained and the records of the realm are kept."
 kemet_ideas_3: "The Nilometers"
 kemet_ideas_3_desc: "Stairs cut down into the river mark the height of every flood. A good flood means a good harvest, and the assessors set the year's taxes by it."
 kemet_ideas_4: "The Medjay"
 kemet_ideas_4_desc: "The desert scouts of old became the archers and police of the kings, and the name is given again to the riders who guard our roads."
 kemet_ideas_5: "The Festival of Opet"
 kemet_ideas_5_desc: "Each year Amun-Ra sails upriver to visit his southern house, and the ruler walks beside him to renew the kingship before the crowd."
 kemet_ideas_6: "Builders of Eternity"
 kemet_ideas_6_desc: "The gangs of the royal workshops built temples meant to last for millions of years. Our masons study what still stands and learn to build that way again."
 kemet_ideas_7: "The Wab Priests"
 kemet_ideas_7_desc: "The pure ones serve the temples in turns, then go home to their towns and villages and carry the word of the gods with them, asking little of the treasury."
 
 # Egyptian Religion Rebels
 egyptian_religion_demand_desc: "The religious rebels fight for the $RELIGION$ religion. They demand that we recognize its supremacy or at the very least cease our efforts to convert them and let them worship in peace."
 egyptian_religion_rebels_demand: "Convert $COUNTRYNAME$"
 egyptian_religion_rebels_demand_desc: "The religious rebels fight for the $RELIGION$ religion. They demand that we recognize its supremacy or at the very least cease our efforts to convert them and let them worship in peace."
 egyptian_religion_rebels_title: "Religious"
 egyptian_religion_rebels_name: "$RELIGION$ Zealots"
 egyptian_religion_rebels_desc: "Religious fanatics tend to rise up in provinces controlled by nations of a different faith. They seek to spread their faith and smite all unbelievers."
 egyptian_religion_rebels_army: "$RELIGION$ Army"
 