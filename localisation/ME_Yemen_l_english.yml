 ME_Yemen_Events.1.t: "The Rasulids in Ruin"
 ME_Yemen_Events.1.d: "The centuries old dynasty of Rasulids is currently in severe decline. Having ruled Yemen for about two centuries, it is collapsing to the growing pressure of the Zaidi imams and internal strife. Everything seems to be pointing to the hint that the Tahirids in [ADE.GetName] are to succeed as the monarchs of Yemen."
 ME_Yemen_Events.1.a: "We will do our best."
 
 ME_Yemen_Events.2.t: "Rise of the Tahirids"
 ME_Yemen_Events.2.d: "The centuries old dynasty of Rasulids is currently in severe decline. Having ruled Yemen for about two centuries, it is collapsing to the growing pressure of the Zaidi imams and internal strife. Everything seems to be pointing to the hint that the Tahirids in [ADE.GetName] are to succeed as the monarchs of Yemen."
 ME_Yemen_Events.2.a: "New Era shines for Yemen!"
 
 ME_Yemen_Events.3.t: "Taiz Captured"
 ME_Yemen_Events.3.d: "[4280.GetName] has fallen to our troops. For two centuries it was the seat of the Rasulid sultans, the city where they kept their court, their treasury and their famous madrasas, and its capture leaves little doubt about who now leads the south of Yemen. Some of our advisors want to move the court to [4280.GetName] at once, to rule from the old royal city and claim the whole of Yemen. Others prefer to stay in [Root.Capital.GetName], where our family's power was built."
 ME_Yemen_Events.3.a: "Make it our capital!"
 ME_Yemen_Events.3.b: "We will remain in [Root.Capital.GetName]"
 
 ME_Yemen_Events.4.t: "Question of Religion"
 ME_Yemen_Events.4.d: "The war has brought many highlanders under our rule who follow the Zaidi imams of [390.GetName] rather than the Sunni scholars of our own court. Their loyalty is doubtful while the imams still preach against us. Our qadis want the Zaidi mosques handed over to Sunni preachers. Others counsel patience, and a few at court have begun to listen to the Shia arguments themselves."
 ME_Yemen_Events.4.a: "Enforce Sunnism!"
 ME_Yemen_Events.4.b: "Let us live in peace, for as long as we can."
 ME_Yemen_Events.4.c: "It sure seems interesting..."
 
 ME_Yemen_Events.5.t: "Fate of the Zaidi Imamate"
 ME_Yemen_Events.5.d: "The struggle between the Zaidi imams of the highlands and the sultans of the lowlands has come to a head. The northern tribes have risen in the imamate's name, and every mosque in the mountains is preaching war. Our ruler has taken the field, and the clergy have rallied behind the banner."
 ME_Yemen_Events.5.a: "Forward!"
 
 ME_Yemen_Events.9.t: "The Expedition to Malaya"
 ME_Yemen_Events.9.d: "Our ships have reached [1361.GetName], the narrow strait through which the trade of China, India and the spice islands must pass. The sultanates of the region are Muslim, most of them following the Sunni scholars of Arabia and India, and they have received our captains with curiosity. The question is what we came for: to bring them the teachings of the imams, to stand by the faithful against their enemies, or simply to take our share of the trade."
 ME_Yemen_Events.9.a: "Let us tell the Sunni the truth about Ali."
 ME_Yemen_Events.9.b: "We must support the Muslims in Malaya."
 ME_Yemen_Events.9.c: "We come for profits and profits only."
 
 ME_Yemen_Events.10.t: "Support from [From.GetName]"
 ME_Yemen_Events.10.d: "A fleet from distant [From.GetName] has anchored in our harbour. Its envoys bring gifts and letters of friendship, and they offer the support of their ships and soldiers to the Muslims of these islands. They ask for little in return beyond our goodwill and an alliance, though our advisors note that the Yemeni merchants would hardly mind easier access to our markets."
 ME_Yemen_Events.10.a: "Yes, we will accept support from fellow muslims."
 ME_Yemen_Events.10.b: "Who are they to help us?"
 
 ME_Yemen_Events.11.t: "Missionaries from [From.GetName]"
 ME_Yemen_Events.11.d: "Preachers from [From.GetName] have been living in our port towns for some months. They follow the imams of Yemen and teach that Ali and his descendants are the rightful leaders of the faithful, and their words have found an audience among our traders and some of the court. They now ask openly that we accept their teaching. In return, [From.GetName] promises friendship and the protection of its fleet."
 ME_Yemen_Events.11.a: "I like that idea."
 ME_Yemen_Events.11.b: "We will not abandon our ways."
 
 ME_Yemen_Events.12.t: "The Yemeni Secret"
 ME_Yemen_Events.12.d: "Every coffee bean that leaves our ports has been roasted or boiled first, so that it will never sprout in foreign soil. The rule is old, and it is the reason the whole world must buy its coffee from us. Our merchants grow rich on it, and our rivals have begun to ask how it is done. As long as no foreign army walks into our coffee country, they will not find out."
 ME_Yemen_Events.12.a: "We shall swear to protect the secret for generations to come."
 
 ME_Yemen_Events.13.t: "The Yemeni Secret"
 ME_Yemen_Events.13.d: "Our merchants have long wondered why no one outside [From.GetName] has ever grown coffee. Every bean they buy in Yemeni ports is dead, roasted or boiled before it is sold. The secret of the living plant lies in the coffee country of [From.GetName], and if our soldiers ever held those hills, it would be ours for the taking."
 ME_Yemen_Events.13.a: "It will be ours!"
 
 ME_Yemen_Events.14.t: "The Secret Found"
 ME_Yemen_Events.14.d: "While our troops held one of the Yemeni coffee districts, an officer bought the truth from a local farmer for a handful of coins. The Yemenis have kept their monopoly with a simple trick: no bean leaves their ports unless it has been roasted or boiled first. A sack of green seed, carried home in our baggage, will grow in any hills with enough rain and shade."
 ME_Yemen_Events.14.a: "Well, isn't that just convenient."
 
 ME_Yemen_Events.15.t: "The Secret Found!"
 ME_Yemen_Events.15.d: "Foreign soldiers have walked through our coffee country, and the secret has walked out with them. Somewhere beyond our borders, green coffee seed is already in the ground. Our merchants will not be the only sellers for long, and the buyers who once paid whatever we asked will soon have other choices."
 ME_Yemen_Events.15.a: "There goes our wealth, I guess."
 
 ME_Yemen_Events.17.t: "Centralized Frankincense"
 ME_Yemen_Events.17.d: "Frankincense has been gathered from the trees of southern Arabia since the days of the old kingdoms of Saba and Hadramawt, and the temples and churches of the world still burn it. Most of what reaches the markets now passes through our hands. Our merchants propose that we stop competing with ourselves: one set of buyers, one price, and that price set in our ports."
 ME_Yemen_Events.17.a: "It smells great!"
 
 ME_Yemen_Events.18.t: "Zaidi Superiority"
 ME_Yemen_Events.18.d: "An envoy from [From.GetName] has come before our elders. The envoy demands that our tribes accept the Zaidi teaching and the authority of [From.Monarch.GetName], and has made it plain that the demand will not be repeated. We hold to a different branch of the faith, but we have neither the walls nor the men to resist for long. In return for our submission, [From.GetName] promises protection and a place in its realm."
 ME_Yemen_Events.18.a: "We are defenseless tribes, submit to [From.Monarch.GetName]."
 ME_Yemen_Events.18.b: "Execute the envoy! We will not bend the knee."
 
 ME_Yemen_Events.19.t: "The Marib Dam" 
 ME_Yemen_Events.19.d: "The Sadd Ma'rib was said to be build around 1750 BC to 8th century BC by the ancient kingdom of Saba'. It provided great prosperity to the great nation, making the people's quality of life better. However, the dam was slowly decaying over the centuries, causing for it to crumble and becoming useless. Thousands of the nearby citizens fled from the vicinity to migrate in the north. With the restoration of the dam, it should attract citizens to the vicinity, foreigners even, to aid the growth and prosperity of our country."
 ME_Yemen_Events.19.a: "Let it bring prosperity to our people!"
 
 ME_Yemen_Events.20.t: "New Coffee Plantations"
 ME_Yemen_Events.20.d: "Coffee has become the most profitable crop in the realm, and landowners elsewhere want a share of it. The terraced hills and cool highlands the plant needs are limited, but our surveyors have found a few districts where it could take root. We can turn the fields of one of them over to coffee."
 ME_Yemen_Events.20.a: "Why, yes let us pick §Y[Yemen_target_1.GetName]§!."
 ME_Yemen_Events.20.b: "I prefer §Y[Yemen_target_2.GetName]§!."
 ME_Yemen_Events.20.c: "§Y[Yemen_target_3.GetName]§! is the obvious pick here."
 ME_Yemen_Events.20.e: "I put my faith in §Y[Yemen_target_4.GetName]§!."
 ME_Yemen_Events.20.f: "I choose you, §Y[Yemen_target_5.GetName]§!."
 ME_Yemen_Events.20.g: "I changed my mind."
 
