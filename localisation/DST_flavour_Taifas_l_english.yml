 desc_alc_qadis_shipyards_modifier: "The yards of Qadis build our ships cheaply and well."
 alc_licensed_corsairs_modifier: "Licensed Corsairs"
 desc_alc_licensed_corsairs_modifier: "Our corsairs sail with letters and take Christian ships openly."
 alc_quiet_sea_lanes_modifier: "Quiet Sea Lanes"
 desc_alc_quiet_sea_lanes_modifier: "Merchants pass the Strait in peace, and pay for the privilege."
 alc_malaqah_silk_modifier: "Silk of Malaqah"
 desc_alc_malaqah_silk_modifier: "Malaqah's silk, figs and gilded pottery sell in every Mediterranean port."
