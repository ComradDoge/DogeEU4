 aln_guadiana_claims_tt: "Gain permanent claims on §YBatalyaws§!, §YHuelva§! and §YIsbiliya§! if we don't own them."
 taifa_one_taifa_cores_tt: "Every province we own in §YLower Andalucia§!, §YUpper Andalucia§! and the §YAlentejo§! becomes a core."
 taifa_claim_al_andalus_tt: "Gain permanent claims on every province of §YAl-Andalus§! (the Alentejo, both Andalucias, Toledo and Extremadura) we don't own."
 taifa_garnatah_tt: "We own §YGarnatah§!, or §YGranada§! is our subject"
