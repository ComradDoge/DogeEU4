 taifa_three_iberian_forts_tt: "Owns at least §Y3§! provinces in §YIberia§! with a fort"

 # ---- Events
 taifa_events.1.t: "The Taifa Kings"
 taifa_events.1.d: "Within living memory the Crown of Castile broke apart in a single season, for reasons no faqih or astrologer has managed to explain. The kings who once threatened every city on the Guadalquivir are gone, and in their place lesser lords hold Valladolid, León and Tulaytullah (Toledo). For the first time in generations the north is weaker than the south. The question in [Root.Capital.GetName] is not whether to use that, but where to begin."
 taifa_events.1.a: "Our neighbours first"
 taifa_events.1.a.tt: "Gain a permanent claim on the capital of every other §Ytaifa§! (Isbiliya, Jabal Tariq, the Algarve) we don't own."
 taifa_events.1.b: "The Christian frontier"
 taifa_events.1.b.tt: "Gain claims on every province of §YToledo§!, §YExtremadura§! and the §YAlentejo§! that borders us and is held by a non-Muslim ruler."
 taifa_events.1.c: "Put our own house in order"
 taifa_events.2.t: "Envoys from the Maghreb"
 taifa_events.2.d: "Envoys from [taifa_maghrebi_court.GetName] have crossed the Strait with gifts and an offer. Their master will send horsemen and volunteers to stand with us, in return for an alliance and a louder voice for the ulama at our court. Our own ministers are less sure. Help from Africa has saved al-Andalus before, and it has also taken it over."
 taifa_events.2.d2: "No court across the Strait is free to answer us now, but the question has been raised at court all the same. Some want to call on the faithful of the Maghreb, whoever leads them, and give the ulama their way. Others say al-Andalus has always been strongest when it stood on its own, with its scholars, its merchants and its walls."
 taifa_events.2.a: "Call the Maghreb"
 taifa_events.2.a.tt: "We take the §YMaghrebi path§!. If a Maghrebi court can answer, we ally with it and gain §G+50§! opinion of each other. The §Yulama§! gain §R+10§! influence for 10 years."
 taifa_events.2.b: "We keep our own counsel"
 taifa_events.2.b.tt: "We take the §YAndalusi way§!."
 taifa_ulama_called_the_maghreb: "Called the Maghreb"
 taifa_events.3.t: "The Homage of Qurtuba"
 taifa_events.3.d: "An embassy from [From.GetName] has arrived, with a letter read aloud in the name of the lord of Qurtuba. It reminds us that the caliphs once ruled all al-Andalus from that city, and asks us to recognise its master as our overlord. Refusal, the envoy adds, would be remembered."
 taifa_events.3.a: "We bow to Qurtuba"
 taifa_events.3.b: "We bow to no one"
 taifa_events.4.t: "The Answer from [From.GetName]"
 taifa_events.4.d: "Our envoys have returned from [From.GetName]. Its ruler has accepted our letter and will acknowledge the lord of Qurtuba as overlord."
 taifa_events.4.d2: "Our envoys have returned from [From.GetName] with nothing but insults. Its ruler will not bow, and has said so in front of the whole court."
 taifa_events.4.a: "As it should be"
 taifa_events.4.b: "Then we will take it"
 taifa_events.4.b.tt: "We have a permanent claim on the capital of §Y[From.GetName]§!."
 taifa_events.5.t: "The Giralda"
 taifa_events.5.d: "The great mosque of Isbiliya has been restored, and the argument over its minaret has reached the throne. The ulama say the tower belongs to the muezzin and to God. The governor points out that it is also the best lookout in the city, from which a watchman can see ships on the river and riders on the plain long before anyone else."
 taifa_events.5.a: "The tower is for the call to prayer"
 taifa_events.5.b: "Put the watch up there too"
 taifa_events.6.t: "The Corsairs of the Strait"
 taifa_events.6.d: "Our galley captains have done well in the Strait, perhaps too well. The merchants of Qadis complain that foreign ships now avoid our harbours, while the captains ask for letters that would let them take Christian ships openly and bring their prizes home to be sold."
 taifa_events.6.a: "Give them letters"
 taifa_events.6.b: "Keep the sea lanes quiet"
 taifa_events.7.t: "Friends Across the Water"
 taifa_events.7.d: "[taifa_maghrebi_court.GetName] has answered our letters warmly. Its ruler offers a marriage between our houses and a treaty to go with it. Our merchants would rather have the grain ships, which cross the Strait every summer whatever the princes do."
 taifa_events.7.d2: "There is no court across the Strait free to treat with us, but the ports on the African shore still trade with ours. Grain, horses and leather come across every summer, and our merchants say there is more to be had."
 taifa_events.7.a: "A marriage across the Strait"
 taifa_events.7.a.tt: "If a Maghrebi court can answer, we marry into its house and ally with it, and it gains §G+50§! opinion of us."
 taifa_events.7.b: "Grain and ships across the water"
 taifa_events.8.t: "The Mughararin"
 taifa_events.8.d: "The geographer al-Idrisi tells of eight cousins from Lixbuna (Lisboa) who sailed west into the Ocean to find where it ended, and came back with stories of islands of sheep and men with red hair. People still call them the Mughararin, the adventurers. Now a group of pilots at our new school wants to try the same, if we pay for the ship."
 taifa_events.8.a: "Fit out a ship for them"
 taifa_events.8.b: "The Ocean has no bottom and no end"
 taifa_events.9.t: "The Fortunate Isles"
 taifa_events.9.d: "Our flag flies over Tenerife. The island is fertile, its mountain catches the rain, and its harbours could shelter any ship sailing south along the African coast. The question is whether to bring settlers or simply keep it as a port."
 taifa_events.9.a: "Settle the islands"
 taifa_events.9.b: "A port of call for our ships"
 taifa_events.10.t: "Lixbuna"
 taifa_events.10.d: "Lixbuna is ours, with its harbour, its hills and a population that does not share our faith. The merchants want the city left as it is, so trade can go on. The ulama want settlers from the south brought in and the city given a new character."
 taifa_events.10.a: "Leave the city as it is"
 taifa_events.10.b: "Bring settlers from the south"
 taifa_events.11.t: "Garnatah"
 taifa_events.11.d: "Garnatah has fallen to us, and with it the palace on the hill, its courts and fountains intact. Its old ruling house is in our hands. We could move our court into the palace, or leave the family to govern the city in our name."
 taifa_events.11.a: "Hold court in the palace"
 taifa_events.11.b: "Leave them a governorship"
 taifa_events.12.t: "Tulaytullah"
 taifa_events.12.d: "Tulaytullah is ours. Its scholars are famous for their tables of the stars and their translations, and its churches and synagogues stand beside its mosques. Its walls are also the strongest on the northern frontier. Our governors cannot decide which matters more."
 taifa_events.12.a: "Keep its scholars and its churches"
 taifa_events.12.b: "Make it a frontier stronghold"
 taifa_events.13.t: "The Minbar of Qurtuba"
 taifa_events.13.d: "The preacher of the great mosque has asked whose name he should read in the Friday sermon. Our own would tell all al-Andalus who rules here. The memory of the caliphs would please the ulama and offend no one, but it would also remind everyone that we are not caliphs ourselves."
 taifa_events.13.a: "In our own name"
 taifa_events.13.b: "In memory of the caliphs"
 taifa_events.14.t: "The Volunteers of the Faith"
 taifa_events.14.d: "The volunteers who came across the Strait have fought well, but they are restless in garrison and expensive to keep. Their captains ask for land on the frontier where they can settle with their families. Our treasurer would rather pay them off and send them home."
 taifa_events.14.a: "Give them land on the frontier"
 taifa_events.14.b: "Pay them and send them home"
 taifa_events.15.t: "The Toledan Frontier"
 taifa_events.15.d: "Riders from [taifa_toledo.GetName] have crossed the border again, burning farms and driving off cattle. The Toledans call it a holy war. Our frontier lords want to ride after them. Others say it would be cheaper to pay the raiders to go home."
 taifa_events.15.d2: "Merchants from [taifa_toledo.GetName] have come to our border towns with a safe-conduct and an offer from their ruler: open markets on both sides of the frontier and a truce between the garrisons."
 taifa_events.15.a: "Ride after the raiders"
 taifa_events.15.b: "Pay them to leave"
 taifa_events.15.c: "Open the market to them"
 taifa_events.15.e: "Send them back across the border"
 taifa_events.16.t: "The Poet-Kings"
 taifa_events.16.d: "Our court has become what the courts of al-Andalus are remembered for: poets competing in the gardens, astronomers on the roofs, physicians and jurists arguing in the library. This year the prize at the spring gathering is ours to award."
 taifa_events.16.a: "The prize goes to the poets"
 taifa_events.16.b: "The prize goes to the astronomers"
 taifa_events.17.t: "The Zealots"
 taifa_events.17.d: "Since we called on the Maghreb, the preachers who came with the volunteers have grown bold. They demand that the court give up wine and music, and that Christians and Jews pay more and keep out of sight. The ulama of our own cities are inclined to agree with them."
 taifa_events.17.a: "Give way to them"
 taifa_events.17.b: "The court decides, not the pulpit"

