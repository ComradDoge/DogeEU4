 alc_ceuta_held_or_allied_tt: "§YCeuta§! is held by us or our subject, or its owner is our ally with at least §Y100§! opinion of us"
 alc_friends_across_the_water_tt: "We hold §YCeuta§!, or a Muslim country ruling from the §YMaghreb§! is our ally or has at least §Y100§! opinion of us"
