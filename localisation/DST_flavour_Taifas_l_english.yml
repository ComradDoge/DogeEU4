l_english:

 # The Taifas (SEV, ALC, ALN): missions/_MIS_Taifa_Missions.txt, events/_DSE_flavour_Taifas.txt

 # ---- Sevilla
 sev_the_golden_tower_title: "The Golden Tower"
 sev_the_golden_tower_desc: "The twelve-sided tower on the Guadalquivir guards the river port of Isbiliya, and a chain stretched from it to the far bank can close the river to any fleet. Ships from the Ocean and barges from upriver unload beneath it. A proper exchange by the quays, or simply a larger city, would keep more of that trade in our hands."
 sev_the_guadalquivir_title: "The Guadalquivir"
 sev_the_guadalquivir_desc: "Every bale of wool from Qurtuba and every jar of oil from the Aljarafe hills west of the city goes down the Guadalquivir to Isbiliya before it goes anywhere else. Whoever commands the river commands the trade of the whole south. Our merchants should be the ones setting its prices."
 sev_the_giralda_title: "The Giralda"
 sev_the_giralda_desc: "The minaret of the great mosque of Isbiliya is the tallest tower in al-Andalus, and from its top the muezzin can be heard across half the city. The ulama hold that it belongs to the call to prayer alone. The city governor would like to put watchmen up there as well. A properly endowed mosque would settle who gets their way."
 sev_the_house_of_trade_title: "The House of Trade"
 sev_the_house_of_trade_desc: "Isbiliya already gathers the trade of the Guadalquivir. If its merchants also came to dominate the coast from Qadis to the Algarve, the city could become the counting house of the whole Ocean trade, with its own house for weighing, taxing and licensing every cargo that passes."
 sev_the_mezquita_title: "The Mezquita"
 sev_the_mezquita_desc: "The great mosque of Qurtuba was begun by Abd al-Rahman I in 785 and enlarged by every ruler who could afford it, until its forest of red and white arches covered a whole quarter of the city. It needs constant repair. Restoring it would show that the old capital still has a patron."
 sev_qurtuba_the_old_capital_title: "Qurtuba, the Old Capital"
 sev_qurtuba_the_old_capital_desc: "For a century Qurtuba was the seat of the caliphs and the largest city in the West. Whoever holds it has a better claim than anyone to speak for al-Andalus. If we restore the city, we can ask the other taifa kings to acknowledge that, and see who bows."
 sev_the_badajoz_march_title: "The Badajoz March"
 sev_the_badajoz_march_desc: "Batalyaws, on the Guadiana, is our gate to the north-west. Beyond it lie the Leonese towns of Caceres and Plasencia. A strong fortress at Batalyaws and an army to back it would turn a frontier we defend into one we can push forward."
 sev_the_minbar_of_qurtuba_title: "The Minbar of Qurtuba"
 sev_the_minbar_of_qurtuba_desc: "Every Friday the preacher in the great mosque names the ruler the city recognises. Under the caliphs that name carried across al-Andalus. A prosperous Qurtuba and a secure throne would let us decide whose name is read there now."
 sev_heirs_of_qurtuba_title: "Heirs of Qurtuba"
 sev_heirs_of_qurtuba_desc: "If Isbiliya, Jabal Tariq and the Algarve all answer to us, and Qurtuba is once again a great city, no court in al-Andalus can match ours. The envoys of every prince on both shores would come to us first."

 # ---- Algeciras
 alc_the_shipyards_of_qadis_title: "The Shipyards of Qadis"
 alc_the_shipyards_of_qadis_desc: "Qadis sits on its island at the edge of the Ocean and has built ships for as long as anyone remembers. Our realm is small and most of it is coast. If we are to matter at all, it will be at sea, and that starts in the yards of Qadis."
 alc_the_corsairs_of_the_strait_title: "The Corsairs of the Strait"
 alc_the_corsairs_of_the_strait_desc: "Light galleys from our harbours already take what they can from careless merchants in the Strait. With enough ships of our own, we could decide whether that becomes licensed war on our enemies' trade or something we put an end to."
 alc_malaqah_title: "Malaqah"
 alc_malaqah_desc: "Malaqah ships figs, raisins and silk to every port of the Mediterranean, and its potters' gilded ware is sold as far as Cairo. Workshops or a proper market there would make the city as rich as its reputation."
 alc_the_strait_toll_title: "The Strait Toll"
 alc_the_strait_toll_desc: "Jabal Tariq on our shore and Ceuta on the African one face each other across the narrowest part of the Strait. Whoever holds both, or holds one and is friends with the other, can make every passing ship pay."
 alc_lord_of_the_strait_title: "Lord of the Strait"
 alc_lord_of_the_strait_desc: "With a real fleet, a great port at Qadis and the Sevilla trade running through our harbours, we would no longer be the smallest of the taifas. We would be the power every ship between the Ocean and the Mediterranean has to reckon with."
 alc_the_rock_title: "The Rock"
 alc_the_rock_desc: "Jabal Tariq, the mountain of Tariq, is named for the commander who landed beneath it in 711. It is little more than a rock, a castle and a fishing town, but it is the key to the Strait. It needs walls worthy of it, or at least more people to hold them."
 alc_friends_across_the_water_title: "Friends Across the Water"
 alc_friends_across_the_water_desc: "From the castle on the Rock you can see Africa on a clear day. The courts on the far shore are close kin to ours in faith and trade, and closer by sea than most of al-Andalus is by road. Good relations with them, or a foothold at Ceuta, would give us a second shore to lean on."
 alc_the_coast_of_al_andalus_title: "The Coast of al-Andalus"
 alc_the_coast_of_al_andalus_desc: "Our ships can reach any harbour from Huelva to Marriya in a few days, faster than any army can march. If we hold both ends of that coast, every port in between becomes ours to take."

 # ---- Alentejo
 aln_the_fisheries_of_shilb_title: "The Fisheries of Shilb"
 aln_the_fisheries_of_shilb_desc: "The tuna run past the Algarve coast every spring, and the salt pans of the coast keep the catch through the winter. Better harbours, or a larger town at Shilb, would feed half the Gharb and send the surplus east."
 aln_the_school_at_sagres_title: "The School at Sagres"
 aln_the_school_at_sagres_desc: "At the south-western point of the Algarve the land ends in cliffs, and beyond them is the Ocean the geographers call the Sea of Darkness. Pilots and chart-makers gather in the harbours there. A school for them, or a larger and richer port, would show what lies to the west."
 aln_the_fortunate_isles_title: "The Fortunate Isles"
 aln_the_fortunate_isles_desc: "The geographers place the Fortunate Isles in the Ocean south-west of the Algarve, and our fishermen already know the way. Tenerife, the largest, rises to a mountain that can be seen from far out at sea. Whoever settles them will have a harbour halfway to the unknown."
 aln_the_sea_of_darkness_title: "The Sea of Darkness"
 aln_the_sea_of_darkness_desc: "Bahr al-Zulumat, the Sea of Darkness, is what the Andalusi geographers call the Ocean west of the Gharb. Once our ships have found land beyond it and come back, the name will be a story we tell, not a warning."
 aln_the_tagus_line_title: "The Tagus Line"
 aln_the_tagus_line_desc: "Santarém in the Ribatejo looks down the Tagus toward Lixbuna (Lisboa) and its harbour, one of the finest on the Ocean. Before we can think of the city, the river line has to be ours and fortified."
 aln_evora_and_beja_title: "Évora and Beja"
 aln_evora_and_beja_desc: "The plains around Évora and Beja are dry, but they grow wheat, and the cork oaks on their low hills give bark that every vintner and fisherman wants. Well kept, they can feed our armies and pay for them."
 aln_up_the_guadiana_title: "Up the Guadiana"
 aln_up_the_guadiana_desc: "The Guadiana runs from Batalyaws past our eastern border down to the sea at Huelva. The towns along it, and Isbiliya beyond, are closer to us than to any other court that could claim them. An army ready to march up the river would remind them of that."
 aln_lixbuna_title: "Lixbuna"
 aln_lixbuna_desc: "Lixbuna (Lisboa) sits on its hills over the widest harbour of the Ocean coast, and it is the jewel of the Gharb. Taking it would make the Algarve the master of the whole Atlantic shore."

 # ---- Al-Andalus
 taifa_the_taifa_kings_title: "The Taifa Kings"
 taifa_the_taifa_kings_desc: "Al-Andalus has no caliph and has not had one for centuries. Its cities are ruled by taifa kings, each with his own court, his own poets and his own army, and each convinced that he alone should rule the others. Before we can rise above them, we have to secure our own throne."
 taifa_one_taifa_title: "One Taifa"
 taifa_one_taifa_desc: "Three courts, at Isbiliya, Jabal Tariq and the Algarve, each claim to speak for the south-west of al-Andalus. When all three answer to one ruler, the claim will be ours alone, and every city from the Guadiana to the Tagus will be within reach."
 taifa_garnatah_title: "Garnatah"
 taifa_garnatah_desc: "Garnatah in its mountains is the oldest and proudest of the taifas, and its palace on the hill is famous wherever Arabic is read. No one can call himself master of al-Andalus while Garnatah answers to someone else."
 taifa_the_northern_frontier_title: "The Northern Frontier"
 taifa_the_northern_frontier_desc: "Tulaytullah (Toledo) on the Tagus was once a capital of kings and is still the greatest city of the frontier, with Christian, Jewish and Muslim quarters crowded together on its rock. Holding it and the lands around it would push our frontier into the heart of the peninsula."
 taifa_extremadura_title: "Extremadura"
 taifa_extremadura_desc: "Between the Guadiana and the mountains of the north lie the high pastures of Extremadura, with Batalyaws, Caceres and Plasencia guarding the roads. Whoever holds them closes the western road into al-Andalus."
 taifa_al_andalus_title: "Al-Andalus"
 taifa_al_andalus_desc: "From the Ocean shore of the Gharb to the walls of Tulaytullah and the mountains of Garnatah, the lands of al-Andalus would answer to one ruler. All that remains is to claim the name."

 # ---- The Maghreb
 taifa_envoys_from_the_maghreb_title: "Envoys from the Maghreb"
 taifa_envoys_from_the_maghreb_desc: "The courts across the Strait watch al-Andalus closely. They share our faith and much of our blood, and they have soldiers to spare. Their envoys are ready to listen, but help from Africa has always come with a price."
 taifa_faith_and_court_title: "Faith and Court"
 taifa_faith_and_court_desc: "A taifa is held together by two things: the support of its friends and the loyalty of its own people. If we called the Maghreb, our alliance there has to be made firm. If we chose our own way, the ulama and the merchants of our cities must both stand behind the throne."
 taifa_the_people_of_the_frontier_title: "The People of the Frontier"
 taifa_the_people_of_the_frontier_desc: "Somebody has to live on the frontier and defend it. If the Maghreb has sent us its volunteers, they need horses, captains and a home. If we keep our own counsel, the Christians and Jews of our cities are our people too, and their goodwill is worth an army."
 taifa_the_ribats_title: "The Ribats"
 taifa_the_ribats_desc: "A ribat is a fortified post on the frontier, held by men who chose to stand there. Whether they are filled with volunteers of the faith or simply with good walls and paid garrisons, al-Andalus needs a line of them that the Christians cannot break."
 taifa_the_pride_of_al_andalus_title: "The Pride of al-Andalus"
 taifa_the_pride_of_al_andalus_desc: "Every taifa king wants to be remembered for something. On the Maghrebi road it would be the banner that rode into Tulaytullah or Lixbuna. On the Andalusi way it would be a court so learned and so splendid that poets in Cairo and Fez still sing of it."

